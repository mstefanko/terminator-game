  sfx('clang');drainFx('spark',t1000.x,t1000.y-12);
  G.bannerTxt=grenade?'GRENADE -1 HP':'SHOT -1 HP';G.bannerT=50;
  if(DR.truckHP<=0)drainRoleChecks();
}
function drainGuardDraw(){
  if(G.role!=='t1000')return;
  if(DR.guardWind>0){
    const a=DR.guardAim,col=DR.guardWind<=CFG.DRAIN_GUARD_LOCK?'b':'d';
    drainDash(t800.x,t800.y-8,a.x,a.y,col,G.tick%6,3,3);
    millRing(Math.round(a.x),Math.round(a.y),5,col);
    textOutlined(bctx,DR.guardWind<=CFG.DRAIN_GUARD_LOCK?'LOCK':'AIM',Math.round(t800.x)-8,Math.round(t800.y)-29,col);
  }
  for(const s of DR.guardSlugs){drainLine(s.x-s.vx*2,s.y-s.vy*2,s.x,s.y,'d');fillBox(Math.round(s.x)-1,Math.round(s.y)-1,3,3,'1');}
}
// Choose a genuine escape lane at an edge instead of clamping the dodge in place.
function drainJohnEscape(side,range,error=0){
  let x=john.x+side*range;
  if(x<CFG.DRAIN_CANAL_L||x>CFG.DRAIN_CANAL_R)x=john.x-side*range;
  return clamp(x+error,CFG.DRAIN_CANAL_L,CFG.DRAIN_CANAL_R);
}

// Damage to the truck. In the John role the road cannot wreck it, so it keeps at least 1 HP there.
function drainTruckHurt(n){
  DR.truckHP = Math.max(G.role === 'john' ? 1 : 0, DR.truckHP - n);
  DR.truckHurt = 12;
  // The windshield cracks the first time HP drops past each threshold (66 and 33 percent).
  const frac = DR.truckHP / DR.truckMaxHP;
  if (DR.crackLv < 1 && frac <= CFG.DRAIN_CRACK_AT[0]){ DR.crackLv = 1; DR.crackT = 12; }
  if (DR.crackLv < 2 && frac <= CFG.DRAIN_CRACK_AT[1]){ DR.crackLv = 2; DR.crackT = 12; }
}

// Obstacle kind to the sound it makes when hit.
const DRAIN_OBST_SND = {cart: 'clatter', block: 'thud', puddle: 'slosh', pillar: 'crash', barrel: 'clatter', oil: 'slosh', debris: 'thud', wreck: 'crash'};
// Stun and push for a solid obstacle kind that a bike hits.
function drainHitSpec(k){
  if (k === 'cart') return [CFG.DRAIN_CART_STUN, CFG.DRAIN_CART_PUSH];
  if (k === 'barrel') return [CFG.DRAIN_BARREL_STUN, CFG.DRAIN_BARREL_PUSH];
  if (k === 'wreck') return [CFG.DRAIN_WRECK_STUN, CFG.DRAIN_WRECK_PUSH];
  return [CFG.DRAIN_BLOCK_STUN, CFG.DRAIN_BLOCK_PUSH];
}
// Knock a bike: stun for the given ticks, push it down the canal, and play the sound.
// T-1000 round (A3): AI John takes no stun from obstacles. He only swerves (the push) and the sound plays; only the truck hurts him.
function drainKnock(a, key, stun, push, snd){
  if (!(key === 'j' && G.role === 't1000')) DR[key + 'Stun'] = Math.max(DR[key + 'Stun'], stun);
  a.y = Math.min(CFG.DRAIN_Y_MAX, a.y + push);
  sfx(snd);
}

// A hit effect at a point: scattered pixels for the obstacle kind (cart bits, block sparks, puddle splash, pillar sparks).
function drainFx(kind, x, y){
  DR.fx.push({kind, x, y, t: CFG.DRAIN_FX_T});
}

// A bike meets carts, blocks, puddles and pillars. Carts and blocks stun it and push it down; a puddle slows it (not during a wheelie).
function drainBikeHit(a, key, w, h){
  for (const o of DR.obst){
    // Falling debris is only a shadow until it lands, so a bike passes under it.
    if (o.fall > 0 || o.seen[key] || !drainBoxHit(o.x + o.w / 2, o.y + o.h / 2, o.w, o.h, a.x, a.y, w, h)) continue;
    o.seen[key] = true;
    // A ramp is not a knock: a bike that rides over it takes a jump (John only; the Harley just rolls over it).
    if (o.k === 'ramp'){ if (key === 'j' && DR.air <= 0){ DR.air = CFG.DRAIN_JUMP_T; sfx('clang'); } continue; }
    if (o.k === 'puddle'){
      if (!(key === 'j' && DR.wheelieT > 0)){ DR[key + 'Slow'] = CFG.DRAIN_PUDDLE_TICKS; sfx(DRAIN_OBST_SND.puddle); drainFx('puddle', a.x, a.y); }
      continue;
    }
    if (o.k === 'oil'){
      // Oil is a skid, not a knock: 40 ticks of weak steering and drift.
      if (!(key === 'j' && DR.wheelieT > 0)){ DR[key + 'Skid'] = CFG.DRAIN_OIL_SKID; sfx(DRAIN_OBST_SND.oil); drainFx('puddle', a.x, a.y); }
      continue;
    }
    const [stun, push] = drainHitSpec(o.k);
    drainKnock(a, key, stun, push, DRAIN_OBST_SND[o.k]);
    drainFx(o.k, a.x, a.y);
  }
  for (const b of DR.bands) for (const p of b.pillars){
    if (p.seen[key] || !drainBoxHit(p.x + 4, b.y + p.y0 + 6, 8, 12, a.x, a.y, w, h)) continue;
    p.seen[key] = true;
    drainKnock(a, key, CFG.DRAIN_PILLAR_STUN, CFG.DRAIN_PILLAR_PUSH, DRAIN_OBST_SND.pillar);
    drainFx('pillar', a.x, a.y);
  }
}

// The truck meets carts (smashed; +50 in the T-1000 role), blocks (1 HP), puddles (slow) and pillars (3 HP and a 30-tick stall).
function drainTruckHits(tr){
  for (const o of DR.obst){
    if (o.fall > 0 || o.seen.t || !drainBoxHit(o.x + o.w / 2, o.y + o.h / 2, o.w, o.h, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)) continue;
    o.seen.t = true;
    const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
    if (o.k === 'puddle'){ DR.truckSlow = CFG.DRAIN_PUDDLE_TICKS; sfx(DRAIN_OBST_SND.puddle); drainFx('puddle', ox, oy); continue; }
    if (o.k === 'oil' || o.k === 'ramp') continue; // the truck does not skid on oil and takes no jump
    o.gone = true;
    sfx(DRAIN_OBST_SND[o.k]); drainFx(o.k, ox, oy);
    // Carts and barrels are smashed (a cart is worth points in the T-1000 role). Blocks and wrecks do no damage; debris costs 1 HP, at most DRAIN_DEBRIS_MAX times per run.
    if (o.k === 'cart' || o.k === 'barrel'){ if (G.role === 't1000' && o.k === 'cart') addScore('cart', CFG.DRAIN_CART_PTS); }
    else if (o.k === 'debris' && DR.debrisHits < CFG.DRAIN_DEBRIS_MAX){ DR.debrisHits++; drainTruckHurt(CFG.DRAIN_DEBRIS_HP); }
  }
  DR.obst = DR.obst.filter(o => !o.gone);
  for (const b of DR.bands) for (const p of b.pillars){
    if (p.seen.t || !drainBoxHit(p.x + 4, b.y + p.y0 + 6, 8, 12, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)) continue;
    p.seen.t = true;
    DR.truckStall = CFG.DRAIN_PILLAR_STALL; DR.shake = 8;
    if (DR.surgeMode !== 'idle') DR.surgeMode = 'back';
    sfx(DRAIN_OBST_SND.pillar); drainFx('pillar', tr.x, b.y + p.y0 + 6); floatAt(tr.x - 10, tr.y - 30, 'PILLAR', 'b');
  }
}

// Bump on a bike: i-frames, shake, and a shove up the canal. A rush hit also stuns John for `stun` ticks.
function drainBump(a, ifKey, stun){
  DR[ifKey] = CFG.DRAIN_BUMP_IF; DR.shake = CFG.DRAIN_BUMP_SHAKE;
  if (stun > 0 && a === john) DR.jStun = Math.max(DR.jStun, stun);
  a.y = clamp(a.y - CFG.DRAIN_BUMP_UP, CFG.DRAIN_Y_MIN, CFG.DRAIN_Y_MAX);
  sfx('crash');
}

// Truck bumps: any overlap with the truck body is a hit, in any surge mode (not in i-frames). A rush or side-swipe hit also stuns. What counts depends on the role.
function drainBumps(tr, jTruck, jOnH){
  const stun = (DR.surgeMode === 'rush' || DR.swiping) ? CFG.DRAIN_RUSH_STUN : 0;
  const role = G.role;
  if (DR.bumpCD > 0) DR.bumpCD--;
  if (jTruck && !jOnH && DR.iJ <= 0 && drainBoxHit(john.x, john.y, CFG.DRAIN_BIKE_W, CFG.DRAIN_BIKE_H, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)){
    if (DR.swiping) DR.swipeHit = true; // a side-swipe that connects is not a whiff
    // John role: a lunge or swipe charge hurts. A passive contact only nudges him forward (no damage, 30-tick cooldown), unless he is pinned at the bottom edge, where the truck crushes him.
    const charging = DR.swiping || DR.surgeMode === 'rush';
    const pinned = john.y >= CFG.DRAIN_Y_MAX - 0.5;
    if (role === 'john' && !charging && !pinned){
      if (DR.bumpCD <= 0){
        DR.bumpCD = CFG.DRAIN_PASS_CD; john.y = clamp(john.y - CFG.DRAIN_PASS_PX, CFG.DRAIN_Y_MIN, CFG.DRAIN_Y_MAX);
        sfx('bump');
      }
    } else if (role === 'john'){
      DR.bumpsJ++; drainBump(john, 'iJ', stun);
      if (DR.bumpsJ >= CFG.DRAIN_BUMPS_J){ drainEnd(false, 'RUN DOWN', 'JOHN CONNOR', false); return; }
    } else if (role === 't1000'){
      if (charging && !DR.ramHit){
        DR.ramHit = true; DR.rams++; drainBump(john, 'iJ', stun); DR.iJ = CFG.DRAIN_RAM_IF;
        G.bannerTxt = 'RAM ' + DR.rams + ' OF ' + CFG.DRAIN_RAMS; G.bannerT = 60;
        if (DR.rams >= CFG.DRAIN_RAMS){ drainEnd(true, 'RAN DOWN', 'RAN HIM DOWN', false); return; }
      } else if (DR.bumpCD <= 0){
        // Body contact opens space but cannot win while idling or retreating.
        DR.bumpCD = CFG.DRAIN_PASS_CD; john.y = clamp(john.y - CFG.DRAIN_PASS_PX, CFG.DRAIN_Y_MIN, CFG.DRAIN_Y_MAX);
      }
    } else {
      DR.pickHits++; drainBump(john, 'iJ', stun);
      if (DR.pickHits >= CFG.DRAIN_PICK_HITS){ drainEnd(false, 'JOHN WAS RUN DOWN', 'T-800 TERMINATED', false); return; }
    }
  }
  if (role === 't800' && DR.pickOn && DR.iH <= 0 &&
      drainBoxHit(t800.x, t800.y, CFG.DRAIN_HARLEY_W, CFG.DRAIN_HARLEY_H, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)){
    DR.bumpsH++; drainBump(t800, 'iH', 0);
    if (DR.bumpsH >= CFG.DRAIN_BUMPS_H) drainEnd(false, 'RUN OFF THE ROAD', 'T-800 TERMINATED', false);
  }
}

// Collisions: the bikes against carts, blocks, puddles and pillars; the truck against the road and the bikes.
function drainHits(){
  const tr = t1000, role = G.role;
  // A lethal grenade wins before the truck can inflict a same-tick collision loss.
  if(role==='t800'){ drainGrenadesStep(); if(DR.ended)return; }
  const jLive = DR.air <= 0 && DR.jumpT < 0;   // ground obstacles miss an airborne John
  const jTruck = DR.jumpT < 0;                 // the truck hits him in the air too (landing on it is a hit)
  const jOnH = role === 't800' && DR.pickOn;
  const hLive = role === 't800' || DR.harleyIn;
  if (jLive && !jOnH) drainBikeHit(john, 'j', CFG.DRAIN_BIKE_W, CFG.DRAIN_BIKE_H);
  if (hLive) drainBikeHit(t800, 'h', CFG.DRAIN_HARLEY_W, CFG.DRAIN_HARLEY_H);
  drainTruckHits(tr);
  if(role!=='t800')drainGrenadesStep();
  else if(DR.truckHP<=0)drainRoleChecks();
  if (DR.ended) return;
  if (role !== 't1000') drainLeanHits(tr, jLive, jOnH, hLive);
  drainBumps(tr, jTruck, jOnH);
}

// End checks: the truck wrecked (T-800 wins, T-1000 loses), or the canal run out (the T-800 and T-1000 lose, HE GOT AWAY).
function drainRoleChecks(){
  if (DR.truckHP <= 0){
    if (G.role === 't800') drainEnd(true, 'TRUCK WRECKED', 'TRUCK WRECKED', true);
    else if (G.role === 't1000') drainEnd(false, 'TRUCK WRECKED', 'TRUCK WRECKED', true);
    return;
  }
  if (DR.stop && G.role !== 'john') drainEnd(false, 'DRAIN ESCAPE', 'HE GOT AWAY', false);
}

// The chase ends once. The outcome is kept; the cutscene (when asked) plays before the result or the death card.
function drainEnd(win, why, title, cut){
  if (DR.ended) return;
  DR.ended = true; DR.final = Math.floor(drainFrac() * 100);
  DR.pend = {win, why, title};
  DR.killer = G.role === 't1000' ? t800 : t1000;
  if (cut){ DR.cutT = 0; DR.cutWin = win; DR.cutBanner = win && G.role === 't800'; DR.stop = true; return; }
  drainFinish();
}

// Hand the outcome to the result card (a win) or the death card (a loss).
function drainFinish(){
  const p = DR.pend;
  // The cutscene is over: clear its pieces so the result and death cards draw clean.
  DR.cutT = -1; DR.blasts = []; DR.flash = 0; DR.shake = 0;
  if (p.win){
    G.winWhy = p.title; G.done[G.stage] = true;
    // The result card comes first. DRAIN OUT is owed and plays on the continue press (see resultNext).
    // The T-800 wreck already played its own pillar blast in the in-stage cut, so DRAIN OUT is skipped there.
    const wrecked = DR.cutWin; DR.cutWin = false;
    enterResult({win: true, title: p.title});
    G.outPending = !wrecked;
    return;
  }
  loseRound(p.why, ownActor(), DR.killer);
  enterResult({win: false, title: p.why});
}

// CUTSCENE: the truck swerves toward the nearest pillar; blasts at 40, 60 and 80 ticks with an orange flash; the wreck stops; a T-800 win shows TO BE CONTINUED as the T-1000 walks out.
function stepDrainCut(){
  DR.cutT++;
  const t = DR.cutT, tr = t1000;
  if (DR.shake > 0) DR.shake--;
  if (DR.flash > 0) DR.flash--;
  if (t <= CFG.DRAIN_CUT_SWERVE){ tr.x += clamp((tr.x < 128 ? 48 : 208) - tr.x, -2, 2); }
  if (CFG.DRAIN_CUT_BLASTS.includes(t)){
    DR.blasts.push({x: tr.x, y: tr.y, t0: t}); sfx('crash');
    DR.shake = 8;
    if (t === CFG.DRAIN_CUT_SWERVE) DR.flash = 20;
  }
  DR.blasts = DR.blasts.filter(b => t - b.t0 < 14);
  if (t === CFG.DRAIN_CUT_BANNER && DR.cutBanner) millBanner('TO BE CONTINUED', CFG.MILL_BANNER_TICKS);
  if (t >= CFG.DRAIN_CUT_T) drainFinish();
}

// ===== DRAIN RENDER =====
// Pre-baked canvases for the vehicles, obstacles and pillars. Built once, on the first draw, from palette rectangles [x, y, w, h, colour].
// Bake one canvas from palette rectangles (a colour is a PAL key, or a hex string for a mixed colour).
function drainBake(w, h, rects){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (const [x, y, rw, rh, col] of rects){ g.fillStyle = col[0] === '#' ? col : PAL[col]; g.fillRect(x, y, rw, rh); }
  return c;
}
// The murky water colour: the palette has no teal, so it is '9' (dark blue) mixed 60/40 with 'f' (green), about #004371.
let DRAIN_WATER_HEX = null;
function drainWaterHex(){
  if (DRAIN_WATER_HEX) return DRAIN_WATER_HEX;
  const a = [0, 0, 188], b = [0, 168, 0], k = CFG.DRAIN_WATER_MIX;
  const h = i => Math.round(a[i] * (1 - k) + b[i] * k).toString(16).padStart(2, '0');
  DRAIN_WATER_HEX = '#' + h(0) + h(1) + h(2);
  return DRAIN_WATER_HEX;
}
// The canvases, cached. Riders, the Harley and the truck come in two frames (tread moves between them); the riders' bikes also come in three lean poses.
let DRAIN_ART_C = null;
// A blank canvas of the given size.
function drainCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// An obstacle canvas with a 1 px dark outline and a 35 percent drop shadow on the lower right. The outline is read from the shape's own pixels, so it follows any shape.
function drainOutline(src){
  const w = src.width, h = src.height, W2 = w + 3, H2 = h + 3;
  const s = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = drainCanvas(W2, H2), g = out.getContext('2d');
  const id = g.createImageData(W2, H2), d = id.data;
  const al = (x, y) => (x >= 0 && y >= 0 && x < w && y < h) ? s[(y * w + x) * 4 + 3] : 0;
  const put = (x, y, r, gg, b, a) => { const i = (y * W2 + x) * 4; d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = a; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (al(x, y)) put(x + 2, y + 2, 0, 0, 0, 90);
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++){
    if (al(x, y)){
      const i = (y * w + x) * 4;
      put(x + 1, y + 1, s[i], s[i + 1], s[i + 2], 255);
    } else if (al(x - 1, y) || al(x + 1, y) || al(x, y - 1) || al(x, y + 1)){
      put(x + 1, y + 1, 0, 0, 0, 255);
    }
  }
  g.putImageData(id, 0, 0);
  return out;
}
// A rider's bike from behind: the rider's top (rows 0 to 13) from the rounds' sprite over the bike's rects. A lean (1 right, 2 left) shifts the top 6 rows by 1 px.
function drainRiderCanvas(d, w, rects, lean){
  const c = drainBake(w, 26, rects), g = c.getContext('2d');
  const spr = sprite(d, 'up', 0, false), sx = lean === 1 ? 1 : lean === 2 ? -1 : 0, ox = (w - 16) >> 1;
  g.drawImage(spr, 0, 0, 16, 6, ox + sx, 0, 16, 6);
  g.drawImage(spr, 0, 6, 16, 8, ox, 6, 16, 8);
  return c;
}
// The Harley with two riders (drain and the mall pickup), a rear 3/4 composite 22x26. Draw order: the bike, then the T-800 (his head at the top, full size), then John on top and lower, his head scaled to 12x11 so it sits 5 px under the T-800's head and 2 px to the left. Red sleeves wrap the T-800's waist last.
function drainHarleyDouble(f){
  const c = drainCanvas(22, 26), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(drainBake(18, 26, drainHarleyRects(f)), 2, 0);
  g.drawImage(sprite(CAST.t800, 'up', 0, false), 0, 0, 16, 14, 3, 0, 16, 14);
  g.drawImage(sprite(johnDef(), 'up', 0, false), 0, 0, 16, 14, 1, 5, 12, 11);
  g.fillStyle = PAL['b'];
  g.fillRect(1, 15, 2, 3); g.fillRect(19, 15, 2, 3);
  return c;
}
// The tow truck from the front, with the T-1000's head and cop cap in the windshield.
function drainTruckCanvas(f){
  const c = drainBake(44, 56, drainTruckRects(f)), g = c.getContext('2d');
  g.drawImage(sprite(CAST.chrome, 'down', 0, false), 2, 0, 12, 12, 13, 9, 12, 12);
  return c;
}
// JOHN's dirt bike from behind (16 px wide under the rider's top): a seat, a red rear fender, a knobby black tyre with tread (frame f) that leans with the bike, and a chrome exhaust on the right.
function drainBikeRects(f, lean){
  // The bike body is about 14 px wide (x 1..14) under the 16 px rider, so the rider overhangs it like the T-800 on the Harley.
  const tx = lean === 1 ? 4 : lean === 2 ? 2 : 3;
  return [
    [5, 14, 6, 1, '0'],                                  // seat
    [2, 15, 12, 2, 'b'],                                 // red rear fender
    [tx, 17, 10, 8, '0'],                                // knobby black tyre
    [tx + 2, 18 + 2 * f, 6, 1, '3'], [tx + 2, 21 - 2 * f, 6, 1, '3'], // tread, two frames
    [13, 17, 2, 7, '2'], [13, 17, 1, 7, '3'],            // chrome exhaust
    [6, 21, 2, 2, '2'],                                  // footpeg
  ];
}
// The Harley from behind (18 px wide): a wide black tank, saddlebags, chrome twin exhausts, a fat rear tyre with tread (frame f) and a red tail light.
function drainHarleyRects(f){
  return [
    [1, 14, 16, 3, '0'],                                 // wide black tank
    [0, 16, 4, 6, '4'], [14, 16, 4, 6, '4'],             // saddlebags
    [0, 17, 2, 7, '2'], [16, 17, 2, 7, '2'],             // chrome twin exhausts
    [4, 17, 10, 7, '0'],                                 // fat rear tyre
    [5, 18 + 2 * f, 8, 1, '3'], [5, 21 - 2 * f, 8, 1, '3'], // tread
    [7, 24, 4, 1, 'b'],                                  // red tail light
  ];
}
// The truck from the front, 44x56 (the centre is the truck's x, y): exhaust stacks, an orange light bar, a red cab, a windshield, a chrome grille with bars, two headlights, a bumper, and the two front tyres (their centres are 20 px out from the middle, the shooting targets) with tread (frame f).
function drainTruckRects(f){
  return [
    [3, 0, 2, 9, '3'], [39, 0, 2, 9, '3'],               // exhaust stacks on the cab corners
    [14, 0, 16, 3, 'c'],                                 // orange cab light bar
    [3, 3, 38, 44, '0'],                                 // black body outline
    [4, 4, 36, 42, 'a'],                                 // red cab
    [6, 6, 32, 2, 'b'],                                  // roof highlight
    [9, 8, 26, 16, 'e'], [10, 9, 24, 1, '1'],            // windshield and its glint
    [12, 38, 20, 10, '2'],                               // chrome grille
    [14, 38, 1, 10, '3'], [18, 38, 1, 10, '3'], [22, 38, 1, 10, '3'], [26, 38, 1, 10, '3'], [30, 38, 1, 10, '3'],
    [5, 39, 5, 5, 'd'], [34, 39, 5, 5, 'd'],             // headlights
    [5, 46, 34, 5, '3'], [5, 50, 34, 2, '0'],            // bumper
    [0, 30, 4, 12, '0'], [40, 30, 4, 12, '0'],           // front tyres
    [0, 31 + 2 * f, 4, 1, '3'], [40, 31 + 2 * f, 4, 1, '3'], [0, 37 - 2 * f, 4, 1, '3'], [40, 37 - 2 * f, 4, 1, '3'], // tread
  ];
}
// Cart 10x8: a chrome wire basket with a grid, a red handle and two wheels.
function drainCartRects(){
  return [[0, 0, 10, 6, '2'], [0, 2, 10, 1, '3'], [0, 4, 10, 1, '3'], [3, 0, 1, 6, '3'], [6, 0, 1, 6, '3'], [9, 0, 1, 2, 'b'], [1, 6, 2, 2, '0'], [7, 6, 2, 2, '0']];
}
// Block 20x10: a concrete jersey barrier with red and white hazard stripes.
function drainBlockRects(){
  const r = [[0, 0, 20, 8, '2'], [0, 0, 20, 1, '1'], [0, 7, 20, 1, '3']];
  for (let x = 0; x < 20; x += 4) r.push([x, 1, 2, 6, 'b'], [x + 2, 1, 2, 6, '1']);
  return r;
}
// Rolling barrel 12x10: a rusty orange drum with dark bands and a lit edge.
function drainBarrelRects(){
  return [[0, 0, 12, 10, 'c'], [0, 2, 12, 1, '7'], [0, 7, 12, 1, '7'], [2, 1, 1, 8, 'd'], [9, 2, 2, 6, 'a']];
}
// Oil slick 18x8: a black oval with a rainbow sheen row across its middle.
function drainOilRects(){
  const r = [];
  for (let y = 0; y < 8; y++){
    const hw = Math.sqrt(Math.max(0, 1 - Math.pow((y - 3.5) / 4.3, 2))) * 9;
    r.push([Math.round(9 - hw), y, Math.round(2 * hw), 1, '0']);
  }
  const sheen = ['8', '9', 'f', 'd', 'c', 'e'];
  for (let x = 4; x < 14; x++) r.push([x, 3, 1, 1, sheen[(x * 3) % sheen.length]]);
  return r;
}
// Debris chunk 12x10 (once it has landed): a grey concrete lump with dents and a crack.
function drainDebrisRects(){
  return [[1, 1, 10, 8, '3'], [1, 1, 10, 1, '2'], [2, 3, 3, 2, '2'], [7, 5, 3, 3, '2'], [3, 6, 2, 1, '4']];
}
// Wrecked car 24x16: a burnt-out sedan body with dark windows, black wheels and a glow of embers.
function drainWreckRects(){
  return [
    [1, 3, 22, 10, '4'], [5, 1, 13, 5, '3'], [7, 2, 9, 3, '0'],  // body, roof and windows
    [3, 11, 4, 3, '0'], [17, 11, 4, 3, '0'],                      // wheels
    [0, 6, 2, 4, '0'], [22, 6, 2, 4, '0'],                        // bumpers
    [9, 8, 2, 2, 'c'], [14, 9, 3, 2, 'b'], [1, 4, 2, 2, '0'],     // embers and a dented side
  ];
}
// Ramp 20x12: a yellow and black striped wedge, darker at the top lip, with three white up-chevrons.
function drainRampRects(){
  const r = [];
  for (let y = 0; y < 14; y++){
    const k = Math.round(4 * y / 13);
    const col = y === 0 ? '0' : y <= 4 ? '7' : y <= 8 ? '6' : 'd';
    r.push([4 - k, y, 16 + 2 * k, 1, col]);
  }
  for (const cx of [6, 12, 18]) r.push([cx - 1, 7, 1, 1, '1'], [cx, 6, 1, 1, '1'], [cx + 1, 7, 1, 1, '1']);
  return r;
}
// Puddle 18x8: a dark oval (a '9' rim around '8' water) with an 'e' glint.
function drainPuddleRects(){
  const r = [];
  for (let y = 0; y < 8; y++){
    const hw = Math.sqrt(Math.max(0, 1 - Math.pow((y - 3.5) / 4.3, 2))) * 9;
    const x0 = Math.round(9 - hw), w = Math.round(2 * hw);
    r.push([x0, y, w, 1, '9']);
    r.push([x0 + 1, y, Math.max(0, w - 2), 1, drainWaterHex()]);
  }
  r.push([5, 2, 4, 1, 'e'], [4, 3, 2, 1, 'e']);
  return r;
}
// Pillar 8x12: the concrete pier under the deck, a lit left edge and a shadowed base.
function drainPillarRects(){
  return [[0, 0, 8, 12, '3'], [0, 0, 1, 12, '2'], [6, 0, 2, 12, '4'], [0, 10, 8, 2, '0']];
}
// Every baked canvas, built once on the first draw.
function drainArt(){
  // Rebuilt when the rider changes between John and Sarah.
  if (DRAIN_ART_C && DRAIN_ART_C.sarah === !!G.sarah) return DRAIN_ART_C;
  DRAIN_ART_C = {
    sarah: !!G.sarah,
    bike: [0, 1].map(f => [0, 1, 2].map(l => drainRiderCanvas(johnDef(), 16, drainBikeRects(f, l), l))),
    harley: [0, 1].map(f => drainRiderCanvas(CAST.t800, 18, drainHarleyRects(f), 0)),
    harleyDouble: [0, 1].map(f => drainHarleyDouble(f)),
    slide: [0, 1].map(f => drainOutline(drainBake(24, 16, drainSlideRects(f)))),
    truck: [0, 1].map(f => drainTruckCanvas(f)),
    cart: drainOutline(drainBake(10, 8, drainCartRects())),
    block: drainOutline(drainBake(20, 10, drainBlockRects())),
    barrel: drainOutline(drainBake(12, 10, drainBarrelRects())),
    oil: drainOutline(drainBake(18, 8, drainOilRects())),
    debris: drainOutline(drainBake(12, 10, drainDebrisRects())),
    wreck: drainOutline(drainBake(24, 16, drainWreckRects())),
    puddle: drainOutline(drainBake(18, 8, drainPuddleRects())),
    ramp: drainBake(24, 14, drainRampRects()),
    pillar: drainBake(8, 12, drainPillarRects()),
  };
  return DRAIN_ART_C;
}

// The canal: a floor with expansion joints and lane dashes, the water channel with scrolling ripples, and sloped banks with seams and hatching.
function drainCanal(){
  const s = Math.round(DR.wpx);
  // Darker concrete (mid grey) so the light obstacles read; dark expansion joints every 32 px.
  fillBox(0, 0, W, H, '3');
  for (let y = (s % 32) - 32; y < H; y += 32) fillBox(24, y, 208, 1, '4');
  // Grime: short dark streaks fixed to the world, so they scroll with the floor.
  for (let y0 = (s % 8) - 8; y0 < H; y0 += 8){
    const wr = Math.floor((y0 + s) / 8);
    for (const x of [30, 62, 150, 186, 218]) if ((Math.abs(millHash(x, wr, 7)) | 0) % 5 === 0) fillBox(x + ((Math.abs(millHash(wr, x, 3)) | 0) % 6), y0, 1, 5, '4');
  }
  const dash = s % 20;
  for (const x of [56, 88, 200]) for (let y = dash - 20; y < H; y += 20) fillBox(x, y, 1, 8, '2');
  // A darker wet band on both sides of the channel.
  bctx.globalAlpha = 0.5; fillBox(116, 0, 7, H, '4'); fillBox(133, 0, 7, H, '4'); bctx.globalAlpha = 1;
  // The channel is 10 px of murky water, with sparse pale ripples that scroll at twice the floor speed.
  fillBox(123, 0, 10, H, drainWaterHex());
  const rip = (s * 2) % 14;
  bctx.globalAlpha = 0.35;
  for (let y = rip - 14, i = 0; y < H; y += 14, i++) fillBox(124 + (i & 1) * 4, y, 2, 1, 'e');
  bctx.globalAlpha = 1;
  for (let y = 0; y < H; y++){
    const k = ((y + s) % 32) / 32;
    const w = Math.round(24 - 6 * k);
    fillBox(0, y, w, 1, '2'); fillBox(w, y, 1, 1, '3');
    fillBox(256 - w, y, w, 1, '2'); fillBox(256 - w - 1, y, 1, 1, '3');
    for (let x = (y + s) % 4; x < w - 1; x += 4){ fillBox(x, y, 1, 1, '3'); fillBox(255 - x, y, 1, 1, '3'); }
    if ((y + s) % 24 === 0){ fillBox(0, y, w, 1, '3'); fillBox(256 - w, y, w, 1, '3'); }
  }
  fillBox(0, 0, 24, 1, '1'); fillBox(232, 0, 24, 1, '1');
  for (const g of DR.graf) text(bctx, g.t, g.x, Math.round(g.y), g.col);
}

// An obstacle from its baked canvas (the outline and shadow add 1 px on the left and top). A falling debris chunk is only its growing shadow until it lands.
function drainObstacle(o){
  const A = drainArt(), x = Math.round(o.x), y = Math.round(o.y);
  if (o.k === 'debris' && o.fall > 0){
    const k = (CFG.DRAIN_DEBRIS_FALL - o.fall) / CFG.DRAIN_DEBRIS_FALL;
    bctx.globalAlpha = 0.35; fillBox(x + 1, y + 2, Math.round(6 + 6 * k), Math.round(4 + 4 * k), '0'); bctx.globalAlpha = 1;
    return;
  }
  if (o.k === 'ramp'){
    // The shadow lies only beyond the far (top) edge. The RAMP! tag blinks while the ramp is in the top part of the screen.
    bctx.globalAlpha = 0.35; fillBox(x, y - 2, o.w, 2, '0'); bctx.globalAlpha = 1;
    bctx.drawImage(A.ramp, x, y);
    if (y > -10 && y < 40 && ((G.tick >> 3) & 1)) text(bctx, 'RAMP!', x + 2, y - 10, 'd');
    return;
  }
  const img = {cart: A.cart, block: A.block, barrel: A.barrel, oil: A.oil, debris: A.debris, wreck: A.wreck, puddle: A.puddle, ramp: A.ramp}[o.k] || A.puddle;
  bctx.drawImage(img, x - 1, y - 1);
}

// A dotted line from one point to another (the shot, the pellet).
function drainLine(x0, y0, x1, y1, col){
  const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
  for (let i = 0; i <= n; i++) fillBox(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1, col);
}

// A solid 1 px line, one pixel per step: the windshield cracks need it to read on the glass (the dotted helper vanishes there).
function drainSolidLine(x0, y0, x1, y1, col){
  const n = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) fillBox(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1, col);
}

// The lunge lane: red up-chevrons from the truck to the top edge, scrolling toward it. Draw only.
function drainChevrons(x){
  const cx = Math.round(x), top = 50, bot = Math.round(t1000.y) - 30, step = CFG.DRAIN_CHEV_STEP;
  const off = G.tick % step;
  bctx.globalAlpha = 0.75;
  for (let y = bot - off; y > top; y -= step){
    for (let i = 0; i < 5; i++){ fillBox(cx - 5 + i, y + i, 1, 1, 'b'); fillBox(cx + 5 - i, y + i, 1, 1, 'b'); }
  }
  bctx.globalAlpha = 1;
}

// The telegraphs: red chevrons on the lunge lane (surge tell); a red bar for a side swipe on the swipe side.
function drainTelegraph(){
  if (DR.surgeMode === 'tele' && drainLunge()){
    drainChevrons(DR.surgeX);
  } else if (DR.surgeMode === 'tele'){
    // Pass-9 flat red lane for the other roles' tell.
    bctx.globalAlpha = 0.45;
    fillBox(Math.round(DR.surgeX) - 22, 50, 44, Math.max(0, Math.round(t1000.y) - 50), 'b');
    bctx.globalAlpha = 1;
  } else if (DR.surgeMode === 'swipeTele'){
    const tr = t1000, x = DR.swipeSide > 0 ? Math.round(tr.x) + 22 : Math.round(tr.x) - 36;
    bctx.globalAlpha = 0.45;
    fillBox(x, Math.round(tr.y) - 20, 14, 40, 'b');
    bctx.globalAlpha = 1;
  }
}

// The truck: the baked front view (two tread frames), headlights flashing during the surge telegraph, cracks and smoke below two thirds HP, a dented grille, sparks and a flame lick below a third.
function drainTruck(tr){
  const x = Math.round(tr.x), y = Math.round(tr.y);
  const L = x - 22, T = y - 28;
  bctx.drawImage(drainArt().truck[(G.tick >> 3) & 1], L, T);
  if (DR.surgeMode === 'tele' && ((G.tick >> 2) & 1)){ fillBox(L + 5, T + 39, 5, 5, '1'); fillBox(L + 34, T + 39, 5, 5, '1'); }
  if (DR.truckHP < DR.truckMaxHP * 2 / 3){
    fillBox(L + 8, T + 30, 1, 6, '0'); fillBox(L + 9, T + 34, 3, 1, '0'); fillBox(L + 33, T + 20, 1, 5, '0');
    if ((G.tick >> 3) & 1) fillBox(L + 14, T - 3, 8, 3, '4');
  }
  if (DR.truckHP < DR.truckMaxHP / 3){
    fillBox(L + 12, T + 38, 20, 10, '3'); fillBox(L + 14, T + 42, 4, 3, '0');
    fillBox(L + 20, T + 16 + ((G.tick >> 1) & 3), 2, 2, 'd');
    if ((G.tick >> 2) & 1) fillBox(L + 8, T - 2, 3, 3, 'c');
  }
  if (DR.truckHurt > 0 && ((G.tick >> 1) & 1)) fillBox(L, T, 44, 56, 'd');
}

// The flat-bike slide sprite (24x16): the bike on its side along the lane, John crouched flat over it. Two frames: the wheel spokes swap between a cross and an X.
function drainSlideRects(f){
  const spokes = f ? [[4, 9, 1, 1, '0'], [5, 10, 1, 1, '0'], [6, 11, 1, 1, '0'], [5, 12, 1, 1, '0'], [4, 13, 1, 1, '0'], [6, 9, 1, 1, '0'], [18, 9, 1, 1, '0'], [17, 10, 1, 1, '0'], [16, 11, 1, 1, '0'], [17, 12, 1, 1, '0'], [18, 13, 1, 1, '0']]
    : [[4, 8, 1, 6, '0'], [1, 11, 6, 1, '0'], [16, 8, 1, 6, '0'], [15, 11, 6, 1, '0']];
  return [
    [1, 8, 8, 8, '0'], [15, 8, 8, 8, '0'],                       // tyres
    [3, 9, 4, 6, '2'], [17, 9, 4, 6, '2'],                       // rims
    [7, 10, 9, 2, '4'], [9, 12, 5, 1, '4'],                      // frame, down the middle
    [3, 4, 4, 2, '4'], [5, 6, 3, 2, '4'],                        // jeans, knee tucked up
    [8, 5, 8, 4, '2'], [9, 4, 6, 1, '2'],                        // grey tee across the back, crouched
    [6, 7, 3, 2, 'b'], [14, 7, 3, 2, 'b'],                       // red sleeves reaching for the bars
    [16, 4, 5, 4, '5'], [16, 3, 4, 1, '7'], [11, 3, 5, 1, '7'],  // head with hair streaming back
    [19, 5, 1, 1, '0'],                                          // eye
    ...spokes,
  ];
}
// A bike from behind: a rider shadow under it, then the baked rider and bike (two tread frames, three lean poses from the steering). Airborne bikes lift and their shadow shrinks; i-frames blink.
// A slide shows the flat-bike sprite instead (the spark trail comes from the slide step).
function drainBike(a, air){
  if (DR.iJ > 0 && a === john && ((G.tick >> 2) & 1)) return;
  const x = Math.round(a.x), y = Math.round(a.y), lift = air ? 6 : 0;
  if (a === john && DR.slideT > 0){
    bctx.globalAlpha = 0.5; fillBox(x - 11, y + 8, 22, 3, '0'); bctx.globalAlpha = 1;
    bctx.drawImage(drainArt().slide[(G.tick >> 2) & 1], x - 13, y - 8);
    return;
  }
  const lean = a.lastDx > 0 ? 1 : a.lastDx < 0 ? 2 : 0;
  bctx.globalAlpha = 0.5; fillBox(x - (air ? 4 : 5), y + 13 + lift, air ? 8 : 10, 3, '0'); bctx.globalAlpha = 1;
  bctx.drawImage(drainArt().bike[(G.tick >> 2) & 1][lean], x - 8, y - 13 - lift);
}

// The Harley from behind, with the T-800 riding it; after the pickup a second rider (John's head over the T-800's shoulder) rides on.
function drainHarley(h){
  const x = Math.round(h.x), y = Math.round(h.y);
  bctx.globalAlpha = 0.5; fillBox(x - 6, y + 13, 12, 3, '0'); bctx.globalAlpha = 1;
  const A = drainArt(), f = (G.tick >> 2) & 1;
  bctx.drawImage(DR.pickOn ? A.harleyDouble[f] : A.harley[f], x - 9, y - 13);
}

// The timing ring around John: green while its radius sits in the band.
function drainRing(){
  const wide = DR.ringMiss >= CFG.DRAIN_RING_MISS_WIDEN;
  const r = drainRingR(), green = r >= (wide ? CFG.DRAIN_BAND_WIDE_LO : CFG.DRAIN_BAND_LO) && r <= (wide ? CFG.DRAIN_BAND_WIDE_HI : CFG.DRAIN_BAND_HI);
  millRing(Math.round(john.x), Math.round(john.y), Math.round(r), green ? 'f' : 'd');
}

// The pickup ring around the Harley: fills dot by dot while John stays close.
function drainPickRing(){
  const h = t800, n = Math.round(24 * DR.pickT / CFG.DRAIN_PICK_TICKS);
  millRing(Math.round(h.x), Math.round(h.y), CFG.DRAIN_PICK_R, '3');
  for (let i = 0; i < n; i++){
    const a = i / 24 * Math.PI * 2;
    fillBox(Math.round(h.x + Math.cos(a) * CFG.DRAIN_PICK_R), Math.round(h.y + Math.sin(a) * CFG.DRAIN_PICK_R), 1, 1, 'd');
  }
}

// The vehicles, back to front: the truck, the Harley (player or AI), then John's bike, then the shots and the pellet.
function drainVehicles(){
  const role = G.role;
  for (const c of DR.crates) drainCrateDraw(c);
  drainTruck(t1000);
  drainCrackDraw();
  drainSmokeDraw();
  if (role === 't800' || DR.harleyIn) drainHarley(t800);
  if (!(role === 't800' && DR.pickOn)) drainBike(john, DR.air > 0 || DR.jumpT >= 0);
  if (DR.pull && role === 'john' && DR.jumpT < 0){ if (Math.hypot(t800.x - john.x, t800.y - john.y) <= CFG.DRAIN_JUMP_REACH) drainRing(); drainTetherDraw(); }
  if (role === 't800' && !DR.pickOn) drainPickRing();
  if (role === 't800' && DR.pickOn && DR.aimOn) drainAimDraw();
  if (DR.pelletFx){ const p = DR.pelletFx; drainLine(p.x0, p.y0, p.x1, p.y1, 'd'); }
  for (const s of DR.shots) drainLine(s.x0, s.y0, s.x1, s.y1, 'd');
  drainFlightDraw();
  if(drainCounterWindow()&&!DR.ended)textOutlined(bctx,'OPEN - M79',Math.round(t1000.x)-19,Math.round(t1000.y)-35,'d');
  drainGuardDraw();
}

// Hit effects: each kind scatters its own pixels from the hit point for the effect's life (cart bits, block sparks, puddle rings, pillar sparks).
function drainFxDraw(){
  const cols = {cart: ['2', '3', '0'], block: ['d', '0', '3'], puddle: ['e', '1'], pillar: ['d', 'c'], barrel: ['c', '7', 'd'], oil: ['0', '8', 'f'], debris: ['3', '2', '0'], wreck: ['0', 'c', 'b'], spark: ['d', 'c', '1']};
  for (const f of DR.fx){
    const age = CFG.DRAIN_FX_T - f.t, x = Math.round(f.x), y = Math.round(f.y), cs = cols[f.kind] || ['d', '0', '3'];
    if (f.kind === 'puddle') millRing(x, y, 2 + age, 'e');
    for (let k = 0; k < 5; k++){
      const a = k * 1.26 + 0.4;
      fillBox(Math.round(x + Math.cos(a) * age * 1.4), Math.round(y + Math.sin(a) * age * 1.4), 1, 1, cs[k % cs.length]);
    }
  }
}

// The ramp: a striped wedge with up-chevrons on the floor ahead of John's bike, and a RAMP! tag that blinks while it is live.
function drainRamp(){
  if (!DR.ramp) return;
  const x = Math.round(john.x), y = Math.round(DR.ramp.y);
  bctx.drawImage(drainArt().ramp, x - 12, y);
  if (DR.rampTag > 0 && ((G.tick >> 2) & 1)) text(bctx, 'RAMP!', x - 11, y - 8, 'd');
}

// An overpass band: the deck, its railing, the shadow under it, and the pillars (baked, drawn over the road).
function drainBand(b){
  const y = Math.round(b.y);
  fillBox(0, y, W, CFG.DRAIN_BAND_H, '4');
  fillBox(0, y, W, 2, '3');
  fillBox(0, y + CFG.DRAIN_BAND_H - 4, W, 4, '0');
  for (const p of b.pillars) bctx.drawImage(drainArt().pillar, p.x, y + p.y0);
}

// Cutscene pieces: blasts (rings that grow and fade), the orange flash, and the T-1000 walking out toward the camera.
function drainCutScene(){
  for (const b of DR.blasts){
    const age = DR.cutT - b.t0;
    if (age >= 0) millRing(Math.round(b.x), Math.round(b.y), 3 + age * 2, 'c');
  }
  if (DR.cutT >= CFG.DRAIN_CUT_SWERVE && DR.cutT < 60) { bctx.globalAlpha = 0.25; fillBox(0, 0, W, H, 'c'); bctx.globalAlpha = 1; }
  if (DR.cutBanner && DR.cutT >= CFG.DRAIN_CUT_BANNER){
    const k = Math.min(1, (DR.cutT - CFG.DRAIN_CUT_BANNER) / CFG.DRAIN_CUT_WALK);
    const y = Math.min(150, t1000.y + k * 40);
    bctx.drawImage(sprite(CAST.chrome, 'down', 0, false), Math.round(t1000.x) - 8, Math.round(y) - 12);
  }
}

// DRAIN RENDER: canal, obstacles, telegraph, vehicles, hit effects, the overpasses over them, then the banner and the HUD. Never mutates state.
function drawDrainWorld(){
  const cutShake = DR.cutT >= CFG.DRAIN_CUT_SWERVE && DR.cutT < 90;
  const shaking = DR.shake > 0 || cutShake;
  const ox = shaking ? (G.tick & 1 ? 2 : -2) : 0;
  bctx.save();
  bctx.translate(ox, 0);
  drainCanal();
  for (const o of DR.obst) drainObstacle(o);
  drainTelegraph();
  drainRamp();
  drainVehicles();
  drainFxDraw();
  for (const b of DR.bands) drainBand(b);
  if (DR.cutT >= 0) drainCutScene();
  bctx.restore();
  if (DR.flash > 0){ bctx.globalAlpha = 0.3; fillBox(0, 0, W, H, DR.flashCol || 'c'); bctx.globalAlpha = 1; }
  if (G.state === 'play') drawBanner();
  drawHud();
}

// DRAIN HUD: the distance bar on the top strip, the truck HP under it for the T-800 and T-1000, and the role's kit on the bottom strip with the score.
function drawDrainHud(){
  fillBox(0, 0, W, 8, '0');
  text(bctx, 'DRAIN', 4, 1, '1');
  fillBox(40, 2, 176, 4, '3');
  fillBox(40, 2, Math.round(176 * drainFrac()), 4, 'e');
  fillBox(214, 0, 2, 8, 'f');
  if (G.role !== 'john'){
    fillBox(0, 8, W, 8, '0');
    text(bctx, 'TRUCK', 4, 9, 'd');
    // The bar flashes red on every hit, then sits orange.
    hudBar(40, 11, 176, DR.truckHP / DR.truckMaxHP, DR.truckHurt > 0 ? ((G.tick >> 1) & 1 ? 'b' : 'a') : 'c');
    text(bctx, Math.max(0, DR.truckHP) + 'HP', 222, 9, '1');
  }
  fillBox(0, HUD_Y, W, H - HUD_Y, '0');
  const y = HUD_Y + 4, bar = (cd, max) => cd > 0 ? 1 - cd / max : 1;
  if (G.role === 'john'){
    text(bctx, 'HP', 4, y, 'd');
    for (let i = 0; i < CFG.DRAIN_BUMPS_J; i++) drawHeartSmall(18 + i * 5, y, i < CFG.DRAIN_BUMPS_J - DR.bumpsJ ? 'b' : '3');
    hudKey('SPACE', 'SLIDE', 40, y, 'd'); hudBar(40, HUD_Y + 10, 40, bar(DR.slideCD, CFG.DRAIN_SLIDE_CD), 'd');
  } else if (G.role === 't800'){
    // Unlimited M79 with a reload bar; the other pips show rider health.
    const X = CFG.DRAIN_HUD_T800;
    text(bctx, 'SG', X.sg, y, 'd'); hudPips(X.pips, CFG.DRAIN_SHELLS, DR.shells, 'd');
    text(bctx, 'HP', X.hp, y, 'd');
    for (let i = 0; i < CFG.DRAIN_BUMPS_H; i++) drawHeartSmall(X.hearts + i * 5, y, i < CFG.DRAIN_BUMPS_H - DR.bumpsH ? 'b' : '3');
    text(bctx, 'JOHN', X.john, y, 'd');
    for (let i = 0; i < CFG.DRAIN_PICK_HITS; i++) drawHeartSmall(X.johnHearts + i * 5, y, i < CFG.DRAIN_PICK_HITS - DR.pickHits ? 'b' : '3');
    hudBar(X.john, HUD_Y + 10, X.barW, DR.pickOn ? 1 : DR.pickT / CFG.DRAIN_PICK_TICKS, 'd');
    hudKey('RMB', 'M79 INF', X.m79, y, DR.m79CD <= 0 ? 'd' : '3');
    hudBar(X.m79, HUD_Y + 10, X.barW, bar(DR.m79CD, CFG.DRAIN_M79_CD), 'd');
  } else {
    // 10C: each ability leads with its key chip. Space is both RAM (pips) and SURGE (bar); RMB is the side swipe.
    hudKey('SPACE', 'RAM', 4, y, 'd'); hudPips(46, CFG.DRAIN_RAMS, CFG.DRAIN_RAMS - DR.rams, 'b');
    text(bctx, 'SURGE', 72, y, 'd'); hudBar(72, HUD_Y + 10, 36, DR.surgeMode === 'idle' ? bar(DR.surgeCD, CFG.DRAIN_T1K_SURGE_CD) : 0, 'd');
    hudKey('RMB', 'SWIPE', 124, y, 'd'); hudBar(124, HUD_Y + 10, 36, bar(DR.sideCD, CFG.DRAIN_SIDE_CD), 'd');
  }
  text(bctx, 'SCORE ' + scoreText(G.score, 6), 196, y, '1');
}

// BOSS INTRO card for the chase: the name, the time and the role's goal, on black.
function renderDrainIntro(){
  fillBox(0, 0, W, H, '0');
  textCentered('BOSS 1', W / 2, 40, 'b');
  bigCentered('THE STORM DRAIN', W / 2, 56, '1', '2');
  textCentered('9:12 PM', W / 2, 80, '3');
  const lines = DRAIN_INTRO[G.role] || DRAIN_INTRO.john;
  lines.forEach((ln, i) => { if (ln) textCentered(ln, W / 2, 100 + i * 20, i === 0 ? 'd' : '2'); });
  if(G.role==='t800')textCentered('HOLD LMB TO BRAKE AND AIM',W/2,132,'3');
  // 10C: the controls as key chips, under the goal lines.
  chipRow(DRAIN_KEYS[G.role] || DRAIN_KEYS.john, W / 2, 144, '1');
}
const DRAIN_INTRO = {
  john: ['OUTRUN THE TRUCK - JUMP TO THE HARLEY', ''],
  t800: ['DESTROY THE TRUCK - UNLIMITED GRENADES', 'HIT DURING ATTACKS FOR DOUBLE DAMAGE'],
  t1000: ['LAND 3 SEPARATE RAMS OR SWIPES', 'DODGE T-800 FIRE - 1 HP PER HIT'],
};
// 10C: the drain controls as chips. Space is SLIDE for John and SURGE/RAM for the T-1000; the T-800 lobs its M79 with E, Space or RMB.
const DRAIN_KEYS = {
  john: [['MOUSE', 'STEER'], ['SPACE', 'SLIDE'], ['RMB', 'SLIDE']],
  t800: [['MOUSE', 'STEER'], ['LMB', 'FIRE'], ['RMB', 'M79']],
  t1000: [['MOUSE', 'STEER'], ['SPACE', 'SURGE'], ['RMB', 'SWIPE']],
};
// Death card titles and epitaphs for the chase's own losses (other losses use deathTitle and epitaph).
const DRAIN_TITLES = {
  'TRUCK WRECKED': 'TRUCK WRECKED', 'DRAIN ESCAPE': 'HE GOT AWAY', 'RUN OFF THE ROAD': 'T-800 TERMINATED',
  'JOHN WAS RUN DOWN': 'T-800 TERMINATED', 'RUN DOWN': 'JOHN CONNOR',
};
const DRAIN_EPI = {
  'RUN DOWN': () => 'RUN DOWN IN THE STORM DRAIN AT ' + DR.final + '%',
  'RUN OFF THE ROAD': () => 'RAN OFF THE ROAD IN THE STORM DRAIN AT ' + DR.final + '%',
  'JOHN WAS RUN DOWN': () => 'JOHN WAS RUN DOWN AT ' + DR.final + '% - YOU NEVER PICKED HIM UP',
  'TRUCK WRECKED': () => 'TRUCK WRECKED UNDER THE OVERPASS',
  'DRAIN ESCAPE': () => 'HE GOT AWAY DOWN THE STORM DRAIN',
};

// ===================== PICKUPS (12D-1) =====================
// One router for every pickup. Tiers: small (quarter) blips with combo pitch; medium (M79, minigun, drain crate) gets
// a hit-stop, the sprite palette flash and a rising sting; big (door drops) gets a longer hit-stop, the special flash and a fanfare.
// Hit-stop freezes the gameplay step only (pickFrame). Music, render, sparks and HUD notches keep running.
Object.assign(CFG, {
  HITSTOP_MED: 6, HITSTOP_BIG: 24, HITSTOP_COOLDOWN: 60, HITSTOP_DANGER_PX: 40, // hit-stop ticks, start-to-start gap, skip radius
  COMBO_WINDOW: 60, COMBO_MAX_STEP: 8,       // a quarter within this many ticks of the last raises the blip a semitone (capped)
  PICK_FLASH_TICKS: 8, PICK_FLASH_WHITE: 3, PICK_FLASH_YELLOW: 6, // medium flash: white, then yellow, then normal
  SPARKLE_N: 4, SPARKLE_TICKS: 12, SPARKLE_SPD: 1, // the 1 px sparkle burst: four pixels flying out diagonally
  HOLDUP_TICKS: 24, HOLDUP_SHOW: 30, FLASH_BIG_HALF: 2, HOLD_ICON_GAP: 2, // big tier: pose end without a hit-stop, pose tail after the hit-stop, flash step (2 ticks), icon gap above the head
  DROP_POP_TICKS: 10, DROP_POP_H: 8, DROP_GLINT_EVERY: 30, DROP_GLINT_TICKS: 4, // floor drops: pop arc, glint
  DROP_BLINK_LAST: 180, DROP_BLINK_HALF: 4, DROP_LIFE_TICKS: 600, // floor drops: blink in the last DROP_BLINK_LAST ticks, then vanish
});
const PICK_TIER = {quarter: 'small', m79: 'medium', minigun: 'medium', crate: 'medium', mega: 'big', keys: 'big', badge: 'big'};
const PICK_TIERS = {
  small:  {hit: 0,               sfx: 'quarter', flash: null},
  medium: {hit: CFG.HITSTOP_MED, sfx: 'sting',   flash: 'pick'},
  big:    {hit: CFG.HITSTOP_BIG, sfx: 'fanfare', flash: 'hold'}
};
const pickFx = {
  flashT: -1e9, comboN: 0, comboT: -1e9, hitT: -1e9, stopLeft: 0, frozen: 0, bigT: -1e9, holdEnd: -1e9, holdKind: null, holdName: null,
  stops: [], log: [], sparks: [], notch: {m79: 0, crate: 0}, walk: {m79: false, crate: false}
};
window.PICKFX = pickFx;
// The pickup router. x, y is the pickup's spot; kind picks the tier. Scoring stays at the call site.
function onPickup(kind, x, y, tierOverride){
  const tier = tierOverride || PICK_TIER[kind] || 'small', T = PICK_TIERS[tier];
  let mul = 1, n = 0;
  if (tier === 'small'){
    n = G.tick - pickFx.comboT <= CFG.COMBO_WINDOW ? Math.min(pickFx.comboN + 1, CFG.COMBO_MAX_STEP) : 0;
    pickFx.comboN = n; pickFx.comboT = G.tick;
    mul = Math.pow(2, n / 12);
  }
  sfx(T.sfx, mul);
  sparkle(x, y);
  if (T.flash === 'pick') pickFx.flashT = G.tick;
  if (tier === 'big'){
    pickFx.bigT = G.tick; pickFx.holdKind = kind;   // the hold-up runs on G.tick, so the freeze does not stretch it
    pickFx.holdEnd = G.tick + CFG.HOLDUP_TICKS + CFG.HOLDUP_SHOW; pickFx.holdStop = false;
    if (T1K_NAMES[kind]){ G.bannerTxt = T1K_NAMES[kind]; G.bannerT = CFG.SPECIAL_BANNER; pickFx.holdName = T1K_NAMES[kind]; }
  }
  if (T.hit) tryHitStop(T.hit, x, y);
  pickFx.log.push({kind, tier, combo: n, mul: Math.round(mul * 1000) / 1000, tick: G.tick});
}
// Hit-stop: at most one every HITSTOP_COOLDOWN ticks (start to start), and never with a boss lunge or shot within HITSTOP_DANGER_PX.
function tryHitStop(len, x, y){
  if (G.tick - pickFx.hitT < CFG.HITSTOP_COOLDOWN || dangerNear(x, y)) return;
  pickFx.hitT = G.tick; pickFx.stopLeft = len;
  pickFx.stops.push({tick: G.tick, len});
  // The big pickup's own hit-stop: the pose tail runs HOLDUP_SHOW ticks after the freeze ends.
  if (G.tick === pickFx.bigT && !pickFx.holdStop){ pickFx.holdEnd = G.tick + len + CFG.HOLDUP_SHOW; pickFx.holdStop = true; }
}
// A boss lunge (mall dash, mill lunge or spread telegraph) or any shot in flight within HITSTOP_DANGER_PX of (x, y).
function dangerNear(x, y){
  const near = (px, py) => dist(px, py, x, y) <= CFG.HITSTOP_DANGER_PX;
  if ((t1000.lungeDash > 0 || (BS.on && /lunge|spread_tele/.test(BS.ai || ''))) && near(t1000.x, t1000.y)) return true;
  for (const b of bullets) if (near(b.x, b.y)) return true;
  for (const s of t800Slugs) if (near(s.x, s.y)) return true;
  for (const g of grenades) if (near(g.x1, g.y1)) return true;
  for (const b of blades) if (near(b.x, b.y)) return true;
  if (DR.lobs) for (const w of DR.lobs) if (near(w.x, w.y)) return true;
  return false;
}
// Game step for one tick. During a hit-stop the gameplay step is skipped; everything else in pickFrame still runs.
// Big-tier hold-up: after the 6-tick flash, the pose holds until holdEnd (counted on G.tick: 24 ticks, or the hit-stop plus HOLDUP_SHOW).
function bigFlashOn(){ return G.tick - pickFx.bigT < 3 * CFG.FLASH_BIG_HALF; }
function holdUpOn(){ return G.tick - pickFx.bigT >= 3 * CFG.FLASH_BIG_HALF && G.tick < pickFx.holdEnd; }
function pickFrame(){
  if (pickFx.stopLeft > 0 && G.state === 'play'){ pickFx.stopLeft--; pickFx.frozen++; }
  else { if (G.state !== 'play') pickFx.stopLeft = 0; stepState(); }
  stepSparks();
  walkNotch('m79', t800 && t800.weapon === 'm79' ? t800.ammo : 0);
  walkNotch('crate', DR.m79);
}
// HUD notch fill: a count that rises (after a pickup) moves one notch per tick with a tick sound; a fall is immediate.
function walkNotch(key, target){
  const n = pickFx.notch;
  if (n[key] > target || !pickFx.walk[key]) n[key] = target;
  else if (n[key] < target){ n[key]++; sfx('tick'); }
  if (n[key] >= target) pickFx.walk[key] = false;
}
// Sparkle: CFG.SPARKLE_N single pixels fly out along the diagonals.
const SPARK_DIRS = [[1, -1], [1, 1], [-1, 1], [-1, -1]];
function sparkle(x, y){
  for (let i = 0; i < CFG.SPARKLE_N; i++){
    const d = SPARK_DIRS[i % 4];
    pickFx.sparks.push({x, y, vx: d[0] * CFG.SPARKLE_SPD, vy: d[1] * CFG.SPARKLE_SPD, t: CFG.SPARKLE_TICKS});
  }
}
function stepSparks(){
  for (let i = pickFx.sparks.length - 1; i >= 0; i--){
    const p = pickFx.sparks[i];
    p.x += p.vx; p.y += p.vy;
    if (--p.t <= 0) pickFx.sparks.splice(i, 1);
  }
}
function drawSparks(){
  for (const p of pickFx.sparks) fillBox(Math.round(p.x), Math.round(p.y), 1, 1, 'd');
}

// ===================== LOOP =====================
let lastNow = null, acc = 0;
// Fixed-step loop: accumulate real time, run up to MAX_STEPS sim steps, then draw once.
function frame(now){
  requestAnimationFrame(frame);   // scheduled first, so an exception below cannot stop the loop
  if (lastNow === null) lastNow = now;
  const dt = Math.min(250, now - lastNow) / 1000;
  lastNow = now;
  countFrame(now);
  acc += dt;
  let steps = 0;
  while (acc >= CFG.TICK && steps < CFG.MAX_STEPS){ stepOnce(); acc -= CFG.TICK; steps++; }
  if (steps >= CFG.MAX_STEPS) acc = 0;
  render();
}
G.best = loadBest();
// Exposed for debugging and the playtest scripts: run state, upgrades, cash, threats, heat.
window.G = G;
goSelect();
G.state = 'title';
// ?cut=drainIn|drainOut|millIn plays one scene, then returns to the title.
const cutQ = new URLSearchParams(location.search).get('cut');
if (cutQ && CUT_SCENES[cutQ]) startCut(cutQ, () => { G.state = 'title'; });
fitCanvas();
window.addEventListener('resize', fitCanvas);
if (G.state !== 'cutscene') render();
CINE_PORTRAIT_READY.then(() => { render(); requestAnimationFrame(frame); });
</script>
