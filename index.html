// ===================== RNG & MATH =====================
// mulberry32 seeded PRNG. The platform random source is not used; every random choice goes through rnd().
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(CFG.SEED || 0);
// Float in [0,1) from the seeded generator.
function rnd(){ return rng(); }
// Float in [lo,hi).
function rndRange(lo, hi){ return lo + (hi - lo) * rnd(); }
// Integer in [lo,hi] inclusive.
function rndInt(lo, hi){ return lo + Math.floor(rnd() * (hi - lo + 1)); }
// Restart the generator from a seed.
function reseed(seed){ rng = mulberry32(seed); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function dist(ax, ay, bx, by){ return Math.hypot(bx - ax, by - ay); }
// Signed difference between two angles, wrapped to [-PI, PI].
function angDiff(a, b){ const d = a - b; return Math.atan2(Math.sin(d), Math.cos(d)); }
// Is (px,py) inside a cone of `range` and half-angle `half` centred on `ang`, cast from actor a.
function inCone(a, ang, px, py, range, half){
  const dx = px - a.x, dy = py - a.y, d = Math.hypot(dx, dy);
  if (d > range || d < 4) return false;
  return Math.abs(angDiff(Math.atan2(dy, dx), ang)) < half;
}

// BAKE: build the 24 rows for a def, facing, walk frame.
function rowsFor(d, facing, walk){
  const r = (d.base || BASE).slice();
  if (walk) for (const k in WALK) r[k] = WALK[k];
  if (facing==='up') for (const k in BACK) r[k] = BACK[k];
  for (const name of d.over){
    const o = OV[name];
    if (o.when!=='any' && o.when!==facing) continue;
    for (const k in o.rows){
      const src = o.rows[k]; let out = '';
      for (let x=0;x<16;x++) out += src[x]==='_' ? r[k][x] : src[x];
      r[k] = out;
    }
  }
  r.forEach((row,i)=>{ if(row.length!==16) throw new Error('row '+i+' width '+row.length); });
  return r;
}

function paint(ctx, rows, map, ox, oy, flip, shimmerT){
  const H = rows.length, W = rows[0].length;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const role = rows[y][flip?W-1-x:x];
    if (role==='.') continue;
    let c = map[role];
    if (c===undefined){ c = 'MAG'; }
    if (shimmerT!==undefined && role!=='O' && (((x - y + shimmerT) % 14) + 14) % 14 < 2) c = '1';
    ctx.fillStyle = c==='MAG' ? '#ff00ff' : PAL[c];
    ctx.fillRect(ox+x, oy+y, 1, 1);
  }
}

// Owned levels for a role's mark keys.
function gearOwned(role){ const o = {}; for (const m of GEAR[role] || []) o[m.key] = lvl(m.key); return o; }
// Pixels for the owned marks on one face ('up' or 'down'). Level 2+ adds the l2 pixels.
function gearMarks(role, owned, face){
  const out = [];
  for (const m of GEAR[role] || []){
    const n = owned[m.key] || 0;
    if (!n || (m.face !== 'any' && m.face !== face)) continue;
    out.push(...m.c);
    if (n >= 2) out.push(...m.l2);
  }
  return out;
}
// Tier 3 signatures, baked into the sprite: T-800 red endo-eye, T-1000 chrome ripple on each step, John's red bandana.
function gearSig(role, face, walk){
  if (role === 'john') return gRow(4, 4, 11, 'R');
  if (role === 't800') return face === 'down' ? [[6,6,'X'],[9,6,'X']] : [];
  return walk === 1 ? [[6,18,'Z'],[9,18,'Z']] : [];
}
// Power tier 0-3: total owned upgrade levels divided by CFG.POWER_TIER_EVERY, capped at 3.
function powerTier(role){
  let n = 0;
  for (const u of upList(role)) n += lvl(u.key);
  return Math.min(3, Math.floor(n / CFG.POWER_TIER_EVERY));
}
// Each def gets a small integer id, so the cache key stays cheap per frame.
const DEF_IDS = new WeakMap();
let DEF_N = 0;
function defId(d){ let k = DEF_IDS.get(d); if (k === undefined){ k = DEF_N++; DEF_IDS.set(d, k); } return k; }
// The geared sprite: the body sprite with marks and the tier 1-3 changes baked in, cached per (def, role, sarah, facing, walk, flip, owned, tier).
// The result is drawn at the same rect and flash as the plain sprite. Without marks or a tier it is the plain sprite.
const GEAR_CACHE = new Map();
function gearedSprite(d, facing, walk, flip, role, sarah, tierOv){
  const tier = tierOv === undefined ? powerTier(role) : tierOv, face = facing === 'up' ? 'up' : 'down';
  const owned = gearOwned(role);
  const marks = gearMarks(role, owned, face);
  if (!marks.length && tier === 0) return sprite(d, facing, walk, flip);
  const sig = tier >= 3 ? gearSig(role, face, walk) : [];
  const key = defId(d) + '|' + role + (sarah ? 'S' : '') + '|' + facing + walk + flip + '|' + Object.values(owned).join(',') + '|' + tier;
  let c = GEAR_CACHE.get(key);
  if (c) return c;
  const rows = rowsFor(d, facing, walk).map(r => r.split(''));
  for (const [x, y, r] of marks.concat(sig)){
    if (x < 0 || x > 15 || y < 0 || y > 23) throw new Error('gear pixel out of frame ' + x + ',' + y);
    rows[y][x] = r;
  }
  const map = Object.assign({}, d.map, sarah ? GEAR_COLS_SARAH : GEAR_COLS);
  if (tier >= 1) map.O = TIER_OUTLINE[role];
  c = document.createElement('canvas'); c.width = 16; c.height = 24;
  paint(c.getContext('2d'), rows.map(r => r.join('')), map, 0, 0, flip);
  GEAR_CACHE.set(key, c);
  return c;
}

const F = {A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'101111111111101',O:'111101101101111',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','%':'100101010101001',
  '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','!':'010010010000010','?':'110001010000010','-':'000000111000000',':':'000010000010000',' ':'000000000000000',"'":'010010000000000'};
// Draw a string at (x,y) in palette colour col. Advances 4 px per character.
function text(ctx, s, x, y, col){
  ctx.fillStyle = PAL[col];
  for (const ch of s){ const g = F[ch]||F[' ']; for (let i=0;i<15;i++) if(g[i]==='1') ctx.fillRect(x+i%3, y+(i/3|0), 1, 1); x += 4; }
}
// Text with a one-pixel black outline.
function textOutlined(ctx, s, x, y, col){
  for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) text(ctx, s, x+dx, y+dy, '0');
  text(ctx, s, x, y, col);
}
// Pixel width of text() output.
function textWidth(s){ return s.length*4 - 1; }
// Floating text on a solid black backing (text width plus padding, 5 px glyphs), so it reads over any sign.
function textBacked(s, x, y, col, outlined){
  const p = CFG.FLOAT_PAD;
  fillBox(x - p, y - p, textWidth(s) + 2*p, 5 + 2*p, '0');
  if (outlined) textOutlined(bctx, s, x, y, col); else text(bctx, s, x, y, col);
}
// Big title: each font pixel is sc x sc (3 by default); the top row of each glyph is drawn in hi.
function drawBig(ctx, s, x, y, col, hi, sc){
  sc = sc || 3;
  for (const ch of s){
    const g = F[ch] || F[' '];
    for (let i=0;i<15;i++) if (g[i]==='1'){
      ctx.fillStyle = PAL[i<3 ? hi : col];
      ctx.fillRect(x+(i%3)*sc, y+((i/3)|0)*sc, sc, sc);
    }
    x += 4*sc;
  }
}
// Pixel width of drawBig() output at scale sc (3 by default).
function bigWidth(s, sc){ sc = sc || 3; return s.length*4*sc - sc; }

// Small pickup and vehicle icons, baked once from filled rects. Empty pixels next to art get a '0' outline.
const ICON_CACHE = {};
// Bake a w x h canvas from [x,y,w,h,col] rects (drawn in order), then outline the art in '0'.
function bakeIcon(w, h, rects){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (const [x, y, rw, rh, col] of rects){ g.fillStyle = PAL[col]; g.fillRect(x, y, rw, rh); }
  const px = g.getImageData(0, 0, w, h).data;
  const art = (x, y) => x >= 0 && y >= 0 && x < w && y < h && px[(y * w + x) * 4 + 3] > 0;
  g.fillStyle = PAL['0'];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (art(x, y)) continue;
    if (art(x - 1, y) || art(x + 1, y) || art(x, y - 1) || art(x, y + 1)) g.fillRect(x, y, 1, 1);
  }
  return c;
}

// Solid rectangles (planters, bench): feet are pushed out and bullets stop on them.
const SOLIDS = [
  {x:36,  y:98,  w:32, h:20},   // Planter A
  {x:186, y:120, w:32, h:20},   // Planter B
  {x:108, y:70,  w:40, h:14},   // Bench

// Store doors. x is the door centre, y is the threshold.
const DOORS = [{x:32,y:50},{x:96,y:50},{x:160,y:50},{x:224,y:50}];
// Is (x,y) inside a solid, with `pad` px of margin?
function inSolid(x, y, pad){
  for (const s of SOLIDS) if (x >= s.x-pad && x <= s.x+s.w+pad && y >= s.y-pad && y <= s.y+s.h+pad) return true;
  return false;
}
// Push a feet point out of the nearest solid edge.
function pushOutOfSolids(a){
  for (const s of SOLIDS){
    if (!(a.x >= s.x-2 && a.x <= s.x+s.w+2 && a.y >= s.y-2 && a.y <= s.y+s.h+2)) continue;
    const left = a.x - (s.x-2), right = (s.x+s.w+2) - a.x, up = a.y - (s.y-2), down = (s.y+s.h+2) - a.y;
    const m = Math.min(left, right, up, down);
    if (m === left) a.x = s.x-2;
    else if (m === right) a.x = s.x+s.w+2;
    else if (m === up) a.y = s.y-2;
    else a.y = s.y+s.h+2;
  }
}
// A floor point that is walkable and clear of solids.
function validFloorPoint(x, y){
  return x >= 8 && x <= W-8 && y >= FLOOR_Y+16 && y <= CFG.FEET_MAX_Y && !inSolid(x, y, 6);
}
// Random walkable floor point (seeded). Falls back to a fixed spot after 200 tries.
function randomFloorPoint(){
  for (let i=0;i<200;i++){
    const x = rndRange(8, W-8), y = rndRange(FLOOR_Y+16, CFG.FEET_MAX_Y);
    if (validFloorPoint(x, y)) return {x, y};
  }
  return {x: 128, y: 120};
}

// Bosses use chapter slot 2. STEEL MILL (index 6) is never picked for a round; the boss arena reuses its palette.
function stageTheme(){
  const st = STAGES[clamp(G.stage, 0, STAGES.length - 1)];
  const slot = st.kind === 'boss' ? 2 : st.slot;
  if (st.ch === 0 && G.loop <= 1 && st.kind !== 'boss') return slot;

// Background bitmap for one theme: tiles, four storefronts, planters, bench, HUD strip. Pure drawing.
function drawBg(theme){
  const bgc = document.createElement('canvas'); bgc.width = W; bgc.height = H;
  const g = bgc.getContext('2d'), P = bgPal(theme);
  const px = (x, y, c) => { g.fillStyle = P[c]; g.fillRect(x, y, 1, 1); };
  const rect = (x, y, w, h, c) => { g.fillStyle = P[c]; g.fillRect(x, y, w, h); };
  // floor tiles
  for (let y = FLOOR_Y; y < HUD_Y; y++) for (let x = 0; x < W; x++){
    const tx = x >> 4, ty = (y - FLOOR_Y) >> 4, lx = x & 15, ly = (y - FLOOR_Y) & 15;
    let c = '2';
    const h = ((x * 73856093) ^ (y * 19349663)) >>> 0;
    if (h % 29 === 0) c = '3'; else if (h % 41 === 1) c = '1';
    // Checker floor (DAY WARD): every other 16-px tile takes the dark colour.
    if (theme.checker && ((tx + ty) & 1)) c = '3';
    if (tx % 4 === 1 && ty % 3 === 1){ const d = Math.abs(lx - 8) + Math.abs(ly - 8); if (d < 5) c = d < 3 ? 'e' : '8'; }
    if (lx === 0 || ly === 0) c = '3';
    px(x, y, c);
  }
  // Dark floor edge: the outer VIG_PX pixels of the floor fade to black, one solid step per pixel (no dither).
  if (theme.vignette){
    for (let y = FLOOR_Y; y < HUD_Y; y++) for (let x = 0; x < W; x++){
      const d = Math.min(x, W - 1 - x, y - FLOOR_Y, HUD_Y - 1 - y);
      if (d >= CFG.THEME_VIG_PX) continue;
      g.globalAlpha = CFG.THEME_VIG_ALPHA * (1 - d / CFG.THEME_VIG_PX);
      g.fillStyle = P['0']; g.fillRect(x, y, 1, 1);
    }
    g.globalAlpha = 1;
  }
  // storefronts: the layout is fixed, the colours and names come from the theme
  theme.shops.forEach(([wall, awn, signC, glassD], i) => {
    const x0 = i * 64, name = theme.stores[i];
    rect(x0, 0, 64, FLOOR_Y, wall);
    rect(x0 + 12, 2, 40, 9, '0'); text(g, name, x0 + 32 - ((name.length * 4 - 1) >> 1), 4, signC);
    // Awning: 4 px stripes of the awning colour and the light colour, with a solid awning-coloured lip on row 18.
    for (let x = 0; x < 64; x++){ rect(x0 + x, 13, 1, 5, ((x >> 2) & 1) ? '1' : awn); }
    rect(x0, 18, 64, 1, awn);
    rect(x0 + 4, 20, 56, 26, '0');
    rect(x0 + 5, 21, 22, 24, glassD); rect(x0 + 37, 21, 22, 24, glassD);
    for (let k = 0; k < 22; k++){ px(x0 + 5 + k, 21 + ((k * 2) % 24), 'e'); px(x0 + 37 + k, 21 + ((k * 2 + 6) % 24), 'e'); }
    rect(x0 + 28, 24, 8, 22, 'e'); rect(x0 + 31, 24, 1, 22, '0');
    rect(x0, 0, 2, FLOOR_Y, '3'); rect(x0 + 62, 0, 2, FLOOR_Y, '3');
    // LOCKDOWN: steel shutters half-down over the top of each glass front
    if (theme.shutters){ for (let y = 20; y < 33; y += 2) rect(x0 + 4, y, 56, 1, '2'); rect(x0 + 4, 33, 56, 1, '3'); }
  });
  rect(0, FLOOR_Y - 2, W, 2, '7');
  // planters
  function planter(x, y){
    rect(x, y, 32, 14, '0'); rect(x + 1, y + 1, 30, 12, '6'); rect(x + 1, y + 9, 30, 4, '7');
    for (let i = 0; i < 5; i++){ const bx = x + 3 + i * 6, by = y - 6; rect(bx - 1, by, 8, 9, '0'); rect(bx, by + 1, 6, 7, 'f'); px(bx + 1, by + 2, 'd'); px(bx + 4, by + 4, '7'); }
  }
  planter(36, 104); planter(186, 126);
  // bench
  rect(108, 70, 40, 10, '0'); rect(109, 71, 38, 3, '6'); rect(109, 75, 38, 3, '6'); rect(111, 80, 3, 4, '4'); rect(142, 80, 3, 4, '4');
  // HUD strip
  rect(0, HUD_Y, W, H - HUD_Y, '0');
  return bgc;
}

    if (((G.tick >> 4) % CFG.THEME_EXIT_CYCLE) !== CFG.THEME_EXIT_OFF){

      text(bctx, 'EXIT', CFG.THEME_EXIT_X, CFG.THEME_EXIT_Y, 'b');
    }
  }
}

  const span = HUD_Y - FLOOR_Y;

    bctx.fillStyle = PAL[k % 2 ? 'd' : 'c'];

  }
}

// Sarah's shop pool is John's eight. Her decoy upgrade, SURVIVALIST, is bought only in the special-upgrade row (SARAH_SPECIAL_UP), so it has one place to buy it.

// Threat pool per role (from round 2, one per round, stacking).
const THREATS = {
  john: ['K-9 UNIT', 'RADIOS', 'CAMERAS', 'SLOW CROWD'],

// Price of the next level: tier base plus PRICE_RISE per level already owned.
function upPrice(u){
  const base = u.tier === 'A' ? CFG.PRICE_A : u.tier === 'B' ? CFG.PRICE_B : CFG.PRICE_C;
  return Math.round(base * (1 + CFG.PRICE_RISE * lvl(u.key)) * (1 + CFG.LOOP_PRICE * loopN()));
}
// Upgrade record for a key in the current role's pool.
function upByKey(key){ return upList(G.role).find(u => u.key === key); }
// True when a named threat is active this run.
function hasThreat(name){ return G.threats.includes(name); }
// Next threat: prefers names not yet active; repeats only once the pool is exhausted.
function pickThreat(){
  const pool = THREATS[G.role];
  const fresh = pool.filter(t => !G.threats.includes(t));
  const list = fresh.length ? fresh : pool;
  return list[(rnd() * list.length) | 0];
}
// Build an actor with every field the systems read, so no field is ever undefined.

    kind, role, d, x, y, tx: x, ty: y, cx: x, cy: y, vx: 0, vy: 0, spd,
    heading: 0, facing: 'down', moving: false, dwell: 0, t: (rnd()*40)|0,
    sweepT: 0, sweepPh: rnd()*Math.PI*2, coneAng: 0,
    down: 0, panicT: 0, panicX: x, panicY: y,
    hidden: false, seen: false, shover: false, controlled: false,
    flashT: 0, hearts: 0, invuln: 0, aiT: 0,

    shells: CFG.SHOT_SHELLS, reload: 0, swingSide: 1, swingT: 0,
    strafeSide: 1, strafeT: 0, lungeCD: 0, lungeWind: 0, lungeDash: 0, dashX: x, dashY: y,

// Shopper, cop and round scaling.
function shopperCount(round){ return Math.min(CFG.SHOPPERS_CAP, CFG.SHOPPERS + CFG.SHOPPERS_PER_ROUND*(round-1)); }
function copCount(round){ return Math.min(CFG.COPS_CAP, CFG.COPS + CFG.COPS_PER_ROUND*(round-1)); }
function speedScale(round){ return (1 + CFG.SPEED_STEP*(round-1)) * (1 + CFG.LOOP_SPD*loopN()); }
// Seconds on the round timer.
function roundSeconds(round){ return Math.max(CFG.ROUND_TIME_MIN, CFG.ROUND_TIME - CFG.ROUND_TIME_STEP*(round-1)); }
// Whole seconds left on the timer.
function secondsLeft(){ return Math.floor(G.timer / 60); }
// Everything that carries a cone: real cops plus the T-1000 (disguised as a cop).
// The hunter T-1000 of the T-800 round is disguised and has no cone; only real cops watch there.
function watchers(){
  const base = t1000 && G.role !== 't800' ? copsList.concat([t1000]) : copsList;
  return cams.length ? base.concat(cams) : base;
}
// Cone reach: LOCKDOWN widens John's and the T-800's cones by LOCK_CONE.
function coneR(){ return G.heatStage >= 3 && G.role !== 't1000' ? CFG.CONE_R * CFG.LOCK_CONE : CFG.CONE_R; }
// Record a round-ending loss; the first reason sticks.
// True during the round-start grace (CFG.GRACE_TICKS): no exposure or ID gain, no stalk trigger, no AI fire.
function inGrace(){ return G.grace > 0; }
// Loss label when John dies: the T-800 round calls it JOHN TERMINATED.
function terminatedWhy(){ return G.role === 't800' ? 'JOHN TERMINATED' : 'TERMINATED'; }
// Build the cast for a round: John, T-800, T-1000, real cops and shoppers.
function spawnCast(round){
  t800Slugs = []; // pellets never carry over from a previous round
  actors = []; bullets = []; shotFlashes = []; floaters = []; coins = []; copsList = [];
  pickups = []; t1kDrops = []; grenades = []; blades = []; blastFx = []; bikeProp = null;
  const p = randomFloorPoint();
  john = makeActor('john', 'john', johnDef(), p.x, p.y, CFG.JOHN_SPD);
  john.controlled = true; john.hearts = maxHearts();
  const q = randomFloorPoint();
  t800 = makeActor('t800', 't800', CAST.t800, q.x, q.y, CFG.AI_T800_SPD);
  const cast = curCast();
  const r = randomFloorPoint();
  t1000 = makeActor('t1000', 't1000', cast.t1000Def, r.x, r.y, CFG.COP_SPD);
  for (let i=0;i<copCount(round);i++){
    const c = randomFloorPoint();
    copsList.push(makeActor('cop', 'cop', cast.watcher(i), c.x, c.y, CFG.COP_SPD));
  }
  actors.push(john, t800, t1000, ...copsList);
  // CAMERAS: two fixed watchers on the top wall in the john round.
  cams = [];
  if (G.role === 'john' && hasThreat('CAMERAS')){
    for (const cx of CFG.CAM_X){
      const cam = makeActor('camera', 'camera', cast.watcher(0), cx, CFG.CAM_Y, 0);
      cam.heading = Math.PI / 2;
      cams.push(cam);
    }
  }
  G.shopStart = shopperCount(round);
  for (let i=0;i<G.shopStart;i++){
    const s = randomFloorPoint();
    const spd = rndRange(CFG.SHOPPER_SPD_MIN, CFG.SHOPPER_SPD_MAX);
    actors.push(makeActor('shopper', 'shopper', cast.shopper(i), s.x, s.y, cast.shuffle(i) ? spd * CFG.PATIENT_SHUFFLE_MUL : spd));
  }
}
// John's max hearts in the john round: base plus BAND-AID levels.
// John's max hearts: base count for the round's role, plus BAND-AID (heart) and MEDKIT (bandaid) levels.
function maxHearts(){ return (G.role === 't800' ? byRound(CFG.T800_JOHN_HEARTS_R) : CFG.JOHN_HEARTS) + lvl('heart') + lvl('bandaid') + (G.sarah ? CFG.SARAH_HEART_BONUS : 0); }
// Place the quarters in the open: fewer than QUARTER_CROWD shoppers within QUARTER_CLEAR_R.
function placeCoins(){
  coins = [];
  for (let i=0;i<CFG.QUARTERS;i++){
    let spot = randomFloorPoint();
    for (let tries=0; tries<200; tries++){
      const p = randomFloorPoint();
      if (countShoppersNear(p.x, p.y, CFG.QUARTER_CLEAR_R, 1) < CFG.QUARTER_CROWD){ spot = p; break; }
    }
    coins.push({x: spot.x, y: spot.y, got: false, spin: 0});
  }
}
// ===================== CROWD SIM =====================
// Count standing shoppers near (x,y). yScale stretches the vertical distance.
function countShoppersNear(x, y, r, yScale){
  let n = 0;
  for (const a of actors){
    if (a.kind !== 'shopper' || a.down > 0 || a.evac) continue;
    if (Math.hypot(a.x - x, (a.y - y) * yScale) < r) n++;
  }
  return n;
}
// HIDDEN: at least HIDE_N standing shoppers within HIDE_R (dy weighted).
function refreshHidden(){
  // HOODIE lowers the crowd needed (min 2); STREET SMART widens the AI John's radius in the T-1000 round.
  const need = Math.max(2, CFG.HIDE_N - lvl('hoodie') * CFG.HOODIE_CUT);
  const r = CFG.HIDE_R + (G.role === 't1000' && hasThreat('STREET SMART') ? CFG.STREET_R : 0);
  for (const a of actors){
    let n = countShoppersNear(a.x, a.y, r, CFG.HIDE_Y_SCALE);
    if (a.kind === 'shopper' && a.down === 0) n--;   // do not count yourself
    a.hidden = a.down === 0 && n >= need;
  }
  // BOX: a boxed John (and the one-second grace after the box) counts as hidden.
  if (G.role === 'john' && (G.boxT > 0 || G.boxGrace > 0)) john.hidden = true;
}
// Move feet toward (tx,ty) at speed sp. Sets heading, facing, velocity and the walk clock.
function walkTo(a, sp){
  const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
  a.moving = d > 1;
  if (!a.moving){ a.vx = 0; a.vy = 0; return; }
  const k = Math.min(sp, d) / d;
  a.vx = dx * k; a.vy = dy * k;
  a.x += a.vx; a.y += a.vy;
  a.heading = Math.atan2(dy, dx);
  a.facing = dy < -Math.abs(dx) * 0.5 ? 'up' : 'down';
  a.t++;
}
// Choose a shopper's next goal: a jittered point of interest (long dwell on arrival) or a random floor point (short dwell).
function pickShopperGoal(a){
  if (rnd() < CFG.POI_CHANCE){
    const p = CFG.POIS[rndInt(0, CFG.POIS.length - 1)];
    a.tx = clamp(p.x + rndRange(-CFG.POI_JITTER, CFG.POI_JITTER), 8, W-8);
    a.ty = clamp(p.y + rndRange(-CFG.POI_JITTER, CFG.POI_JITTER), CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
    a.goalPoi = true;
  } else {
    const p = randomFloorPoint(); a.tx = p.x; a.ty = p.y;
    a.goalPoi = false;
  }
}
// Idle drift at a point of interest: stay within 1 px of the spot so the crowd shimmers instead of freezing.
function driftAtPoi(a){
  a.x = clamp(a.x + rndRange(-0.3, 0.3), a.tx - 1, a.tx + 1);
  a.y = clamp(a.y + rndRange(-0.3, 0.3), a.ty - 1, a.ty + 1);
}
// Shopper idle: walk to goals, dwelling on arrival (long at a POI, short elsewhere).
function stepShopper(a){
  // SARAH DECOYS: a decoyed shopper (standing or collapsing) stays put, whatever else is going on around it.
  if (decoyFrozen(a)){ a.moving = false; a.vx = 0; a.vy = 0; return; }
  if (a.panicT > 0){ panicStep(a); return; }
  if (a.evac){ evacStep(a); return; }
  if (a.dwell > 0){
    a.dwell--; a.moving = false;
    if (a.atPoi) driftAtPoi(a);
    return;
  }
  if (dist(a.x, a.y, a.tx, a.ty) < 2){
    a.atPoi = a.goalPoi;
    a.dwell = a.goalPoi ? rndInt(CFG.POI_DWELL[0], CFG.POI_DWELL[1]) : (rnd() * (CFG.SHOPPER_DWELL + 1)) | 0;
    // SLOW CROWD: POIs farther than SLOW_FAR_R from John hold shoppers longer.
    if (a.goalPoi && hasThreat('SLOW CROWD') && john && dist(a.x, a.y, john.x, john.y) > CFG.SLOW_FAR_R) a.dwell = Math.round(a.dwell * CFG.SLOW_DWELL_MUL);
    pickShopperGoal(a);
    return;
  }
  a.atPoi = false;
  walkTo(a, a.spd * G.speedMul);
}
// Panicking shopper runs straight away from the gunshot for PANIC_TICKS, then picks a new target.
function panicStep(a){
  a.panicT--;
  const dx = a.x - a.panicX, dy = a.y - a.panicY, d = Math.hypot(dx, dy) || 1;
  const sp = CFG.PANIC_SPD * G.speedMul;
  a.vx = dx / d * sp; a.vy = dy / d * sp;
  a.x += a.vx; a.y += a.vy;
  a.moving = true; a.heading = Math.atan2(dy, dx);
  a.facing = dy < -Math.abs(dx) * 0.5 ? 'up' : 'down';
  a.t++;
  if (a.panicT === 0){ a.tx = a.x; a.ty = a.y; a.dwell = 0; a.atPoi = false; a.goalPoi = false; }
}
// Knock an actor flat for KNOCK_TICKS. A knocked cop loses any chase.
function knockDown(a, quiet){
  if (!quiet && a.down === 0 && a.kind === 'shopper' && G.role === 't800') G.run.bowled++;
  if (!quiet && a.down === 0 && G.role === 't1000') G.run.knocked++;
  a.down = CFG.KNOCK_TICKS; a.moving = false; a.vx = 0; a.vy = 0;
  if (a.kind === 'cop'){ a.chase = false; a.cHid = 0; }
}
// Count down knockdown and muzzle-flash timers.
function stepDown(a){
  if (a.down > 0) a.down--;
  if (a.flashT > 0) a.flashT--;
}
// Pairwise separation. A walking T-1000 shoves shoppers aside instead of being pushed itself.
function separate(){
  const mall = mallT1000Balance(), standing = mall && mallT1000Standing();
  let crowdShoved = false;
  for (let i=0;i<actors.length;i++) for (let j=i+1;j<actors.length;j++){
    const a = actors[i], b = actors[j];
    if (a.down > 0 || b.down > 0 || a.riding || b.riding) continue;
    // MIMIC: during the lure nothing shoves the disguised T-1000, so it moves only by its own walk, and a walking John can reach its touch radius.
    if (G.lureT > 0 && (a === t1000 || b === t1000)) continue;
    const dx = b.x - a.x, dy = (b.y - a.y) * CFG.SEP_Y_SCALE, d = Math.hypot(dx, dy);
    // John and shoppers use the tighter radius so he can sit inside a clump; everyone else uses SEP_R.
    const isJohnPair = (a === john && b.kind === 'shopper') || (b === john && a.kind === 'shopper');
    const radius = isJohnPair ? CFG.SEP_R_JOHN : CFG.SEP_R;
    if (d <= 0 || d >= radius) continue;
    const p = (radius - d) / d * CFG.SEP_PUSH;
    let wa = 1, wb = 1;
    // The mall defender and stationary Sarah decoys hold their ground.
    if (standing && ((a === t800 && b === t1000) || (b === t800 && a === t1000))){
      // Arnold holds his ground; the player's crowd-shoving privilege never displaces him.
      wa = a === t800 ? 0 : 2; wb = b === t800 ? 0 : 2;
    }
    else if (G.role === 't800' && !BS.on && (t800.shoveWind > 0 || t800.shoveRecover > 0) && (a === t800 || b === t800)){
      // Plant the player's feet: crowd separation must not drag a winding shove
      // backwards and make an otherwise reachable body escape its sweep.
      wa = a === t800 ? 0 : 2; wb = b === t800 ? 0 : 2;
    }
    else if (decoyFrozen(a) && !decoyFrozen(b)){ wa = 0; wb = 2; }
    else if (decoyFrozen(b) && !decoyFrozen(a)){ wa = 2; wb = 0; }
    else if (a.shover && !b.shover){ wa = 0; wb = 2; }
    else if (b.shover && !a.shover){ wa = 2; wb = 0; }
    a.x -= dx * p * wa; a.y -= dy * p * wa / CFG.SEP_Y_SCALE;
    b.x += dx * p * wb; b.y += dy * p * wb / CFG.SEP_Y_SCALE;
    const other = a === t1000 ? b : b === t1000 ? a : null;
    if (other && (other.kind === 'shopper' || other.kind === 'cop') && t1000.shover) crowdShoved = true;
  }
  // One increase per tick of real crowd contact, rather than taxing an empty-floor walk.
  if (standing && crowdShoved && john.revealT === 0 && G.keysT === 0) addSuspicion(CFG.MALL_CROWD_SUSP);
}
// Keep an actor on the floor, inside the walls, and out of solids.
function clampActor(a){
  a.x = clamp(a.x, 8, W-8);
  a.y = clamp(a.y, CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
  pushOutOfSolids(a);
}
// ===================== AI =====================
// Cone lights only shine for live watchers: not knocked down, not splashed, and the T-1000 only while patrolling or stalking.
function coneLive(w){
  return w.down === 0 && !w.frozen && G.alarmT <= 0 && (w.kind !== 't1000' || w.st === 'patrol' || w.st === 'stalk');
}
// Sweep every live watcher's cone back and forth around its heading.
function updateCones(){
  for (const w of watchers()){
    w.sweepT++;
    // CAMERAS point straight down and sweep a narrow arc.
    if (w.kind === 'camera'){ w.heading = Math.PI / 2; w.coneAng = w.heading + Math.sin(w.sweepT * CFG.CONE_RATE + w.sweepPh) * CFG.CAM_SWEEP; continue; }
    // The player's T-1000 cone faces its walking direction and sweeps only while standing still.
    if (w.controlled && w.moving) w.coneAng = w.heading;
    else w.coneAng = w.heading + Math.sin(w.sweepT * CFG.CONE_RATE + w.sweepPh) * CFG.CONE_SWEEP;
    // DECOY: cones within DECOY_R turn toward the beeping toy while it lasts.
    if (G.decoy && dist(w.x, w.y, G.decoy.x, G.decoy.y) < CFG.DECOY_R) w.coneAng = Math.atan2(G.decoy.y - w.y, G.decoy.x - w.x);
    // RADIOS: a snapped cone aims at John for its window.
    if (w.snapT > 0){ w.snapT--; w.coneAng = Math.atan2(john.y - w.y, john.x - w.x); }
  }
}
// Patrol: wander between random floor points. Cops may dwell; the T-1000 never does.
function patrolStep(a, canDwell){
  if (a.dwell > 0){ a.dwell--; a.moving = false; return; }
  if (dist(a.x, a.y, a.tx, a.ty) < 2){
    const p = randomFloorPoint(); a.tx = p.x; a.ty = p.y;
    if (canDwell) a.dwell = (rnd() * (CFG.COP_DWELL + 1)) | 0;
    return;
  }
  walkTo(a, CFG.COP_SPD * copMul());
}
// Cop speed multiplier: the heat speed-up, plus K-9 UNIT (cops +20%) when that threat is active.
function copMul(){ return G.speedMul * (hasThreat('K-9 UNIT') ? CFG.K9_MUL : 1); }
// Nearest shopper to actor a (standing shoppers only).
function nearestShopper(a){
  let best = null, bd = Infinity;
  for (const s of actors){
    if (s.kind !== 'shopper' || s.down > 0) continue;
    const d = dist(s.x, s.y, a.x, a.y);
    if (d < bd){ bd = d; best = s; }
  }
  return best;
}
// Crowd search: the shopper with the most shopper neighbours within AI_NEIGH_R, among shoppers within AI_JOHN_CROWD_R.
function pickCrowd(a){
  let best = null, bestN = -1;
  for (const s of actors){
    if (s.kind !== 'shopper' || s.down > 0) continue;
    if (dist(s.x, s.y, a.x, a.y) > CFG.AI_JOHN_CROWD_R) continue;
    const n = countShoppersNear(s.x, s.y, CFG.AI_NEIGH_R, 1);
    if (n > bestN){ bestN = n; best = s; }
  }
  if (best){ a.cx = best.x; a.cy = best.y; a.tx = best.x; a.ty = best.y; }
}
// Threat to a non-player John: a revealed T-1000 close by, or a bullet closing on him.
function johnThreat(a){
  // A stalking T-1000, or (T-1000 mode) a revealed John, treats the T-1000 as a threat within AI_THREAT_R.
  const fleeing = t1000 && (t1000.st === 'stalk' || (G.role === 't1000' && a.revealT > 0));
  if (fleeing && dist(a.x, a.y, t1000.x, t1000.y) < CFG.AI_THREAT_R) return {x: t1000.x, y: t1000.y};
  for (const b of bullets){
    if (dist(a.x, a.y, b.x, b.y) > CFG.AI_BULLET_R) continue;
    if (b.vx * (a.x - b.x) + b.vy * (a.y - b.y) > 0) return {x: b.x, y: b.y};
  }
  // T-800 round: an incoming hunter blade is a threat too.
  for (const b of blades){
    if (dist(a.x, a.y, b.x, b.y) > CFG.AI_BULLET_R) continue;
    if (b.vx * (a.x - b.x) + b.vy * (a.y - b.y) > 0) return {x: b.x, y: b.y};
  }
  return null;
}
// Flee from a threat, leaning toward the best crowd; if the T-800 is close, shelter just behind him.
function fleeFrom(a, th){
  if (t800 && dist(a.x, a.y, t800.x, t800.y) < CFG.AI_SHELTER_R){

function stepDash(a){
  a.lungeDash--;
  a.tx = a.dashX; a.ty = a.dashY;
  walkTo(a, CFG.T_LUNGE_SPD * G.speedMul);
  // BOX: a boxed John is not grabbed; the T-1000 can only flip the box (boxTouch).
  if (!john.riding && !boxed() && dist(a.x, a.y, john.x, john.y) <= CFG.T_GRAB_R){
    loseRound(terminatedWhy(), john, a); a.moving = false; a.lungeDash = 0;
  }
}
// Range keeping while stalking: close in beyond T_RANGE_MAX; inside it, orbit John at the current distance
// (perpendicular when closer than T_RANGE_MIN). The side flips every T_STRAFE_FLIP ticks.
function keepRange(a, d){
  // The hunter (T-800 round) stalks at HUNT_STALK_MUL of the T-1000 stalk speed.
  const sp = (a.perma ? CFG.T_PERMA_SPD : CFG.T_SPD) * G.speedMul * (G.role === 't800' ? CFG.HUNT_STALK_MUL * huntMul() : 1);
  if (d > CFG.T_RANGE_MAX){
    a.tx = john.x; a.ty = john.y;
    walkTo(a, sp);
    return;
  }
  if (a.strafeT <= 0){ a.strafeSide = -a.strafeSide; a.strafeT = CFG.T_STRAFE_FLIP; }
  a.strafeT--;
  const ang = Math.atan2(a.y - john.y, a.x - john.x);
  const off = d < CFG.T_RANGE_MIN ? Math.PI / 2 : CFG.T_STRAFE_ORBIT;
  const R = Math.max(d, 12), th = ang + a.strafeSide * off;
  a.tx = john.x + Math.cos(th) * R; a.ty = john.y + Math.sin(th) * R;
  walkTo(a, sp);
}
// Stalk: burst at John every T_BURST_EVERY ticks in range, lunge when close and off cooldown, otherwise keep range.
function stalkStep(a){
  if (!a.perma && a.cOut >= CFG.T_LOSE_OUT){
    a.st = 'patrol'; a.cNot = 0; a.cHid = 0; a.cOut = 0;
    patrolStep(a, false);
    return;
  }
  if (a.burstCD > 0) a.burstCD--;
  if (a.lungeCD > 0) a.lungeCD--;
  if (a.lungeDash > 0){ stepDash(a); return; }
  if (a.lungeWind > 0){ stepWindup(a); return; }
  const d = dist(a.x, a.y, john.x, john.y);
  if (d <= CFG.T_LUNGE_R && a.lungeCD <= 0){ startWindup(a); return; }
  if (a.burstCD <= 0 && d <= CFG.T_BURST_R && a.burstN === 0){
    a.burstCD = CFG.T_BURST_EVERY * lockCdMul();
    startBurst(a, john.x, john.y - 6);
  }
  keepRange(a, d);
}
// AI T-1000 (JOHN mode): patrols like a cop with no dwell; reveals and stalks John once he is exposed in its cone, or hidden in it long enough.
function aiT1000(a){
  if (a.st === 'frozen' || a.st === 'reform') return;
  if (a.st === 'reveal'){
    a.stT--;
    if (a.stT <= 0) enterStalk(a);
    return;
  }
  const inC = coneLive(a) && inCone(a, a.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF);
  a.cNot = inC && !john.hidden ? a.cNot + 1 : 0;
  a.cHid = inC && john.hidden ? a.cHid + 1 : 0;
  a.cOut = !inC && john.hidden ? a.cOut + 1 : 0;
  if (a.st === 'patrol'){
    if (inGrace()){ a.cNot = 0; a.cHid = 0; a.cOut = 0; patrolStep(a, false); return; }
    if (a.cNot >= CFG.T_STALK_IN || a.cHid >= CFG.T_STALK_HIDDEN){ startReveal(a); return; }
    if (decoyStab(a)) return;
    patrolStep(a, false);
    return;
  }
  stalkStep(a);
}
// Glint: 12 silver ticks every 160-220 ticks (drawn on the T-1000 face and chest).
function stepGlint(a){
  if (a.glintT > 0){ a.glintT--; return; }
  a.glintCD--;
  if (a.glintCD <= 0){
    a.glintT = CFG.GLINT_TICKS;
    // THERMAL HUD (T-800 round): the disguised T-1000 glints twice as often.
    const mul = G.role === 't800' && lvl('hud') > 0 ? CFG.THERMAL_MUL : 1;
    a.glintCD = Math.max(1, Math.round(rndInt(CFG.GLINT_MIN, CFG.GLINT_MAX) / mul));
  }
}
// AI cop: patrols with a flashlight; when chasing, runs at John, busts him on contact, and gives up after COP_GIVEUP hidden ticks.
function aiCop(a){
  if (a.qT > 0) a.qT--;
  // NITRO HARLEY BONK: a stunned cop stands still until stunT runs out.
  if (a.stunT > 0){ a.stunT--; a.moving = false; a.vx = 0; a.vy = 0; return; }
  // BOX: a boxed John (or in BOX_GRACE) cannot be caught. Any chase is dropped: the cop walks to his last seen point, then patrols.
  if (boxed() || G.boxGrace > 0){
    if (a.chase){ a.chase = false; a.cHid = 0; a.searchX = john.x; a.searchY = john.y; a.searchT = CFG.BOX_SEARCH_TICKS; floatAt(a.x - 4, a.y - 30, '?', 'd'); }
    if ((a.searchT || 0) > 0 && dist(a.x, a.y, a.searchX, a.searchY) > 4){
      a.searchT--; a.tx = a.searchX; a.ty = a.searchY; walkTo(a, CFG.COP_SPD * copMul()); return;
    }
    a.searchT = 0;
  }
  // BOX: a cop that bumps the box says '?', nudges 1 px away and stands still for BOX_BUMP_TICKS. Nothing is exposed (see updateExposure).
  if ((a.boxCD || 0) > 0) a.boxCD--;
  if ((a.boxPause || 0) > 0){ a.boxPause--; a.moving = false; a.vx = 0; a.vy = 0; return; }
  if (boxed() && !a.chase && (a.boxCD || 0) <= 0 && dist(a.x, a.y, john.x, john.y) <= CFG.BOX_BUMP_R){
    const nx = a.x + (a.x < john.x ? -CFG.BOX_NUDGE_PX : CFG.BOX_NUDGE_PX);
    if (!inSolid(nx, a.y, 2)) a.x = nx;
    a.boxPause = CFG.BOX_BUMP_TICKS; a.boxCD = 2 * CFG.BOX_BUMP_TICKS; a.qT = CFG.BOX_BUMP_TICKS;
    floatAt(a.x - 4, a.y - 30, '?', 'd');
    return;
  }
  // Chasing and BUSTED are JOHN-mode rules only (§3a). Other rounds: plain patrol.
  // SARAH DECOYS: a patrolling cop is lured to a jacket decoy.
  if (!a.chase && decoyReach(a)){ a.moving = false; a.vx = 0; a.vy = 0; return; }
  if (!a.chase && decoyPull(a)){ walkTo(a, CFG.COP_SPD * copMul()); return; }
  if (!a.chase && decoyLure(a)){ walkTo(a, CFG.COP_SPD * copMul()); return; }
  if (!a.chase || G.role !== 'john'){ patrolStep(a, true); return; }
  a.cHid = john.hidden ? a.cHid + 1 : 0;
  if (a.cHid >= CFG.COP_GIVEUP){
    a.chase = false; a.cHid = 0; a.qT = CFG.COP_GIVEUP_SHOW;
    patrolStep(a, true);
    return;
  }
  if (!boxed() && G.boxGrace <= 0 && dist(a.x, a.y, john.x, john.y) <= CFG.COP_BUSTED_R){ loseRound('BUSTED', john, a); a.moving = false; return; }
  a.tx = john.x; a.ty = john.y;
  walkTo(a, CFG.COP_CHASE_SPD * copMul());
}
// Send a cop after John. The meter resets to 50% once a chase starts.
// RADIOS: every other cop's cone snaps onto John for RADIO_SNAP ticks.
function startChase(c){
  c.chase = true; c.cHid = 0; c.qT = 0;
  G.exposure = CFG.EXPOSE_RESET;
  if (G.role === 'john' && hasThreat('RADIOS')){
    for (const o of copsList) if (o !== c) o.snapT = CFG.RADIO_SNAP;
  }
}
// Pick the cop to chase: prefer one whose cone is on John, otherwise the nearest free cop.
function pickChaser(){
  let best = null, bestD = Infinity;
  for (const c of copsList){
    if (c.down > 0 || c.chase) continue;
    const onHim = inCone(c, c.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF) && coneLive(c);
    const d = dist(c.x, c.y, john.x, john.y) - (onHim ? 1000 : 0);
    if (d < bestD){ bestD = d; best = c; }
  }
  return best;
}
// Kid John (T-800 round): panic first, then COME WITH ME, otherwise wander on his own clock.
function aiKidJohn(a){
  if (a.riding) return;
  const th = johnThreat(a);
  if (th){ a.kidPanicT = CFG.KID_PANIC_TICKS; a.kidFX = th.x; a.kidFY = th.y; }
  if (a.kidPanicT > 0){ panicRun(a); return; }
  if (a.callRun || a.callT > 0){ kidFollow(a); return; }
  a.kidT--;
  // WILD KID: John wanders WILD_MUL times as often.
  if (a.kidT <= 0){ a.kidT = Math.round(rndInt(CFG.KID_WANDER[0], CFG.KID_WANDER[1]) / (hasThreat('WILD KID') ? CFG.WILD_MUL : 1)); pickKidGoal(a); }
  walkTo(a, CFG.KID_SPD * G.speedMul);
}
// Kid John runs straight away from the spot he is panicking about, for the rest of his panic.
function panicRun(a){
  a.kidPanicT--;
  const dx = a.x - a.kidFX, dy = a.y - a.kidFY, d = Math.hypot(dx, dy) || 1;
  a.tx = a.x + dx / d * CFG.KID_PANIC_RUN; a.ty = a.y + dy / d * CFG.KID_PANIC_RUN;
  walkTo(a, CFG.KID_PANIC_SPD * G.speedMul);
}
// Kid John's next goal: a store-window point (weighted by KID_WEIGHTS over POIS) or a random floor point.
function pickKidGoal(a){
  if (rnd() < byRound(CFG.KID_WINDOW_CHANCE_R)){
    let total = 0;
    for (let i = 0; i < CFG.POIS.length; i++) total += CFG.KID_WEIGHTS[i];
    let r = rnd() * total, i = 0;
    while (i < CFG.POIS.length - 1 && r >= CFG.KID_WEIGHTS[i]){ r -= CFG.KID_WEIGHTS[i]; i++; }
    a.tx = CFG.POIS[i].x; a.ty = CFG.POIS[i].y;
  } else {
    const p = randomFloorPoint(); a.tx = p.x; a.ty = p.y;
  }
}
// Spot KID_BEHIND px behind the T-800, on the side away from the T-1000.
function behindPoint(){
  const ux = t800.x - t1000.x, uy = t800.y - t1000.y, d = Math.hypot(ux, uy) || 1;
  return {x: t800.x + ux / d * CFG.KID_BEHIND, y: t800.y + uy / d * CFG.KID_BEHIND};
}
// COME WITH ME: John runs to the spot behind the T-800, then stays glued there for the rest of KID_CALL_TICKS.
function kidFollow(a){
  a.callT--;
  if (a.callRun){
    a.callRunT++;
    if (dist(a.x, a.y, t800.x, t800.y) <= CFG.KID_BEHIND + 2 || a.callRunT > CFG.KID_CALL_RUN_MAX) a.callRun = false;
  }
  const p = behindPoint();
  a.tx = p.x; a.ty = p.y;
  walkTo(a, CFG.KID_CALL_SPD * G.speedMul);
}
// Hunter T-1000 (T-800 round): always knows John. Disguised, it walks at him; within HUNT_REVEAL_R it reveals and stalks with blades.
function aiHunterT1000(a){
  if (a.st === 'frozen' || a.st === 'reform') return;
  if (a.st === 'puddle'){ puddleStep(a); return; }
  if (a.st === 'reveal'){ a.stT--; if (a.stT <= 0) enterStalk(a); return; }
  if (a.st === 'patrol'){
    if (!inGrace() && dist(a.x, a.y, john.x, john.y) <= CFG.HUNT_REVEAL_R){ startReveal(a); return; }
    huntApproach(a);
    return;
  }
  hunterBlades(a);
  if (a.bladeWind > 0) return;
  stalkStep(a);
}
// Disguised approach: walk at John with a sideways weave so the hunter threads through the crowd.
function huntApproach(a){
  const dx = john.x - a.x, dy = john.y - a.y, d = Math.hypot(dx, dy) || 1;
  const w = Math.sin(a.t * 0.1 + a.sweepPh) * CFG.HUNT_WEAVE;
  a.tx = john.x - dy / d * w; a.ty = john.y + dx / d * w;
  walkTo(a, byRound(CFG.HUNT_SPD_R) * G.speedMul * huntMul());
}
// LIQUID SPRINT: the hunter moves 15% faster while the threat is active.
function huntMul(){ return hasThreat('LIQUID SPRINT') ? CFG.SPRINT_MUL : 1; }
// Blade cycle while stalking: a telegraphed wind-up when John is in blade range, then a throw on cooldown.
// TWIN BLADES: the second spike follows TWIN_GAP ticks after the first.
function hunterBlades(a){
  if (a.twinT > 0){ a.twinT--; if (a.twinT === 0) throwBlade(a, true); }
  if (a.bladeCD > 0) a.bladeCD--;
  if (a.bladeWind > 0){
    a.bladeWind--; a.moving = false; a.vx = 0; a.vy = 0;
    if (a.bladeWind === 0) throwBlade(a);
    return;
  }
  const d = dist(a.x, a.y, john.x, john.y);
  if (a.bladeCD <= 0 && d >= CFG.BLADE_MIN_R && d <= CFG.BLADE_MAX_R && !john.riding){
    a.bladeWind = CFG.BLADE_WIND; a.moving = false; a.vx = 0; a.vy = 0;
  }
}
// Release one blade spike from the hunter's hand, aimed at John's chest as it leaves.
function throwBlade(a, second){
  const hx = a.x, hy = a.y - 10, ang = Math.atan2(john.y - 10 - hy, john.x - hx);
  blades.push({x: hx, y: hy, vx: Math.cos(ang) * CFG.BLADE_SPD, vy: Math.sin(ang) * CFG.BLADE_SPD, t: CFG.BLADE_LIFE});

  if (second) return;
  a.bladeCD = byRound(CFG.BLADE_CD_R);
  if (hasThreat('TWIN BLADES')) a.twinT = CFG.TWIN_GAP;
}
// Puddle: a silver slick slides to a point PUDDLE_DIST px from John, then rises disguised when its clock runs out.
function puddleStep(a){
  a.stT--;
  const dx = a.x - john.x, dy = a.y - john.y, d = Math.hypot(dx, dy) || 1;
  a.tx = john.x + dx / d * CFG.PUDDLE_DIST; a.ty = john.y + dy / d * CFG.PUDDLE_DIST;
  if (G.tick % CFG.PUDDLE_TRAIL_EVERY === 0){ (a.trail = a.trail || []).unshift({x: a.x, y: a.y}); if (a.trail.length > 3) a.trail.length = 3; }
  walkTo(a, CFG.PUDDLE_SPD * G.speedMul);

// Rise from the puddle: a shimmer re-form in a new random cop or shopper disguise, then back to patrol.
function riseFromPuddle(a){
  a.st = 'reform'; a.stT = CFG.SHIMMER_TICKS; a.moving = false; a.vx = 0; a.vy = 0;
  const cast = curCast();
  a.d = rnd() < 0.5 ? cast.t1000Def : cast.shopper(rndInt(0, CFG.DISGUISE_N - 1));
  a.cNot = 0; a.cHid = 0; a.cOut = 0; a.bladeWind = 0; a.trail = [];
}
// Blades fly until a wall, a solid, or the T-800's body stops them; they pass through shoppers. A hit costs John a heart.
function stepBlades(){
  for (let i = blades.length - 1; i >= 0; i--){
    const b = blades[i];
    b.x += b.vx; b.y += b.vy; b.t--;
    let gone = b.t <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > HUD_Y || inSolid(b.x, b.y, 0);
    // ARMOR (T-800 round) widens the T-800's block radius by PLATE_STEP per level.
    if (!gone && dist(b.x, b.y, t800.x, t800.y - 10) <= CFG.T800_BLOCK_R + lvl('plating') * CFG.PLATE_STEP) gone = true;
    if (!gone && dist(b.x, b.y, john.x, john.y - 10) <= CFG.BULLET_HIT_R){ damageJohn(); gone = true; }
    if (gone) blades.splice(i, 1);
  }
}

// ===================== COMBAT =====================
// Pistol bursts, shotgun cones, bullets, knockdowns, the T-1000 splash and re-form.
// A gunshot at (x,y) panics shoppers within PANIC_R: they run straight away.
function gunshot(x, y, r){
  const R = r || CFG.PANIC_R;
  for (const a of actors){
    if (a.kind !== 'shopper' || a.down > 0) continue;
    if (dist(a.x, a.y, x, y) <= R){ a.panicT = CFG.PANIC_TICKS; a.panicX = x; a.panicY = y; }
  }
}
// Queue a 3-round pistol burst aimed at (tx,ty).
// FINGER SPIKES: a T-1000 burst fires SPIKE_BURST rounds instead of BURST_N.
function startBurst(a, tx, ty){
  a.burstN = a.kind === 't1000' && lvl('spike') > 0 ? CFG.SPIKE_BURST : CFG.BURST_N;
  a.burstWait = 0; a.burstX = tx; a.burstY = ty;
}
// Release burst rounds, CFG.BURST_GAP ticks apart, with a small random spread.
function stepBurst(a){
  if (a.burstN <= 0) return;
  if (a.burstWait > 0){ a.burstWait--; return; }
  a.burstN--; a.burstWait = CFG.BURST_GAP;
  const ang = Math.atan2(a.burstY - a.y, a.burstX - a.x) + (rnd()*2 - 1) * CFG.BURST_SPREAD;
  spawnBullet(a.x, a.y - 10, ang, a);
  gunshot(a.x, a.y);
}
// Add a bullet unless the live cap is reached.
// Minigun rounds pass `mini` and a faster `spd`.
function spawnBullet(x, y, ang, owner, spd, mini){
  if (bullets.length >= CFG.BULLET_MAX) return;
  const s = spd || CFG.BULLET_SPD;
  bullets.push({x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: CFG.BULLET_LIFE, owner, mini: !!mini});
}
// Damage John: one heart and a blink-invulnerable window. Zero hearts is a loss. A rider cannot be hit.
function damageJohn(){
  // BOX: cardboard stops every shot while John is boxed (and in BOX_GRACE).
  if (john.invuln > 0 || john.riding || boxed() || G.boxGrace > 0) return;
  john.hearts--;
  G.run.hearts++;
  sfx('hurt');
  john.invuln = CFG.JOHN_INVULN;
  if (john.hearts <= 0) loseRound(terminatedWhy(), john);
}
// A bullet reaching John. In the T-1000 round the player's bullets never hurt him: a disguised John is revealed
// on the spot, and a revealed John takes hits toward the win (two of them).
function johnShot(b){
  if (G.role === 't1000' && b.owner && b.owner.controlled){
    if (john.revealT > 0) john.revealHits++;
    else revealJohn();
    return;
  }
  damageJohn();
}
// Test one bullet against actors. Shoppers are knocked down (bullet stops), the T-800 absorbs, John takes a hit.
// Pistol rounds pass through the T-1000 and cops. Minigun rounds (b.mini) knock cops and shoppers without penalty,
// splash the T-1000 after MINI_HITS, and pass through John. A bullet never hits its owner.
function hitBullet(b){
  for (const a of actors){
    if (a === b.owner || dist(a.x, a.y, b.x, b.y) > CFG.BULLET_HIT_R) continue;
    if (a === t1000){
      if (G.role === 't1000'){
        if (!t1000Hittable(a)) continue;
        t1000Struck(); return true;
      }
      if (!b.mini || !t1000Hittable(a)) continue;
      a.miniHits++; a.flashT = 6;
      if (a.miniHits >= CFG.MINI_HITS){ a.miniHits = 0; splashT1000(); }
      return true;
    }
    if (a === john){ if (b.mini) continue; johnShot(b); return true; }
    if (a.kind === 'shopper' && a.down === 0){
      knockDown(a);
      if (b.mini) floatAt(a.x - 4, a.y - 30, 'KNEECAP', 'd');
      // T-1000 round: the player's bullets that drop a shopper cost points and add suspicion.
      else if (G.role === 't1000' && b.owner && b.owner.controlled){ addScore('knock', -CFG.T1000_KNOCK_PTS); addSuspicion(byRound(CFG.SUSP_KNOCK_R) * (hasThreat('SKITTISH') ? CFG.SKITTISH_MUL : 1)); }
      return true;
    }
    if (a.kind === 'cop' && b.mini && a.down === 0){ knockDown(a); floatAt(a.x - 4, a.y - 30, 'KNEECAP', 'd'); return true; }
    if (a.kind === 't800'){ a.flashT = 6; return true; }
  }
  return false;
}
// Move bullets; remove them on walls, solids, lifetime, or after a hit.
function stepBullets(){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > HUD_Y || inSolid(b.x, b.y, 0)){
      bullets.splice(i, 1); continue;
    }
    if (hitBullet(b)) bullets.splice(i, 1);
  }
}
// Count down the shotgun reload; both shells come back when it finishes.
function stepReload(a){
  if (a.shells > 0 || a.reload <= 0) return;
  a.reload--;
  if (a.reload <= 0) a.shells = shellMax();
}
// Full shotgun load: SHOT_SHELLS plus SHELLS levels.
function shellMax(){ return CFG.SHOT_SHELLS + lvl('shells') * CFG.SHELL_STEP; }
// Reload time multiplier: SPEEDLOADER per level, and FAST HANDS for the T-800 in the T-1000 round.
function reloadMul(a){
  return (1 - CFG.RELOAD_CUT * lvl('reload')) * (a.kind === 't800' && hasThreat('FAST HANDS') ? CFG.FAST_HANDS_MUL : 1);
}
// Shotgun: instant cone. Every actor inside is knocked down, the T-1000 splashes, John is spared.
// NERVOUS COPS: cops within NERVOUS_R of a T-800 blast tackle it (stun) and go down.
function fireShotgun(a, ang){
  if (a.shells <= 0) return;
  a.shells--;
  if (a.shells === 0) a.reload = Math.max(1, Math.round(CFG.SHOT_RELOAD * reloadMul(a)));
  shotFlashes.push({x: a.x, y: a.y - 10, ang, len: CFG.SHOT_RANGE, t: CFG.SHOT_FLASH});
  sfx('shotgun');
  gunshot(a.x, a.y);
  if (a.kind === 't800' && hasThreat('NERVOUS COPS')){
    for (const c of copsList){

      a.stunT = CFG.NERVOUS_TICKS;
      floatAt(a.x - 12, a.y - 34, 'TACKLED', 'b');
    }

  for (const b of actors){
    if (b === a || b === john) continue;
    if (b.kind === 'shopper' && b.down > 0) continue;
    if (b.kind === 't800') continue;
    if (!inCone(a, ang, b.x, b.y, CFG.SHOT_RANGE, CFG.SHOT_HALF)) continue;
    if (b === t1000){ if (t1000Hittable(b)) t1000Struck(); continue; }
    if ((b.kind === 'shopper' || b.kind === 'cop') && b.down === 0) civilian = true;
    knockDown(b);
  }
  // T-800 round: a blast that drops a real cop or shopper is a strike.
  if (civilian && a.controlled && G.role === 't800') civilianHit();
}
// T-800 round, NO KILLING: -T800_KILL_PEN points and one strike. Three strikes end the round.
function civilianHit(){
  addScore('kill', -CFG.T800_KILL_PEN);
  G.strikes++; G.run.strikes++;

  floaters.push({text: 'NO KILLING!', x: clamp(t800.x - 22, 2, W - 50), y: t800.y - 34, t: 60, col: 'b'});

}
// T-1000 splash. mul stretches the freeze (the M79 uses SPLASH_MUL_M79).
// T-800 round: +T800_SPLASH_PTS (plus T800_DISGUISE_PTS if disguised) and SPLASH_TIME seconds cut from the clock.
// T-1000 round: the player's splash costs one form; the last form lost is FROZEN.
function splashT1000(mul){
  const t = t1000, m = mul || 1;
  // One impact consumes at most one life; residual pellets cannot hit a reform.
  if (G.role === 't1000' && (!t1000Hittable(t) || G.forms <= 0 || G.lossWhy)) return;
  sfx('splash');
  if (G.role === 't800'){
    const pts = CFG.T800_SPLASH_PTS + (t.st === 'patrol' ? CFG.T800_DISGUISE_PTS : 0);
    addScore('splash', pts);
    floatAt(t.x - 8, t.y - 30, '+' + pts, 'd');
    G.timer = Math.max(Math.min(G.timer, 60), G.timer - CFG.SPLASH_TIME * 60);
    floatAt(t800.x - 12, t800.y - 34, '-' + CFG.SPLASH_TIME + ' SEC', 'b');
    // The goal: the third splash ends the round as a win, with a bonus plus SEC points per second left.
    G.splashes++; G.run.splashes++;
    if (G.splashes >= CFG.T800_SPLASH_GOAL && !G.winWhy && !G.lossWhy){
      const secs = Math.max(0, Math.floor(G.timer / 60));
      addScore('splash', CFG.T800_GOAL_PTS + CFG.T800_GOAL_SEC_PTS * secs);
      G.winWhy = 'HASTA LA VISTA';
    }
  }
  if (G.role === 't1000'){
    G.forms--; G.run.forms++; t.hpLeft = 0;
    G.lureT = 0; G.lureWhy = 'hit';
    G.bannerT = 0;
    G.toastTxt = G.forms > 0 ? 'HIT - ' + G.forms + (G.forms === 1 ? ' LIFE LEFT' : ' LIVES LEFT') : 'NO LIVES LEFT';
    G.toastT = CFG.TOAST_TICKS;
    floatAt(t.x - 20, t.y - 32, '-1 LIFE', 'b', 75);
    if (mallT1000Balance()){ t800.protectT = 0; t800.shotWind = 0; t800.shoveWind = 0; }
    G.suspicion = CFG.SUSP_RESET;
    // The T-800 walks back to this spot to search for the T-1000 after it re-forms.
    G.searchX = t.x; G.searchY = t.y; t.holeT = 0;
    // MIMIC: the T-800 holds off until suspicion climbs back to its engage level.
    if (lvl('mimic')) G.t800Hold = true;
    if (G.forms <= 0) loseRound(G.berserkHit ? 'BERSERK' : 'FROZEN', t1000, t800);
  }
  t.st = 'frozen'; t.freezeT = CFG.SPLASH_FREEZE * m; t.stT = t.freezeT; t.frozen = true;
  t.moving = false; t.shover = false; t.burstN = 0; t.bladeWind = 0;
  t.drops = [];
  for (let i=0;i<CFG.SPLASH_DROPS;i++){
    const ang = rnd() * Math.PI * 2, sp = rndRange(1, 2.5);
    t.drops.push({x: t.x, y: t.y - 10, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, c: ['2','1','3'][i%3], w: (i%2)+1});
  }
}
// One drop: fly and slow down for SPLASH_FLY ticks, then crawl back to the body.
function crawlDrop(d, t){
  const elapsed = t.freezeT - t.stT;
  if (elapsed < CFG.SPLASH_FLY){
    d.x += d.vx; d.y += d.vy; d.vx *= 0.85; d.vy *= 0.85;
    return;
  }
  const tx = t.x, ty = t.y - 10, dd = Math.hypot(tx - d.x, ty - d.y);
  if (dd < 0.5) return;
  const k = Math.min(0.4, dd) / dd;
  d.x += (tx - d.x) * k; d.y += (ty - d.y) * k;
}
// T-1000 splash timeline: frozen, then a 30-tick re-form shimmer, then back to PATROL (or STALK if permanent).
function stepSplash(t){
  if (t.st === 'frozen'){
    t.stT--;
    for (const d of t.drops) crawlDrop(d, t);
    if (t.stT <= 0){
      t.frozen = false; t.drops = [];
      // T-800 round: the T-1000 re-forms as a silver puddle at a random door (aiHunterT1000 slides it, then it rises).
      if (G.role === 't800'){
        const d = DOORS[rndInt(0, DOORS.length - 1)];
        t.x = d.x; t.y = d.y + 2; t.tx = t.x; t.ty = t.y;
        t.st = 'puddle'; t.stT = CFG.PUDDLE_TICKS;
      } else {
        // T-1000 round: the player's splash leaves a silver puddle that the player steers for T1K_PUDDLE_TICKS.
        t.st = 'puddle'; t.stT = CFG.T1K_PUDDLE_TICKS; t.trail = [];
      }
    }
  } else if (t.st === 'puddle' && G.role === 't1000'){
    // The player's puddle rises in a new disguise when its clock runs out.
    t.stT--;
    if (t.stT <= 0) riseT1000Player(t);
  } else if (t.st === 'reform'){
    t.stT--;
    if (t.stT <= 0){
      t.cNot = 0; t.cHid = 0; t.cOut = 0;
      if (t.perma) enterStalk(t);
      else { t.st = 'patrol'; t.burstCD = CFG.T_BURST_EVERY; }
    }
  }
}
// T-1000 round: the player's T-1000 rises from the puddle in a random disguise, never the previous one (MIMIC: shoppers only).
// HP refills, suspicion drops to 0, and the T-800 starts its T800_SEARCH guard.
function riseT1000Player(t){
  let key;
  do { key = lvl('mimic') || rnd() >= 0.5 ? rndInt(0, CFG.DISGUISE_N - 1) : 'cop'; } while (key === t.disgKey);
  t.disgKey = key;
  t.d = key === 'cop' ? curCast().t1000Def : curCast().shopper(key);
  t.st = 'reform'; t.stT = CFG.SHIMMER_TICKS; t.moving = false; t.vx = 0; t.vy = 0; t.trail = [];
  t.hpLeft = t1000HpMax(); t.holeT = 0; t.staggerT = 0;
  G.suspicion = 0; G.guardT = CFG.T800_SEARCH;
}
// Each crowd-level life takes exactly one shot, in every round.
function t1000HpMax(){ return 1; }
function t1000Struck(){
  if (G.role !== 't1000') return splashT1000();
  if (!t1000Hittable(t1000) || G.forms <= 0 || G.lossWhy) return;
  return splashT1000();
}
// Shotgun flashes count down and disappear.
function stepFlashes(){
  for (let i = shotFlashes.length - 1; i >= 0; i--){

  }
}
// Score-style floater at (x,y), kept on screen.
function floatAt(x, y, text, col, life){ floaters.push({text, x: clamp(x, 2, W - 2 - textWidth(text)), y, t: life || 40, col}); }
// ===================== HEAT =====================
// Heat: the elapsed fraction of the round clock sets a stage 0..3. Stages raise speed and fire role events.
// Elapsed fraction of the round clock (0 at start, 1 at zero).
function heatFracNow(){ return G.timerMax > 0 ? clamp(1 - G.timer / G.timerMax, 0, 1) : 0; }
// Heat stage for a fraction: one stage per HEAT_STEPS threshold reached.
function heatStageOf(frac){
  let s = 0;
  for (const t of CFG.HEAT_STEPS) if (frac >= t) s++;
  return s;
}
// Per-tick heat: sets heatFrac and the speed multiplier, fires each newly reached stage, and counts the banner down.
function stepHeat(){
  G.heatFrac = heatFracNow();
  G.speedMul = speedScale(G.round) * (1 + CFG.HEAT_SPD * G.heatFrac);
  const s = heatStageOf(G.heatFrac);
  while (G.heatStage < s){ G.heatStage++; onHeatStage(G.heatStage); }
  if (G.bannerT > 0) G.bannerT--;
}
// Stage entry: the banner, then the stage event. John and T-800: BACKUP, EVACUATE, LOCKDOWN. T-1000: ALERT, ON GUARD, LOCKDOWN.
function onHeatStage(s){
  const names = G.role === 't1000' ? ['ALERT', 'ON GUARD', 'LOCKDOWN'] : ['BACKUP', 'EVACUATE', 'LOCKDOWN'];
  G.bannerTxt = names[s - 1]; G.bannerT = CFG.HEAT_BANNER;
  sfx('alarm');
  if (G.role === 't1000') return;
  if (s === 1) spawnBackupCop();
  if (s === 2) G.evacT = CFG.EVAC_EVERY;
  if (G.role === 't800' && (s === 1 || s === 3)) spawnPickup();
}
// BACKUP: one extra cop from a random door. It ignores COPS_CAP and joins the watchers.
function spawnBackupCop(){
  const d = DOORS[rndInt(0, DOORS.length - 1)];
  const c = makeActor('cop', 'cop', curCast().watcher(copsList.length), d.x, d.y + 2, CFG.COP_SPD);
  copsList.push(c); actors.push(c);

// EVACUATE: every EVAC_EVERY ticks the shopper nearest a door starts walking out, while more than EVAC_FLOOR of the starting crowd remain.
// Walked-out shoppers are dropped from `actors` at the end of the tick.
function stepEvacuate(){
  if (G.role === 't1000' || G.heatStage < 2) return;
  G.evacT--;

    G.evacT = CFG.EVAC_EVERY;

// One evacuating shopper: walk to its door at EVAC_SPD, then it is gone.
function evacStep(a){

}
// Lunge and burst cooldown multiplier: LOCKDOWN shortens them by LOCK_CD.
function lockCdMul(){ return G.heatStage >= 3 ? CFG.LOCK_CD : 1; }
// ===================== T-800 KIT =====================
// T-800 round specials: floor pickups, the M79, the minigun, the Harley, and Kid John's COME WITH ME.
// Spawn one pickup at a random store door (at most one on the floor). Round 1's first pickup is always the M79.

function spawnPickup(){

// Round 1 drops a pickup at PICK_TICK. The T-800 takes one by walking within PICK_R of it.
function stepPickups(){

// The M79 and minigun replace the current weapon and load their ammo.
function takePickup(p){

// M79: a click lobs a grenade toward it (at most M79_RANGE px). Each round costs one ammo; empty falls back to the shotgun.
function throwGrenade(c){
  const dx = c.x - t800.x, dy = c.y - t800.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, CFG.M79_RANGE / d);
  const x1 = clamp(t800.x + dx * k, 2, W - 2), y1 = clamp(t800.y + dy * k, CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
  grenades.push({x0: t800.x, y0: t800.y, x1, y1, t: CFG.M79_TICKS});

  if (t800.ammo <= 0) t800.weapon = null;
}
// Grenades fly for M79_TICKS then blow up at the landing spot. Blast rings count down too.
function stepGrenades(){
  for (let i = blastFx.length - 1; i >= 0; i--){ blastFx[i].t--; if (blastFx[i].t <= 0) blastFx.splice(i, 1); }
  for (let i = grenades.length - 1; i >= 0; i--){
    const g = grenades[i];
    g.t--;
    if (g.t > 0) continue;
    grenades.splice(i, 1);
    blast(g.x1, g.y1);

}
// M79 blast: the T-1000 inside M79_R splashes with a doubled freeze. Shoppers and cops inside are stunned (knocked down).
// Pickups never cost a strike: the blast is a stun, not a kill.
function blast(x, y){

    if (a === john || a.kind === 't800' || a.down > 0 || dist(a.x, a.y, x, y) > CFG.M79_R) continue;

  }

// Minigun: while LMB is held (and the mouse is on the play area) it fires every MINI_EVERY ticks, spending one ammo tick each.
// Returns true while it fires (the T-800 then walks at MINI_MOVE speed).
function stepMinigun(){
  t800.firing = false;
  if (t800.miniCD > 0) t800.miniCD--;

    t800.miniCD = CFG.MINI_EVERY;

}
// T-800 movement: riding the Harley, or walking to the mouse (half speed while the minigun fires).
function stepT800Move(){
  if (bikeProp && --bikeProp.fallT <= 0) bikeProp = null;

  if (t800.stunT > 0){ t800.stunT--; t800.moving = false; t800.vx = 0; t800.vy = 0; return; }
  if (t800.bike > 0){ stepBike(); return; }
  if (t800.shoveWind > 0 || t800.shoveRecover > 0){ holdMallT800(t800); return; }
  const firing = !t800.shoveAimBlocked && stepMinigun();

  if (t800.aiming){ t800.moving = false; t800.vx = 0; t800.vy = 0; return; }

}
// HARLEY KEYS: the ride time gains BIKE_KEYS_DUR per level (the special's duration multiplier).
function bikeMul(){ return (1 + CFG.BIKE_KEYS_DUR * lvl('keys')) * CFG.NITRO_TIER_MUL[Math.min(lvl('spBike'), 3)]; }
// Harley ride: the T-800 drives at BIKE_SPD, turning toward the mouse by at most BIKE_TURN a tick. A John
// touching the bike hops on. The ride ends when BIKE_TICKS run out.
function stepBike(){

  a.firing = false;

    const want = Math.atan2(INPUT.mouse.y - a.y, INPUT.mouse.x - a.x);

  }

  a.x += a.vx; a.y += a.vy;

// Bike touches: anyone within BIKE_TOUCH is knocked down. A shopper or cop is a bowl (BOWL_PTS, no strike). The T-1000 splashes.
function bikeHits(){
  for (const b of actors){
    if (b === t800 || b === john || b.down > 0 || dist(b.x, b.y, t800.x, t800.y) > CFG.BIKE_TOUCH) continue;
    // HARLEY KEYS owned: the bike staggers the T-1000 instead of splashing it.
    if (b === t1000){ if (lvl('keys') > 0) staggerT1000(); else if (t1000Hittable(b)) splashT1000(); continue; }

}
// NITRO HARLEY tier 3 (BONK): a cop or the T-1000 within NITRO_KNOCK_R of the Harley's front is pushed NITRO_KNOCK_PX along the
// heading (the perpendicular if that is blocked) and stunned NITRO_KNOCK_STUN ticks. A shopper in reach is pushed only.
// Nothing here scores or counts as a kill, and the T-1000 knock costs nothing.
function nitroKnocks(){
  if (lvl('spBike') < 3) return;
  const fx = t800.x + Math.cos(t800.heading) * CFG.NITRO_FRONT_OFF, fy = t800.y + Math.sin(t800.heading) * CFG.NITRO_FRONT_OFF;

    if (dist(b.x, b.y, fx, fy) > CFG.NITRO_KNOCK_R) continue;
    if (b.kind === 'shopper'){ nitroPush(b, false); continue; }
    if (b.kind === 'cop'){ nitroPush(b, true); continue; }
    // The T-1000 inside BIKE_TOUCH was already splashed or staggered by bikeHits.
    if (b === t1000 && t1000Hittable(b) && dist(b.x, b.y, t800.x, t800.y) > CFG.BIKE_TOUCH) nitroPush(b, true);

// Start a BONK push on b along the Harley heading. The stun applies to cops and the T-1000 only.
function nitroPush(b, stun){
  if (stun){
    b.stunT = Math.max(b.stunT || 0, CFG.NITRO_KNOCK_STUN);
    b.moving = false; b.vx = 0; b.vy = 0;
    floatAt(b.x - 4, b.y - 30, 'BONK!', 'd');
  }
  const h = t800.heading, c = Math.cos(h), s = Math.sin(h);
  const path = nitroPath(b, c, s) || nitroPath(b, -s, c) || nitroPath(b, s, -c);
  if (!path) return;
  b.nkDX = (path.x - b.x) / CFG.NITRO_KNOCK_T; b.nkDY = (path.y - b.y) / CFG.NITRO_KNOCK_T; b.nkT = CFG.NITRO_KNOCK_T;
}
// The end point of a NITRO_KNOCK_PX push along (ux,uy), or null when any step of the push runs into a wall or a solid.
function nitroPath(b, ux, uy){
  const tx = clamp(b.x + ux * CFG.NITRO_KNOCK_PX, 8, W-8), ty = clamp(b.y + uy * CFG.NITRO_KNOCK_PX, CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
  for (let k = 1; k <= CFG.NITRO_KNOCK_T; k++){
    if (!boxFloorClear(b.x + (tx - b.x) * k / CFG.NITRO_KNOCK_T, b.y + (ty - b.y) * k / CFG.NITRO_KNOCK_T)) return null;
  }
  return {x: tx, y: ty};
}
// One tick of every BONK push: the knocked body slides its step (no AI walk while it slides past).
function stepNitroKnocks(){
  for (const b of actors){
    if (!(b.nkT > 0)) continue;
    b.x += b.nkDX; b.y += b.nkDY; b.nkT--;
  }
}
// A rider sits 6 px behind the T-800 along its heading.
function placeRider(){
  if (!john.riding) return;

  john.tx = john.x; john.ty = john.y; john.moving = false;
}
// The ride ends: the Harley falls over where it stopped and John hops off beside the T-800.
function endBike(){
  bikeProp = {x: t800.x, y: t800.y, ang: t800.heading, fallT: CFG.BIKE_FALL_TICKS};

    john.tx = john.x; john.ty = john.y;
  }

// COME WITH ME (SPACE): Kid John runs to the T-800 and stays behind it for KID_CALL_TICKS. Cooldown KID_CALL_CD.
function stepKidCall(){
  if (t800.callCD > 0) t800.callCD--;
  if (!INPUT.secondary.length || t800.callCD > 0 || john.riding) return;

// Player steering: John walks to the mouse at JOHN_SPD (no mouse = stand still).
function steerJohn(){

  else { john.tx = john.x; john.ty = john.y; }

// EXPOSED meter: fills while John is in any live cone and not hidden, drains otherwise. Full = a cop chases.
function updateExposure(){
  if (G.role !== 'john') return;
  let seen = false;
  for (const w of watchers()){
    if (coneLive(w) && inCone(w, w.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF)) seen = true;  }
  john.seen = seen;
  // BOX: a boxed John (and BOX_GRACE) never gains exposure and never starts a chase.
  const boxSafe = boxed() || G.boxGrace > 0;
  if (seen && !john.hidden && !inGrace() && !boxSafe) G.exposure = Math.min(1, G.exposure + CFG.EXPOSE_UP);
  else G.exposure = Math.max(0, G.exposure - CFG.EXPOSE_DOWN);

    const c = pickChaser();

// Add points to the total and to the round breakdown.
function addScore(kind, pts){
  G.score += pts;
  G.pts[kind] = (G.pts[kind] || 0) + pts;
}
// Quarters: touching one scores and pops a floater. The fifth one picks the exit door.
function collectQuarters(){
  // ATM HACK: loose quarters within MAGNET_R slide toward John (20 px at level 1, 32 px at level 2).
  const mg = lvl('magnet');
  if (mg > 0){
    const R = CFG.MAGNET_R[Math.min(mg, CFG.MAGNET_R.length) - 1];
    for (const c of coins){
      if (c.got) continue;
      const d = dist(john.x, john.y, c.x, c.y);
      if (d > R || d <= CFG.QUARTER_R) continue;
      const k = Math.min(CFG.MAGNET_PULL, d) / d;
      c.x += (john.x - c.x) * k; c.y += (john.y - c.y) * k;
    }
  }
  for (const c of coins){
    if (c.got || dist(john.x, john.y, c.x, c.y) > CFG.QUARTER_R) continue;
    c.got = true; G.quartersGot++; G.run.quarters++;
    onPickup('quarter', c.x, c.y);
    addScore('quarter', CFG.QUARTER_PTS);
    floaters.push({text: '+100', x: c.x - 4, y: c.y - 10, t: 40, col: 'd'});
  }
  if (G.quartersGot >= quartersNeeded() && G.exitDoor < 0) G.exitDoor = rndInt(0, DOORS.length - 1);
}
// LUCKY QUARTER: one fewer quarter per level, never below QUARTERS_MIN.

// Reaching the flashing exit door wins the round; pays the exit bonus and 5 points per second left.

  const d = DOORS[G.exitDoor];
  if (dist(john.x, john.y, d.x, d.y + 2) > CFG.EXIT_R) return;

// T-800: the Harley is already under him for BIKE_TICKS x bikeMul(). AI John hops on when within BIKE_JOHN_R.

// Distance from point (px,py) to the segment (ax,ay)-(bx,by).
function segDist(px, py, ax, ay, bx, by){
  const vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy;
  const t = L2 > 0 ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / L2)) : 0;
  return Math.hypot(ax + vx * t - px, ay + vy * t - py);
}
// T-1000: a moving Janelle disguise for LURE_TICKS. John follows its live position.
// The AI T-800 jumps straight to HUNT tier on the lure (see aiT800).
function activateLure(){

  G.suspicion = Math.max(G.suspicion, CFG.AGGRO_HUNT);
  john.lureFleeT = 0; john.lurePauseT = 0; john.lurePauseIn = rndInt(CFG.LURE_PAUSE_EVERY[0], CFG.LURE_PAUSE_EVERY[1]);
  specialBanner('MIMIC - LURE JOHN', 'lure');
}
// Lure tick: walking and mouse movement leave the disguise active.
// A lured John who reaches the T-1000 is revealed (the normal touch win then fires).
// An AI T-800 within LURE_BLOCK_R of John, and between them (projection on the John->T-1000 segment 0..LURE_BLOCK_T), breaks it too, and John flees the T-800.
function stepLure(){
  if (G.lureT <= 0) return;
  G.lureT--;
  if (G.lureT <= 0){ G.lureWhy = 'expired'; return; }
  if (john.revealT === 0 && dist(john.x, john.y, t1000.x, t1000.y) <= CFG.T1000_TOUCH_R && (!mallT1000Balance() || mallT1000Actionable())){ revealJohn(); G.lureT = 0; G.lureWhy = 'reveal'; return; }
  const jx = t1000.x - john.x, jy = t1000.y - john.y, jl2 = jx * jx + jy * jy;
  const proj = jl2 > 0 ? ((t800.x - john.x) * jx + (t800.y - john.y) * jy) / jl2 : 0;
  if (dist(t800.x, t800.y, john.x, john.y) <= CFG.LURE_BLOCK_R && proj >= 0 && proj <= CFG.LURE_BLOCK_T && segDist(t800.x, t800.y, john.x, john.y, t1000.x, t1000.y) <= CFG.LURE_LINE_R){
    G.lureT = 0; G.lureWhy = 'block'; floatAt(t1000.x - 16, t1000.y - 30, 'SPOTTED', 'b');
    john.lureFleeT = CFG.LURE_FLEE_T; john.lureFleeX = t800.x; john.lureFleeY = t800.y;
  }

// HARLEY KEYS: a bike touch knocks the T-1000 over for BIKE_STAGGER ticks (no splash), then BIKE_STAGGER_CD before the next.
function staggerT1000(){

  t1000.stunT = CFG.BIKE_STAGGER; G.bikeCD = CFG.BIKE_STAGGER_CD;
  floatAt(t1000.x - 6, t1000.y - 30, 'WHAM', 'd');
}
// BOX: is John boxed right now (JOHN round, timer running)?
function boxed(){ return G.role === 'john' && G.boxT > 0; }
// BOX timer: counts down, and the timer's end gives a '!' floater and a BOX_GRACE window where cones cannot catch him.
function stepBox(){
  if (G.boxGrace > 0) G.boxGrace--;
  if (G.boxT <= 0) return;
  G.boxT--;
  if (G.boxT === 0){ G.boxGrace = CFG.BOX_GRACE; floatAt(john.x - 4, john.y - 30, '!', 'd'); }
}
// BOX flip: a T-1000 touching the box flips it open, '!' and John is exposed, so a cop chases at once.
function boxTouch(){
  if (!boxed() || !t1000 || dist(john.x, john.y, t1000.x, t1000.y) > CFG.BOX_BUMP_R) return;
  G.boxT = 0; G.boxGrace = 0;
  floatAt(john.x - 4, john.y - 30, '!', 'b');
  const c = pickChaser();
  if (c) startChase(c);
}
// Can John's box stand on (x,y)? Inside the walls and the feet band, and clear of the solids.
function boxFloorClear(x, y){
  return x >= 8 && x <= W-8 && y >= CFG.FEET_MIN_Y && y <= CFG.FEET_MAX_Y && !inSolid(x, y, 2);
}
// BIGGER BOX tier 3 (SHUFFLE): the first cone or cop sight that touches the boxed John slides the box BOX_SHUFFLE_PX directly
// away from the light, over BOX_SHUFFLE_T ticks. The slide is clamped to the floor and skipped when a bench or planter blocks it.
// Each shuffle starts BOX_SHUFFLE_CD, is capped at BOX_SHUFFLE_MAX per box and adds BOX_SHUFFLE_BONUS ticks to the timer.
function stepBoxShuffle(){
  if (G.boxShuffleCD > 0) G.boxShuffleCD--;
  if (G.boxSlide) stepBoxSlide();
  if (!boxed() || lvl('spBox') < 3){ G.boxTouchOn = false; return; }
  let lit = null;
  for (const w of watchers()){
    if (coneLive(w) && inCone(w, w.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF)){ lit = w; break; }
  }
  const first = lit !== null && !G.boxTouchOn;
  G.boxTouchOn = lit !== null;
  if (!first || G.boxSlide || G.boxShuffleCD > 0 || G.boxShuffles >= CFG.BOX_SHUFFLE_MAX) return;
  const ax = john.x - lit.x, ay = john.y - lit.y, d = Math.hypot(ax, ay);
  if (d < 1) return;
  const tx = clamp(john.x + ax / d * CFG.BOX_SHUFFLE_PX, 8, W-8), ty = clamp(john.y + ay / d * CFG.BOX_SHUFFLE_PX, CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
  const sx = john.x, sy = john.y;
  for (let k = 1; k <= CFG.BOX_SHUFFLE_T; k++){
    if (!boxFloorClear(sx + (tx - sx) * k / CFG.BOX_SHUFFLE_T, sy + (ty - sy) * k / CFG.BOX_SHUFFLE_T)) return;
  }
  G.boxSlide = {dx: (tx - sx) / CFG.BOX_SHUFFLE_T, dy: (ty - sy) / CFG.BOX_SHUFFLE_T, t: CFG.BOX_SHUFFLE_T};
  G.boxShuffles++; G.boxShuffleCD = CFG.BOX_SHUFFLE_CD; G.boxT += CFG.BOX_SHUFFLE_BONUS;
  floatAt(john.x - 14, john.y - 30, 'SHUFFLE', 'd');
  sfx('box');
}
// One tick of the box slide: John (the box) moves a step of the path; the path was checked when the slide started.
function stepBoxSlide(){
  const s = G.boxSlide;
  john.x += s.dx; john.y += s.dy; s.t--;
  if (s.t <= 0) G.boxSlide = null;
}

// 12A: the standing decoy keeps the shopper's own head and trousers and wears Sarah's olive jacket over the shirt and sleeves.
// The jacket keys match the flying jacket's colours ('6' olive, '7' shade). Cached per shopper def.
const DECOY_JACKET = {T:'6', t:'7', A:'6', a:'7'};
const DECOY_LOOKS = new Map();
function decoyLook(d){
  let v = DECOY_LOOKS.get(d);
  if (!v){ v = Object.assign({}, d, {map: Object.assign({}, d.map, DECOY_JACKET)}); DECOY_LOOKS.set(d, v); }

}
// The jacket, 8x6, two tumble frames in flight (0 sleeves out, 1 folded). Cells are palette keys, '.' is clear.
const JACKET_FRAMES = [
  ['66.77.66', '66677666', '66607666', '66607666', '66677666', '77777777'],
  ['..6666..', '.666666.', '66677666', '66677666', '77777777', '........'],
];
function drawJacket(x, y, frame){
  const rows = JACKET_FRAMES[frame];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 8; c++){

// SARAH DECOYS: right-click drops a jacket on the nearest standing shopper to the cursor. The cursor must be within
// SARAH_DECOY_R of Sarah and at least SARAH_DECOY_MIN from the T-1000, and so must the shopper.
function placeDecoy(){
  const m = INPUT.mouse;
  if (!m || G.sarahDecoys <= 0) return;
  if (dist(m.x, m.y, john.x, john.y) > CFG.SARAH_DECOY_R){ floatAt(john.x - 12, john.y - 30, 'TOO FAR', 'b'); return; }
  if (dist(m.x, m.y, t1000.x, t1000.y) < CFG.SARAH_DECOY_MIN){ floatAt(john.x - 12, john.y - 30, 'TOO CLOSE', 'b'); return; }
  let target = null, bd = Infinity;
  for (const s of actors){
    if (s.kind !== 'shopper' || s.down > 0 || s.decoyT > 0) continue;
    const d = dist(s.x, s.y, m.x, m.y);
    if (d < bd){ bd = d; target = s; }
  }
  if (!target || bd > CFG.SARAH_DECOY_TAG_R){ floatAt(john.x - 12, john.y - 30, 'NO ONE HERE', 'b'); return; }
  if (dist(target.x, target.y, t1000.x, t1000.y) < CFG.SARAH_DECOY_MIN){ floatAt(john.x - 12, john.y - 30, 'TOO CLOSE', 'b'); return; }
  G.sarahDecoys--; G.specialFlashT = CFG.SPECIAL_FLASH;
  // The jacket flies from Sarah to the cursor in a 14-tick arc; the decoy stands once the jacket lands.
  target.jacketFly = {x0: john.x, y0: john.y - CFG.DECOY_Y, x1: m.x, y1: m.y, t: 0};
  target.decoyMax = decoyTicks(); target.decoyT = target.decoyMax; target.jacketDown = 0;
  floatAt(target.x + CFG.DECOY_FLOAT_DX, target.y - CFG.DECOY_FLOAT_DY, 'DECOY', 'd', CFG.DECOY_FLOAT_TICKS);

// Decoy timers: when the ticks run out the decoy collapses into a jacket on the floor for DECOY_COLLAPSE_TICKS, then the shopper is free.
function stepDecoys(){
  for (const a of actors){
    if (a.jacketFly){
      a.jacketFly.t++;
      if (a.jacketFly.t >= CFG.DECOY_THROW_TICKS){ a.jacketFly = null; a.puffT = CFG.DECOY_PUFF_TICKS; }
    }
    if (a.puffT > 0) a.puffT--;
    if (a.decoyT > 0){
      a.decoyT--;
      if (a.decoyT === 0) a.jacketDown = CFG.DECOY_COLLAPSE_TICKS;
    }
    if (a.jacketDown > 0) a.jacketDown--;

// The flying jacket's position at its tick: a straight line from Sarah to the cursor with a parabolic lift.
function decoyFlyPos(f){
  const k = f.t / CFG.DECOY_THROW_TICKS;
  return {x: f.x0 + (f.x1 - f.x0) * k, y: f.y0 + (f.y1 - f.y0) * k - Math.sin(Math.PI * k) * CFG.DECOY_ARC_H};
}
// SARAH DECOYS, cop side: a patrolling cop that reaches a standing decoy says '?', the jacket drops and the decoy ends.
function decoyFrozen(a){ return a.decoyT > 0 || a.jacketDown > 0; }
function decoyReach(a){
  if (!G.sarah || G.role !== 'john') return false;
  for (const s of actors){
    if (s.kind !== 'shopper' || !(s.decoyT > 0) || s.jacketFly || s.down > 0) continue;
    if (dist(s.x, s.y, a.x, a.y) > CFG.STAB_R) continue;
    // 12A cop-proof window: a young decoy only makes the cop show '?' (throttled per cop), and it stands.
    if (decoyAge(s) < CFG.DECOY_MIN_TICKS){
      if (a.qDecoyAt === undefined || G.tick - a.qDecoyAt >= CFG.DECOY_QUESTION_TICKS){ a.qDecoyAt = G.tick; floatAt(a.x - 4, a.y - 30, '?', 'd'); }
      return true;
    }
    s.decoyT = 0; s.jacketDown = CFG.DECOY_COLLAPSE_TICKS;
    floatAt(s.x - 4, s.y - 30, '?', 'd');
    return true;
  }
  return false;
}
// Ticks a decoy has stood so far.
function decoyAge(s){ return (s.decoyMax || decoyTicks()) - s.decoyT; }
// SARAH DECOYS, cop side: a patrolling cop whose cone (CONE_R, CONE_HALF) covers a standing decoy walks to it.
function decoyPull(a){
  if (!G.sarah || G.role !== 'john') return false;
  for (const s of actors){
    if (s.kind !== 'shopper' || !(s.decoyT > 0) || s.jacketFly || s.down > 0) continue;
    if (!inCone(a, a.coneAng, s.x, s.y - 6, coneR(), CFG.CONE_HALF)) continue;
    a.tx = s.x; a.ty = s.y;
    return true;
  }
  return false;
}
// SARAH DECOYS, lure: the nearest tagged shopper within SARAH_DECOY_LURE_R, when it is nearer to this AI than John
// by SARAH_DECOY_MUL. Null otherwise. Used by the cops, the AI T-800 and the T-1000 (Sarah's rounds only).
function decoyLureTarget(a){
  if (!G.sarah || G.role !== 'john') return null;
  let best = null, bd = Infinity;
  for (const s of actors){
    if (s.kind !== 'shopper' || !(s.decoyT > 0) || s.down > 0) continue;
    const d = dist(s.x, s.y, a.x, a.y);
    if (d < bd){ bd = d; best = s; }
  }
  if (!best || bd > CFG.SARAH_DECOY_LURE_R) return null;
  if (bd * CFG.SARAH_DECOY_MUL >= dist(a.x, a.y, john.x, john.y)) return null;
  return {s: best, d: bd};
}
// Sets the lured target on a cop or the AI T-800. The caller walks, so its own speed applies. True when a decoy lured it.
function decoyLure(a){
  const t = decoyLureTarget(a);
  if (!t) return false;
  a.tx = t.s.x; a.ty = t.s.y;
  return true;
}
// SARAH DECOYS, T-1000 side: on patrol the T-1000 goes for the lured shopper and stabs it on contact
// (an innocent kill, +DECOY points for Sarah). True when it acted.
function decoyStab(a){
  const t = decoyLureTarget(a);
  if (!t) return false;
  const best = t.s, bd = t.d;
  if (bd <= CFG.STAB_R){
    knockDown(best, true);
    best.decoyT = 0; best.jacketFly = null; best.jacketDown = 0;
    killPanic(best.x, best.y);
    addScore('decoy', CFG.SARAH_DECOY_PTS);
    sfx('blade');
    floatAt(best.x, best.y - 30, 'DECOY +150', 'd');
    return true;
  }
  a.tx = best.x; a.ty = best.y;
  walkTo(a, CFG.COP_SPD * copMul());
  return true;
}

// SLOT BOX (11A): every HUD item slot is one SLOT_W x SLOT_H box. The key chip sits across the top, and the icon and count sit below it.

// The 8 px key chip at the top of a slot box, 2 px in from its corner. Returns the chip width.

// SPECIAL SLOT: above the floor, right of John's item slot. RMB chip on top, the icon and charges below. Greyed when spent.

// BOXED JOHN: the box sprite at his feet, eyes in the hand hole while he moves, and the timer bar over it (blinks in the last BOX_BLINK ticks).
function drawBoxed(a){
  const bx = Math.round(a.x) - 8, by = Math.round(a.y) - 14;
  bctx.drawImage(ICON('box'), bx, by);
  if (a.moving){ fillBox(bx + 7, by + 6, 1, 1, '1'); fillBox(bx + 9, by + 6, 1, 1, '1'); }
  const blink = G.boxT <= CFG.BOX_BLINK && Math.floor(G.tick / 8) % 2 === 1;
  if (blink) return;
  const frac = clamp(G.boxT / boxTicks(), 0, 1);
  fillBox(bx, by - 4, 16, 3, '0');
  fillBox(bx + 1, by - 3, 14, 1, '4');
  fillBox(bx + 1, by - 3, Math.round(14 * frac), 1, 'd');
}
// Special flash: the player's actor goes white for SPECIAL_FLASH ticks after a special starts.
// 12A: only the sprite's own pixels turn white. The white silhouette is baked once per source canvas (sprites are cached, so the key is stable).
const FLASH_CACHE = new Map();
function flashSilhouette(src, key){
  key = key || '1';
  let byKey = FLASH_CACHE.get(src);
  if (!byKey){ byKey = {}; FLASH_CACHE.set(src, byKey); }
  if (!byKey[key]){
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = PAL[key]; g.fillRect(0, 0, c.width, c.height);
    byKey[key] = c;
  }
  return byKey[key];
}
// dx, dy: where src is drawn. No src (nothing drawn for this pose) means no flash.
function playerActor(){ return G.role === 'john' ? john : G.role === 't800' ? t800 : t1000; }
function flashPlayer(a, dx, dy, src){
  if (a !== playerActor() || !src) return;
  const age = G.tick - pickFx.flashT;
  if (age >= 0 && age < CFG.PICK_FLASH_TICKS){
    if (age < CFG.PICK_FLASH_WHITE) bctx.drawImage(flashSilhouette(src, '1'), dx, dy);
    else if (age < CFG.PICK_FLASH_YELLOW) bctx.drawImage(flashSilhouette(src, 'd'), dx, dy);
    return;
  }
  // Big tier: white, yellow, then normal, FLASH_BIG_HALF ticks each (6 ticks in all); the hold-up pose takes over after.
  if (bigFlashOn()){
    const ph = (G.tick - pickFx.bigT) / CFG.FLASH_BIG_HALF | 0;
    if (ph < 2) bctx.drawImage(flashSilhouette(src, ph === 0 ? '1' : 'd'), dx, dy);
    return;
  }
  if (holdUpOn()) return;
  if (G.specialFlashT <= 0) return;
  bctx.drawImage(flashSilhouette(src), dx, dy);
}
