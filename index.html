// Track source lifetimes explicitly: sustained voices never accumulate across loops.
function scoreOutput(bus,t,dur,vol,attack,release,pan,room){
  const ctx=AUDIO.ctx,g=ctx.createGain(),p=ctx.createStereoPanner(),send=ctx.createGain();
  const end=t+dur+release;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(attack,dur*0.4));
  g.gain.setValueAtTime(vol,t+dur);g.gain.exponentialRampToValueAtTime(0.0001,end);
  p.pan.value=pan;send.gain.value=room;
  g.connect(p);p.connect(bus.input);p.connect(send);send.connect(bus.send);
  const v={sources:[],nodes:[g,p,send],input:g,end};bus.voices.add(v);
  v.start=()=>{
    let left=v.sources.length;
    for(const source of v.sources){
      source.onended=()=>{if(--left===0){for(const n of v.nodes)n.disconnect();bus.voices.delete(v);}};
      source.start(t);source.stop(end+0.02);
    }

function scoreOsc(v,type,freq,t,detune=0){

const SCORE_VOICES={

  strings:{vol:0.085,attack:0.38,release:0.65,cut:1500,room:0.8},
  bass:{vol:0.29,attack:0.015,release:0.15,cut:360,room:0.035},
  pulse:{vol:0.13,attack:0.008,release:0.11,cut:650,room:0.16},
  glass:{vol:0.09,attack:0.015,release:0.7,cut:2400,room:0.7},
  threat:{vol:0.075,attack:0.5,release:0.9,cut:680,room:0.85}

function scoreNote(bus,e,t,beat){

  const p=base && e.tight?{...base,release:base.release*(e.voice==='strings'?0.85:0.55),room:base.room*(e.voice==='strings'?0.85:0.55)}:base;
  if(!p || !m)return;
  const ctx=AUDIO.ctx,freq=noteFreq(m[1],+m[2]),dur=e.dur*beat;
  const v=scoreOutput(bus,t,dur,p.vol*e.vel,p.attack,p.release,e.pan,p.room);
  const f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=e.voice==='brass'?0.8:0.4;

  else if(e.voice==='threat')partials=[['sawtooth',1,-17,0.34],['sawtooth',1.059,11,0.26],['triangle',1.498,-9,0.4]];

    for(const [hz,level,decay] of [[185,0.4,0.6],[421,0.22,0.46],[713,0.16,0.32],[1093,0.1,0.23],[1681,0.06,0.15]]){

  }else{
    const o=scoreOsc(v,'sine',snare?170:92,t);o.frequency.exponentialRampToValueAtTime(snare?95:43,t+0.15);o.connect(v.input);

// Events use beat position, note length, velocity and optional minimum heat.
function scoreEvent(at,voice,note,dur=1,vel=1,pan=0,heat=0){return {at,voice,note,dur,vel,pan,heat};}
function scorePhrase(beats,events){return {beats,events:events.sort((a,b)=>a.at-b.at)};}

// Five strokes with an accented last blow. The 13-step variant adds the original

  for(let base=0;base<beats;base+=cycle)positions.forEach((p,i)=>{

  [[0,'G4',1.5],[1.5,'F4',1.5],[3,'E4',2.7]],
  [[0,'D4',3],[3,'A3',2.7]],
  [[0,'D4',1],[1,'E4',0.5],[1.5,'F4',4.2]],
  [[0,'F4',1.5],[1.5,'G4',1.5],[3,'A4',2.7]],

const SCORE_CHORDS=[['D2','D3','A3'],['D2','F3','A3'],['C2','E3','G3'],['D2','D3','A3'],['A#1','D3','F3'],['F2','F3','A3'],['C2','E3','G3'],['D2','D3','A3']];
function themePhrase(i,{soft=false,heat=false,drums=true}={}){

  ev.push(...scoreLine(soft?'glass':'brass',THEME_LINES[i],soft?0.9:0.88,0,heat?1:0));
  if(drums){ev.push(...machinePulse(6,soft?0.3:0.65));ev.push(scoreEvent(0,'metal',null,1,soft?0.25:0.65,-0.18,heat?2:0));}

function suspensePhrase(i,kind){

  else ev.push(scoreEvent(0,'drum',null,1,0.55));
  ev.push(...scoreLine('brass',THEME_LINES[i],0.62,0.08,ward?2:1));
  ev.push(scoreEvent(1.5,'threat',root,3.8,ward?0.8:0.65,0.35,ward?0:2));
  ev.push(scoreEvent(0,'metal',null,1,kind==='molten'?0.85:0.45,-0.25,ward?2:1));
  for(const at of [0,1.5,3,4.5])ev.push(scoreEvent(at,'pulse',root,0.42,0.7,0,ward?1:2));
  for(const at of [2.5,5.5])ev.push(scoreEvent(at,'snare',null,1,0.6,0.25,3));

function actionPhrase(i,mill=false){

  ev.push(scoreEvent(0,'bass',root,5.8,0.7),scoreEvent(0,'strings',i%4===2?'F3':'A3',5.8,0.8,-0.4));
  ev.push(...scoreLine('brass',THEME_LINES[i],0.8,0));
  for(let at=0;at<6;at+=0.5)ev.push(scoreEvent(at,'pulse',root,0.22,0.62,at%1?-0.2:0.2,mill?0:1));
  for(const at of [0,3])ev.push(scoreEvent(at,'metal',null,1,0.7,at?0.3:-0.3));
  for(const at of [2,5,5.5])ev.push(scoreEvent(at,'snare',null,1,0.65,0.1,mill?0:2));

// Active-play arrangements are separate from the cinematic phrase builders above.
// Introductions keep their original tracks; only state === 'play' uses these cues.
function pursuitPhrase(i,kind){
  const ward=kind==='ward',chase=kind==='chase',mill=kind==='meltdown';
  const industrial=kind==='molten'||mill,odd=kind==='after',beats=odd?6.5:6;
  const notes=[['D2','A2','D3'],['D2','A2','D3'],['A#1','F2','A#2'],['C2','G2','C3']][i%4];
  const [root,fifth,octave]=notes,ev=machinePulse(beats,ward?0.32:industrial?0.68:0.56,odd);

  // answers give it shape without restoring the old nonstop high arpeggios.
  const pattern=[root,root,fifth,root,octave,root];

    ev.push(scoreEvent(at,'pulse',pattern[step%6],ward?0.17:0.22,(accent?0.8:0.55)*(ward?0.8:1),step%2?0.12:-0.12));

    if(at+0.25<beats && step%3!==0)ev.push(scoreEvent(at+0.25,'pulse',step%2?fifth:root,0.10,0.29,step%2?-0.28:0.28,3));

  // a recognizable longer answer, rather than sustaining the whole title theme.

    [[0,'A4',0.55],[0.75,'G4',0.30],[1.5,'F4',0.60]],
    [[0,'F4',0.45],[0.75,'D4',0.30],[1.5,'F4',0.60]],
    [[0,'E4',0.55],[0.75,'F4',0.30],[1.5,'E4',0.45]]

  for(const at of [2.5,5.5])ev.push(scoreEvent(at,'snare',null,1,0.49,-0.16,1));
  if(i%2)for(const at of [5,5.25,5.75])ev.push(scoreEvent(at,'snare',null,1,0.34,at===5.25?-0.3:0.3,3));
  ev.push(scoreEvent(1.5,'threat',root,ward?2.4:1.5,ward?0.7:0.45,0.4,ward?0:2));
  if(ward && i%2)ev.push(scoreEvent(4.5,'glass','E5',0.25,0.40,0.4));
  if(chase || mill)ev.push(scoreEvent(2.25,'metal',null,1,0.42,-0.35,1));

AUDIO.songId=null;
function startPattern(cur){
  const tr=cur.track;
  if(cur.bi>=tr.phrases.length){if(!tr.loop)return false;cur.bi=tr.loopFrom||0;}
  cur.pat=tr.phrases[cur.bi++];cur.ei=0;cur.lay=tr.gate?tr.gate(G.heatStage||0):3;
  return true;
}
function scheduleScoreEvent(cur,e,t){
  if(e.heat>cur.lay)return;
  const event={...e,vel:e.vel*(cur.track.gain||1),tight:cur.track.gameplay===true};
  if(SCORE_VOICES[e.voice])scoreNote(cur.bus,event,t,60/cur.track.bpm);
  else scoreHit(cur.bus,event,t);

function audioTick(){
  if(!AUDIO.ok || !AUDIO.cur)return;
  const ctx=AUDIO.ctx,cur=AUDIO.cur,beat=60/cur.track.bpm,horizon=ctx.currentTime+CFG.SCHED_AHEAD;
  // A throttled/background tab resumes one phrase, never a burst of overdue notes.
  const due=cur.pat?cur.next+(cur.ei<cur.pat.events.length?cur.pat.events[cur.ei].at:cur.pat.beats)*beat:cur.next;
  if(due<ctx.currentTime-0.25){cur.next=ctx.currentTime+0.025;cur.ei=0;}
  while(cur.next<horizon){
    if(!cur.pat && !startPattern(cur)){AUDIO.cur=null;return;}
    const ev=cur.pat.events;
    while(cur.ei<ev.length){
      const e=ev[cur.ei],time=cur.next+e.at*beat;
      if(time>=horizon)return;
      if(time>=ctx.currentTime-0.02)scheduleScoreEvent(cur,e,Math.max(time,ctx.currentTime));
      cur.ei++;
    }
    const end=cur.next+cur.pat.beats*beat;
    if(end>=horizon)return;
    cur.next=end;cur.pat=null;
  }

function audioSync(){
  const s=G.state;
  const name=(s==='title'||s==='select'||s==='loopsel')?'title':(s==='intro'||s==='play')?'play':s==='shop'?'shop'
    :s==='map'?'map':s==='ending'?'ending':s==='cutscene'?CUT_SCENES[G.cut.scene].track
    :(s==='result'&&G.outcome&&G.outcome.win)?'win':s==='death'?'death':null;
  AUDIO.songId=name==='play'?SONG_FOR_THEME[stageTheme()]:null;
  const baseKey=name==='play'?(BS.on?(s==='intro'?'boss_sting':BS.kind==='drain'?'chase':'meltdown'):AUDIO.songId):name;
  const key=s==='play' && baseKey?'play_'+baseKey:baseKey;
  if(!AUDIO.ok||key===AUDIO.trackName)return;
  const t=AUDIO.ctx.currentTime;
  retireScoreBus(AUDIO.scoreBus,t);AUDIO.trackName=key;
  AUDIO.scoreBus=key?newScoreBus(t):null;
  AUDIO.cur=key?{track:TRACKS[key],bi:0,ei:0,pat:null,lay:3,next:t+0.05,bus:AUDIO.scoreBus}:null;

// Music ducks to DUCK_GAIN (-6 dB) for DUCK_S seconds under a gunshot.
function duck(){
  const t = AUDIO.ctx.currentTime, g = AUDIO.music.gain;

// A pulse or triangle tone sweeping f0 to f1 (f1 0 means flat). vib adds a 7 Hz wobble.
function tone(kind, f0, f1, t, dur, duty, vol, vib){
  const ctx = AUDIO.ctx, osc = ctx.createOscillator(), g = ctx.createGain();
  if (kind === 'tri') osc.type = 'triangle'; else osc.setPeriodicWave(AUDIO.wave[duty || 0.25]);
  osc.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);

    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 7; lg.gain.value = 3; lfo.connect(lg); lg.connect(osc.frequency);
    lfo.start(t); lfo.stop(t + dur + 0.01);
  }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003);
  g.gain.linearRampToValueAtTime(0, t + dur);

// A short noise burst through a filter (lowpass, highpass or bandpass at freq).

}

// Rebake the molten pit: bands from the rim down, with lumps drifting on a hash clock. The bridge columns stay clear.
function millBakeLava(){
  const x = BS.lavaCtx, w = BS.lava.width, h = BS.lava.height, step = Math.floor(G.tick / CFG.MILL_LAVA_TICKS);
  x.clearRect(0, 0, w, h);
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
    const gx = px + CFG.MILL_PIT_X0;
    if (gx >= CFG.MILL_BRIDGE_X0 && gx < CFG.MILL_BRIDGE_X1) continue;
    const hs = millHash(px >> 2, py >> 2, step);
    let col = py < 8 ? 'a' : py < 24 ? 'b' : 'c';
    if (hs % 9 === 0) col = 'd'; else if (hs % 7 === 0) col = 'c';
    x.fillStyle = PAL[col]; x.fillRect(px, py, 1, 1);
  }
  const onBridge = px => px + CFG.MILL_PIT_X0 >= CFG.MILL_BRIDGE_X0 && px + CFG.MILL_PIT_X0 < CFG.MILL_BRIDGE_X1;
  // Bright yellow cracks: a 14 px slanted line in about one 24 px cell in three. They are fixed, so they read as cracks in the crust.
  x.fillStyle = PAL.d;
  for (let cy = 0; cy < h; cy += 24) for (let cx = 0; cx < w; cx += 24){
    if (millHash(cx, cy, 91) % 3 !== 0) continue;
    const sx = cx + millHash(cx, cy, 93) % 10, sy = cy + millHash(cx, cy, 95) % 10, s = millHash(cx, cy, 97) % 2 ? 1 : -1;
    for (let t = 0; t < 14; t++){
      const px = sx + t, py = sy + Math.round(s * t * 0.5);
      if (px < 0 || py < 0 || px >= w || py >= h || onBridge(px)) continue;
      x.fillRect(px, py, 1, 1);
    }
  }
  // Rising bubbles: one 2 px bead per 12 px column. Its height climbs with the bake step, so the beads rise and pop.
  for (let cx = 0; cx < w; cx += 12){
    const bx = cx + millHash(cx, 3, 101) % 8;
    if (onBridge(bx) || onBridge(bx + 1)) continue;
    const by = h - 1 - ((millHash(cx, 7, 99) % h + step * 3) % h);
    x.fillStyle = PAL.d; x.fillRect(bx, by, 2, 1);
    x.fillStyle = PAL.c; x.fillRect(bx, by + 1, 2, 1);
  }
}

// The T-800's shotgun: three pellets from the T-800 toward (tx, ty), each stopped by the first body within SLUG_W.

function millSlug(tx, ty, src){

// Shove body a away from (fx, fy) at speed px per tick into its extVel. mode 'pit' aims at the pit centre instead; 'pitbias' blends toward it.

  b.inFire = millFireAt(b.x, b.y);
  if (G.state !== 'play' || BS.sinkT >= 0) return;
  const mul = G.speedMul * (BS.p2 ? CFG.MB_P2_SPD : 1) * (BS.frz1 > 0 ? CFG.FROZEN_SLOW : 1);
  const cx = a.x, cy = a.y - 10, bx = b.x, by = b.y - 10;
  const dx = cx - bx, dy = cy - by, d = Math.hypot(dx, dy) || 1;
  switch (BS.ai){
    case 'stumble': millStumble(); break;
    case 'teeter': BS.aiT--; if (BS.aiT <= 0) millTeeterEnd(); break;
    case 'idle': break;
    case 'lunge_tele': BS.aiT--; if (BS.aiT <= 0){ BS.ai = 'lunge'; BS.aiT = CFG.MB_LUNGE_TICKS; BS.lungeHit = false; } break;
    case 'lunge': {
      const hit = millMove(b, BS.lx * CFG.MB_LUNGE_SPD, BS.ly * CFG.MB_LUNGE_SPD, 4, false);
      b.moving = true;
      if (!BS.lungeHit && dist(bx, by, cx, cy) <= CFG.MB_LUNGE_R + 2){ BS.lungeHit = true; millHurt(); }
      BS.aiT--;
      if (hit || BS.aiT <= 0){ BS.ai = 'recover'; BS.aiT = CFG.MB_LUNGE_REC; }
      break;
    }
    case 'spread_tele': BS.aiT--; if (BS.aiT <= 0){ millSpread(); BS.ai = 'recover'; BS.aiT = CFG.MB_SPREAD_REC; } break;
    case 'ceil_tele': BS.aiT--; if (BS.aiT <= 0){ millCeilDrop(); BS.ai = 'recover'; BS.aiT = CFG.MB_CEIL_REC; } break;
    case 'floor_tele': BS.aiT--; if (BS.aiT <= 0){ millFloorStart(); BS.ai = 'recover'; BS.aiT = CFG.MB_FLOOR_REC; } break;
    case 'recover': BS.aiT--; if (BS.aiT <= 0) millNextStalk(); break;
    default: millStalk(mul, dx, dy, d);
  }
  b.facing = dy < 0 ? 'up' : 'down';
}
// The blades fly straight and hit the T-800 for one heart each (a dash passes through them).
function millStepBlades(){
  const tg = millTarget(), cx = tg.x, cy = tg.y - 10;
  for (const bl of BS.blades){
    bl.x += bl.vx; bl.y += bl.vy; bl.t--;
    if (bl.t > 0 && dist(bl.x, bl.y, cx, cy) <= CFG.MB_BLADE_R + 2 && millHurt()) bl.t = 0;
    if (G.state !== 'play') return;
  }
  BS.blades = BS.blades.filter(bl => bl.t > 0 && bl.x > -4 && bl.x < W + 4 && bl.y > -4 && bl.y < H + 4);
}
// M79 rounds fly for M79_TICKS and blow up at their landing spot.
function millStepNades(){
  for (const n of BS.nades){
    n.t--;
    if (n.t <= 0){
      n.done = true;
      // The finisher's M79 is the sink that ends John's round.
      if (n.finish){ millSinkStart(false); return; }
      millBlast(n.x1, n.y1); if (G.state !== 'play') return;
    }
  }
  BS.nades = BS.nades.filter(n => !n.done);
}
// John hides: he walks to the far side of the crate farthest from the T-1000 and stays there. The T-1000 never targets him.
function millStepJohn(){
  const b = t1000;
  if (!BS.cover || G.tick % 120 === 0 || dist(john.x, john.y, b.x, b.y) < CFG.MILL_JOHN_FLEE){
    let best = CFG.MILL_SOLIDS[1], bd = -1;
    for (const c of CFG.MILL_SOLIDS.slice(1)){
      const d = dist(c[0] + 8, c[1] + 8, b.x, b.y);
      if (d > bd){ bd = d; best = c; }
    }
    const cx = best[0] + 8, sgn = b.x < cx ? 1 : -1;
    BS.cover = {x: clamp(cx + sgn * 12, CFG.MILL_WALL_L + 6, CFG.MILL_WALL_R - 6), y: best[1] + 10};
  }
  const dx = BS.cover.x - john.x, dy = BS.cover.y - john.y, d = Math.hypot(dx, dy);
  john.moving = d > 1;
  if (d > 1){
    const s = Math.min(d, 0.7);
    millMove(john, dx / d * s, dy / d * s, 4, false);
    john.facing = dy < 0 ? 'up' : 'down';
    john.t++;
  }
}
// Start the sink: the T-1000 goes under from the feet up, the score and the sound.
function millSinkStart(lose){
  if (BS.sinkT >= 0) return;
  BS.sinkT = 0; BS.sinkX = t1000.x; BS.sinkY = t1000.y;
  t1000.evx = 0; t1000.evy = 0; t1000.lockT = 0; BS.ai = 'sink'; BS.lose = !!lose;
  BS.loseTitle = lose ? 'INTO THE STEEL' : 'MELTED';
  sfx('scream'); sfx('hiss');
  if (lose) return;
  addScore('kill', CFG.MILL_KILL_PTS);
  millBanner('MOLTEN STEEL', CFG.MILL_BANNER_TICKS);
}
// The win: the time and heart points, the stage done, and the RESULT screen. The title says how it was won.
function millWin(title){
  const secs = Math.floor(G.roundT / 60);
  addScore('time', Math.max(0, CFG.MILL_PAR_SECS - secs) * CFG.MILL_TIME_PTS);
  addScore('heart', CFG.MILL_HEART_PTS * BS.hp);
  G.winWhy = title || 'TERMINATED';
  G.done[G.stage] = true;
  enterResult({win: true, title: G.winWhy});
}
// A lost round from the sink: the T-1000 player melted into the steel.
function millLose(title){
  loseRound(title, t1000, t800);
  enterResult({win: false, title});
}
// SINK: the sink animation runs SINK_TICKS, then the card holds SINK_END ticks before the win (or the loss).
function stepMillSink(){
  if (BS.sinkT < CFG.MILL_SINK_TICKS){
    BS.sinkT++;
    if (BS.sinkT === CFG.MILL_SINK_BUBBLE) sfx('bubble');
    if (BS.sinkT === CFG.MILL_SINK_TICKS && !BS.lose) millBanner('HASTA LA VISTA, BABY', CFG.MILL_BANNER_TICKS);
    return;
  }
  BS.endT++;
  if (BS.endT >= CFG.MILL_SINK_END){ if (BS.lose) millLose(BS.loseTitle); else millWin(); }
}
// Tick helpers: the timers that run on their own, and the short-lived effects (skids, sparks, splashes, slow).
function millTimers(){
  if (G.bannerT > 0) G.bannerT--;
  if (BS.hurtT > 0) BS.hurtT--;
  if (BS.dashCD > 0) BS.dashCD--;
  if (BS.shakeT > 0) BS.shakeT--;
  if (BS.slowT > 0) BS.slowT--;
  BS.trail = BS.trail.filter(p => --p.t > 0);
  BS.skid = BS.skid.filter(p => --p.t > 0);
  BS.sparks = BS.sparks.filter(p => --p.t > 0);
  BS.splashes = BS.splashes.filter(p => --p.t > 0);
  tickFloaters();
  for (const tr of BS.tracers) tr.t--;
  BS.tracers = BS.tracers.filter(tr => tr.t > 0);
  for (const bl of BS.blasts) bl.t--;
  BS.blasts = BS.blasts.filter(bl => bl.t > 0);
}
// BOSS STEP: one tick of the fight. stepPlay hands the tick here instead of the round's mode update.
function stepMill(){
  if (BS.sinkT >= 0){ stepMillSink(); return; }
  millTimers();
  if (G.role === 'john') stepMillRoleJohn();
  else if (G.role === 't1000') stepMillRoleT1000();
  else stepMillRoleT800();
}
// The T-800 round's tick: the T-800 player, the T-1000's attacks, the hazards and the LN2 clock.
function stepMillRoleT800(){
  stepReload(t800);
  millApplyExt(t800);
  millHarleyInput();
  // A stunned T-800 (hook, ram) cannot move, shoot or throw until the stun runs out.
  if (t800.stunT > 0) t800.stunT--;
  else { millPlayerMove(); if (INPUT.keys.includes('e')) millThrow(); t800Fire(); }
  millStepRide();
  if (G.state !== 'play') return;
  millStepNades();
  if (G.state !== 'play') return;
  millStepBody();
  if (G.state !== 'play') return;
  millStepBlades();
  if (G.state !== 'play') return;
  millStepJohn();
  millStepHazards();
  if (G.state !== 'play') return;
  millStepMimic();
  if (G.tick % CFG.MILL_LAVA_TICKS === 0) millBakeLava();
  t800.d = BS.hp <= 2 ? ENDO : CAST.t800;
  t1000.d = BS.unstable && ((G.tick / CFG.MB_FLIP_TICKS) | 0) % 2 ? MOLTEN : BS.frz1 > 0 ? FROZEN_SPR : CAST.chrome;
}
// BOSS RENDER: the arena, the bodies, telegraphs, shots and the banner. The HUD is drawn by drawHud. Never mutates state.
function drawMillWorld(){
  const shaking = BS.shakeT > 0 || (BS.sinkT >= 0 && BS.sinkT < CFG.MILL_SINK_SHAKE_TICKS);
  const ox = shaking ? (G.tick & 1 ? CFG.MILL_SINK_SHAKE : -CFG.MILL_SINK_SHAKE) : 0;
  bctx.save();
  bctx.translate(ox, 0);
  bctx.drawImage(BS.arena, 0, 0);
  bctx.drawImage(BS.lava, CFG.MILL_PIT_X0, CFG.MILL_PIT_Y0);
  fillBox(CFG.MILL_PIT_X0, CFG.MILL_PIT_Y0 - 2, CFG.MILL_PIT_X1 - CFG.MILL_PIT_X0, 1, ((G.tick >> 2) & 1) ? 'a' : 'b');
  drawMillFloor();
  drawMillRoleFloor();
  drawMillMachineLights();
  drawMillShimmer();
  // Dash afterimages.
  bctx.globalAlpha = 0.35;
  for (const p of BS.trail) bctx.drawImage(sprite(CAST.t800, 'down', 0, false), Math.round(p.x) - 8, Math.round(p.y) - 23);
  bctx.globalAlpha = 1;
  for (const a of actors.slice().sort((p, q) => p.y - q.y)){
    if (a === t1000 && BS.sinkT >= 0){ drawMillSink(); continue; }
    if (a.lockT > 0){
      // A knocked body staggers: it sways a pixel each way and shows '!!' over its head.
      bctx.save(); bctx.translate(((G.tick >> 1) & 1) ? 1 : -1, 0); drawActor(a); bctx.restore();
      text(bctx, '!!', Math.round(a.x) - 3, Math.round(a.y) - 36, '2');
    } else drawActor(a);
    if (a === t1000 && BS.ai === 'teeter'){ drawMillArms(a); drawMillArrow(a); }
  }
  drawMillTelegraphs();
  drawMillOver();
  drawMillRoleOver();
  drawMillAir();
  for (const bl of BS.blades){
    fillBox(Math.round(bl.x) - 1, Math.round(bl.y) - 1, 3, 3, '2');
    fillBox(Math.round(bl.x), Math.round(bl.y), 1, 1, '1');
  }
  for (const tr of BS.tracers) millDotLine(tr.x0, tr.y0, tr.x1, tr.y1, tr.t > 3 ? 'c' : 'd');
  for (const n of BS.nades){
    const f = 1 - n.t / CFG.M79_TICKS;
    const px = n.x0 + (n.x1 - n.x0) * f, py = n.y0 + (n.y1 - n.y0) * f - 30 * Math.sin(Math.PI * f);
    fillBox(Math.round(px) - 1, Math.round(py) - 1, 2, 2, 'd');
  }
  for (const bl of BS.blasts){
    const r = (1 - bl.t / CFG.BLAST_TICKS) * CFG.M79_R;
    for (let i = 0; i < 12; i++){
      const ang = i / 12 * Math.PI * 2;
      fillBox(Math.round(bl.x + Math.cos(ang) * r), Math.round(bl.y + Math.sin(ang) * r), 2, 2, (i & 1) ? 'c' : 'd');
    }
  }
  // The T-800's aim and the cursor reticle.
  if (G.state === 'play' && BS.sinkT < 0 && INPUT.mouse){
    const mx = Math.round(INPUT.mouse.x), my = Math.round(INPUT.mouse.y);
    if (t800.aiming && t800.aimX !== undefined) millDotLine(t800.x, t800.y - 10, t800.aimX, t800.aimY, 'd');
    fillBox(mx - 3, my, 7, 1, '1'); fillBox(mx, my - 3, 1, 7, '1');
  }
  bctx.restore();
  if (G.state === 'play') drawBanner();
  drawHud();
}
// Dotted line from (x0, y0) to (x1, y1) in colour col, up to the SLUG_RANGE.
function millDotLine(x0, y0, x1, y1, col){
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.floor(d / 2));
  for (let i = 0; i <= n; i++){
    const f = i / n;
    fillBox(Math.round(x0 + (x1 - x0) * f), Math.round(y0 + (y1 - y0) * f), 1, 1, col);
  }
}
// Telegraphs: the lunge's dotted red line, and the blade spread's three faint lines.
function drawMillTelegraphs(){
  const cx = t1000.x, cy = t1000.y - 10;
  if (BS.ai === 'lunge_tele'){
    for (let i = 6; i <= 72; i += 3) fillBox(Math.round(cx + BS.lx * i), Math.round(cy + BS.ly * i), 1, 1, 'b');
  } else if (BS.ai === 'spread_tele'){
    for (const off of [-1, 0, 1]){
      const ang = Math.atan2(BS.sy, BS.sx) + off * CFG.MB_SPREAD_DEG * Math.PI / 180;
      for (let i = 6; i <= 40; i += 4) fillBox(Math.round(cx + Math.cos(ang) * i), Math.round(cy + Math.sin(ang) * i), 1, 1, 'd');
    }
  } else if (BS.ai === 'ceil_tele' || BS.ai === 'floor_tele'){
    if ((G.tick >> 2) & 1) textOutlined(bctx, '!', Math.round(cx) - 1, Math.round(t1000.y) - 34, 'b');
  }
}
// Flailing arms for the T-1000 teetering on the rim: two alternating blocks, one on each side.
function drawMillArms(b){
  const fx = Math.round(b.x), fy = Math.round(b.y), f = (G.tick >> 2) & 1;
  fillBox(fx - 11, fy - 14 + f * 2, 4, 3, '3');
  fillBox(fx + 8, fy - 14 + (1 - f) * 2, 4, 3, '3');
}
// SINK render: the T-1000's top rows only, cut off at a lava line that rises from the feet. Its face cycles.
function drawMillSink(){
  const face = SINK_FACES[Math.floor(BS.sinkT / CFG.MILL_SINK_FACE_TICKS) % SINK_FACES.length];
  const fx = Math.round(BS.sinkX) - 8, fy = Math.round(BS.sinkY) - 23;
  const h = Math.max(0, Math.round(24 * (1 - BS.sinkT / CFG.MILL_SINK_TICKS)));
  if (h > 0) bctx.drawImage(sprite(face, 'down', 0, false), 0, 0, 16, h, fx, fy, 16, h);
  fillBox(fx - 1, fy + h, 18, 1, 'd');
  for (let i = 0; i < 3; i++){
    const bx = fx + 1 + (millHash(BS.sinkT >> 3, i, 7) % 13);
    fillBox(bx, fy + h - 1 - (millHash(BS.sinkT >> 3, i, 9) % 2), 2, 2, 'd');
  }

function millDisc(cx, cy, r, col){

// The body that takes the T-800's and the T-1000's hits: John in his round, the T-800 otherwise.
function millTarget(){ return G.role === 'john' ? john : t800; }

function millHookAuto(){ return G.role === 'john' ? Infinity : CFG.HOOK_AUTO; }
// Start positions and state for John's round and the T-1000's round (the T-800 round is set up by millSetup alone).
function millRoleSetup(){

    for (const h of BS.hooks) h.auto = Infinity;

      rollT: 0, rollDx: 0, rollDy: 0, rollCD: 0, kneelT: 0});

      regroupT: 0, grace1: 0, t1kT: CFG.MILL_T1K_TIME * 60, shards: [], wp: 0, pushT: 0, pushWind: 0, pushRim: false,
      pushed: false, lurePt: null});

// Walk a body toward (x, y) at spd px per tick. The arena stops it like everything else.
function millWalkTo(a, x, y, spd){
  const dx = x - a.x, dy = y - a.y, d = Math.hypot(dx, dy);
  a.moving = d > 2;
  if (d <= 2) return;
  const s = Math.min(d, spd * (a === millPlayer() ? millWalkMul(a, dx) : 1));
  a.facing = dy < 0 ? 'up' : 'down';
  millMove(a, dx / d * s, dy / d * s, 4, false);
}
// Who a shotgun blast from src can hit this round: the T-1000 (unless hidden or sliding), John, the fake John, or the Sarahs.
function millSlugCands(a){
  const list = [];
  if (t1000.st !== 'puddle' && !(G.role === 't1000' && BS.slide > 0)) list.push(t1000);
  if (G.role === 'john'){
    if (a === john){ for (const s of BS.sarahs){ if (!s.gone) list.push(s); } }
    else list.push(john);
  } else if (G.role !== 't1000'){
    list.push(john);
    if (BS.mimic) list.push(BS.mimic);
  }
  return list;
}
// A slug on the T-1000: the T-1000 player is hit or shattered, the T-1000 in the other rounds is pushed.
function millSlugT1000(ox, oy, a){
  if (G.role === 't1000'){ const s = millPitSource(); millPlayerHit(s.x, s.y); return; }
  millPush(1, ox, oy, a === john ? CFG.MILL_JOHN_KB : CFG.MB_KB_SLUG);

// The T-1000 knock's source: the far side of the T-1000 from the pit, so a slug always pushes it toward the pit (the pusher walks, so its real spot can be anywhere).
function millPitSource(){

}

function millPlayerHit(fx, fy){

// SHATTER: a frozen T-1000 breaks into shards, loses a form and hides until it re-forms. No forms left ends the round.
function millShatter(){
  BS.forms--; BS.stuck = false; BS.wig = 0; t1000.evx = 0; t1000.evy = 0; t1000.lockT = 0;
  sfx('shatter');

// Re-form the T-1000 at the floor point farthest from the T-800 that is clear of the pit and the solids.
function millReform(){
  let best = null, bd = -1;
  for (const p of CFG.MILL_REFORM_PTS){
    if (millBlocked(p[0], p[1], 4, false)) continue;
    const d = dist(p[0], p[1], t800.x, t800.y);
    if (d > bd){ bd = d; best = p; }
  }
  if (best){ t1000.x = best[0]; t1000.y = best[1]; }
  t1000.st = 'boss'; BS.grace1 = CFG.MILL_LN2_FREE; BS.ln2Free = CFG.MILL_LN2_FREE;
}

}

// The T-1000 player's input: the timer, the slide, the walk, the stab, the lure, the LN2 wiggle, and the touch that wins.
function millT1kInput(){

  BS.t1kT--;
  if (BS.t1kT <= 0){ loseRound('HE GOT AWAY', b, t800); enterResult({win: false, title: 'HE GOT AWAY'}); return; }

    BS.lastM = {x: INPUT.mouse.x, y: INPUT.mouse.y};

// The T-800 pusher (T-1000 round): it stands on the far side of the T-1000 from the pit and fires knockback slugs at it.
// A lured pusher walks to the lure instead, and busts it once it is in LURE_SPOT_R after the first LURE_BUST_GRACE ticks.
function millStepPusher(){
  const a = t800, b = t1000;
  if (a.stunT > 0){ a.stunT--; a.moving = false; return; }
  if (G.lureT > 0 && BS.lurePt){
    const age = CFG.LURE_TICKS - G.lureT;
    if (age >= CFG.LURE_BUST_GRACE && dist(a.x, a.y, BS.lurePt.x, BS.lurePt.y) <= CFG.LURE_SPOT_R){ G.lureT = 0; floatAt(a.x - 12, a.y - 34, 'SPOTTED', 'b'); }

  }

  millWalkTo(a, ix, iy, CFG.MILL_PUSH_SPD * G.speedMul);
  const rim = b.y >= CFG.MILL_PIT_Y0 - 16 && b.x > CFG.MILL_PIT_X0 - 20 && b.x < CFG.MILL_PIT_X1 + 20;

  if (BS.pushT >= CFG.MILL_PUSH_CYCLE * (rim ? CFG.MILL_PUSH_RIM_MUL : 1)){ BS.pushT = 0; BS.pushWind = CFG.MILL_PUSH_WIND; BS.pushRim = rim; }
}
// The pusher's shot lands: the first time it fires from the rim it says so, then it fires a knockback slug at the T-1000.
function millPusherFire(){
  if (BS.pushRim && !BS.pushed){ BS.pushed = true; millBanner("IT'S PUSHING YOU IN", CFG.MILL_BANNER_TICKS); }
  millSlug(t1000.x, t1000.y - 10, t800);

// Distance from point (px, py) to the segment (ax, ay) to (bx, by).
function millSegDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}
// John's catwalk loop (T-1000 round): he walks the loop and takes the waypoint farthest from the T-1000 when it comes close.
function millStepJohnLoop(){
  const wp = CFG.MILL_JOHN_LOOP;
  const curD = dist(john.x, john.y, t1000.x, t1000.y);
  if (curD < CFG.MILL_JOHN_AVOID){
    // The farthest waypoint whose straight walk keeps clear of the T-1000; the farthest overall when none is clear.
    const need = Math.min(CFG.MILL_JOHN_AVOID, curD);
    let bd = -1, bc = -1, clear = -1;
    for (let i = 0; i < wp.length; i++){
      const d = dist(wp[i][0], wp[i][1], t1000.x, t1000.y);
      if (d > bd){ bd = d; BS.wp = i; }
      if (millSegDist(t1000.x, t1000.y, john.x, john.y, wp[i][0], wp[i][1]) >= need && d > bc){ bc = d; clear = i; }
    }
    if (clear >= 0) BS.wp = clear;
  }
  const w = wp[BS.wp], dx = w[0] - john.x, dy = w[1] - john.y, d = Math.hypot(dx, dy);
  if (d < 3){ BS.wp = (BS.wp + 1) % wp.length; return; }
  const s = Math.min(d, CFG.MILL_JOHN_LOOP_SPD * G.speedMul);
  john.moving = true; john.facing = dy < 0 ? 'up' : 'down';
  millMove(john, dx / d * s, dy / d * s, 4, false);
}
// The T-1000 in John's round is boxed: it walks to the nearest Sarah spot and waits there.
function millLostWalk(){
  let best = CFG.MILL_SARAH_SPOTS[0], bd = Infinity;
  for (const p of CFG.MILL_SARAH_SPOTS){ const d = dist(p[0], p[1], t1000.x, t1000.y); if (d < bd){ bd = d; best = p; } }
  millWalkTo(t1000, best[0], best[1], CFG.MB_SPD * G.speedMul);
}
// The John round's input: the walk, the roll and the box, the shotgun pick-up and shots, the levers and the LN2 valve.
function millJohnInput(){
  const j = john;
  if (BS.jinv > 0) BS.jinv--;
  if (BS.kneelT > 0) BS.kneelT--;
  if (BS.fireCD > 0) BS.fireCD--;
  if (BS.valveCD > 0) BS.valveCD--;
  if (BS.rollCD > 0) BS.rollCD--;
  if (BS.lostT > 0) BS.lostT--;
  if (BS.spray){ BS.spray.t--; if (BS.spray.t <= 0) BS.spray = null; }
  // Shells come back one at a time while any are missing.
  if (BS.shells < johnShells()){
    if (BS.reloadT <= 0) BS.reloadT = CFG.MILL_JOHN_RELOAD;
    BS.reloadT--;
    if (BS.reloadT <= 0){ BS.shells++; BS.reloadT = 0; }
  } else BS.reloadT = 0;
  // RMB boxes John for MILL_BOX_TICKS and costs a special. It uses the same box as the other rounds.
  if (INPUT.special.length && BS.lostT <= 0){
    if (G.special > 0){ G.special--; BS.lostT = CFG.MILL_BOX_TICKS; specialBanner('CARDBOARD BOX', 'box'); }
    else sfx('buzzer');
  }
  G.boxT = BS.lostT;
  if (BS.rollT > 0){
    BS.rollT--;
    const k = CFG.MILL_ROLL_DIST / CFG.MILL_ROLL_TICKS;
    millMove(j, BS.rollDx * k, BS.rollDy * k, 4, false);
    j.moving = true;
  } else if (INPUT.secondary.length && BS.rollCD <= 0 && INPUT.mouse && BS.kneelT <= 0){
    const dx = INPUT.mouse.x - j.x, dy = INPUT.mouse.y - j.y, d = Math.hypot(dx, dy) || 1;
    BS.rollDx = dx / d; BS.rollDy = dy / d; BS.rollT = CFG.MILL_ROLL_TICKS; BS.rollCD = CFG.MILL_ROLL_CD;
  } else if (INPUT.mouse && BS.kneelT <= 0 && j.lockT <= 0){
    millWalkTo(j, INPUT.mouse.x, INPUT.mouse.y, CFG.JOHN_SPD * G.speedMul * (1 + CFG.SNEAKER_STEP * lvl('sneakers')) * (boxed() ? CFG.BOX_SPD : 1));
  }
  if (!BS.hasGun && dist(j.x, j.y, CFG.MILL_GUN[0], CFG.MILL_GUN[1]) <= CFG.MILL_GUN_R){
    BS.hasGun = true; sfx('ring'); floatAt(j.x - 12, j.y - 34, 'GOT IT', 'd');
  }
  const c = INPUT.clicks.length ? INPUT.clicks[INPUT.clicks.length - 1] : null;
  if (!c || BS.kneelT > 0) return;
  const li = CFG.MILL_LEVERS.findIndex(l => dist(c.x, c.y, l[0], l[1]) <= CFG.MILL_LEVER_R && dist(j.x, j.y, l[0], l[1]) <= CFG.MILL_LEVER_R);
  if (li >= 0){ millPullLever(li); return; }
  const v = CFG.MILL_VALVE;
  if (dist(c.x, c.y, v[0], v[1]) <= CFG.MILL_VALVE_R && dist(j.x, j.y, v[0], v[1]) <= CFG.MILL_VALVE_R){ millOpenValve(c); return; }
  millJohnShot(c);
}
// A lever drops its hook onto the T-1000's spot: the hook swings to the T-1000 and the drop telegraphs. No drop while it cools down.
function millPullLever(li){
  const h = BS.hooks[li];
  if (!h || h.st !== 'swing' || h.cd > 0){ sfx('buzzer'); return; }
  h.x = clamp(t1000.x, h.rx0, h.rx1); h.st = 'tele'; h.t = 0; sfx('lever');
}
// The LN2 valve sprays a puddle toward the cursor, clamped to MILL_VALVE_REACH from John and to the floor.
function millOpenValve(c){
  if (BS.valveCD > 0){ sfx('buzzer'); return; }
  const dx = c.x - john.x, dy = c.y - john.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, CFG.MILL_VALVE_REACH / d);
  const tx = john.x + dx * k, ty = john.y + dy * k;
  BS.spray = {x0: CFG.MILL_VALVE[0], y0: CFG.MILL_VALVE[1], x1: tx, y1: ty, t: CFG.MILL_SPRAY_TICKS};
  millSpawnPuddle(tx, ty);
  BS.valveCD = CFG.MILL_VALVE_CD;
  sfx('hiss');
}
// The shotgun: one shell, a slug from John, and a recoil step back.
function millJohnShot(c){
  if (!BS.hasGun){ sfx('buzzer'); return; }
  if (BS.shells <= 0){ sfx('buzzer'); return; }
  if (BS.fireCD > 0) return;
  BS.shells--; BS.fireCD = CFG.MILL_JOHN_CD;
  millSlug(c.x, c.y, john);
  const dx = john.x - c.x, dy = john.y - c.y, d = Math.hypot(dx, dy) || 1;
  millMove(john, dx / d * CFG.MILL_JOHN_RECOIL, dy / d * CFG.MILL_JOHN_RECOIL, 4, false);

// The reboot clock: the T-800 lies KO and the bar climbs. At 100% it stands and the finisher starts.
function millStepReboot(){
  if (BS.fin){ millStepFinisher(); return; }
  BS.reboot = Math.min(CFG.MILL_REBOOT, BS.reboot + 1);
  t800.down = 1; t800.d = ENDO;
  if (BS.reboot < CFG.MILL_REBOOT) return;
  BS.fin = {ph: 'walk', t: 0, shots: 0};

// The finisher: the T-800 walks to the T-1000, fires knockback slugs toward the pit, then an M79 that sinks it.
function millStepFinisher(){
  const f = BS.fin, a = t800, b = t1000;
  f.t++;
  if (f.ph === 'walk'){
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    if (d <= CFG.MILL_FIN_RANGE || f.t > CFG.MILL_FIN_WAIT){ f.ph = 'aim'; f.t = 0; return; }
    millWalkTo(a, b.x, b.y, CFG.MILL_FIN_WALK * G.speedMul);
  } else if (f.ph === 'aim'){
    if (f.t >= CFG.MILL_FIN_AIM){ f.shots++; millSlug(b.x, b.y - 10, a); f.t = 0; f.ph = f.shots >= CFG.MILL_FIN_SHOTS ? 'm79' : 'gap'; }
  } else if (f.ph === 'gap'){
    if (f.t >= CFG.MILL_FIN_GAP){ f.ph = 'aim'; f.t = 0; }
  } else if (f.ph === 'm79'){
    BS.nades.push({x0: a.x, y0: a.y - 10, x1: clamp(b.x, 2, W - 2), y1: clamp(b.y - 10, CFG.MILL_FEET_MIN, CFG.MILL_FEET_MAX), t: CFG.M79_TICKS, finish: true});

// THE SHELL GAME (John's round): two Sarahs appear at two of three spots, one fake (JOHN HELP ME) and one real (JOHN GET DOWN).
// The T-1000 melts out of sight for the event. Touching the fake costs a heart. Timing out with the fake still standing
// sends the T-1000 at John.
function millStepSarahs(){
  for (const s of BS.sarahs){ if (s.limp){ s.x -= CFG.MILL_SARAH_LIMP; if (s.x < -12) s.gone = true; } }
  BS.sarahs = BS.sarahs.filter(s => !s.gone);
  if (BS.fin) return;
  if (!BS.ev){ BS.evNext--; if (BS.evNext <= 0) millEventStart(); return; }
  const ev = BS.ev;
  ev.t++; ev.left--;
  if (ev.ph === 'melt' && ev.t >= CFG.MILL_MELT_TICKS) ev.ph = 'hidden';
  const fake = BS.sarahs.find(s => s.fake && !s.gone);
  if (fake && dist(john.x, john.y, fake.x, fake.y) <= CFG.MILL_FAKE_R){
    if (johnHurt('GOTCHA') && G.state === 'play') millEventEnd(false);
    return;
  }
  if (ev.left <= 0) millEventEnd(!!fake);
}
// Start an event: the T-1000 melts where it stands and two of the three Sarah spots are taken, one fake and one real.
function millEventStart(){
  const spots = CFG.MILL_SARAH_SPOTS.slice();
  const a = spots.splice(Math.floor(rnd() * spots.length), 1)[0];
  const b = spots[Math.floor(rnd() * spots.length)];
  const fakeAt = rnd() < 0.5 ? a : b, realAt = fakeAt === a ? b : a;
  BS.sarahs = [
    {x: fakeAt[0], y: fakeAt[1], fake: true, real: false, limp: false, gone: false},
    {x: realAt[0], y: realAt[1], fake: false, real: true, limp: false, gone: false},
  ];
  BS.ev = {ph: 'melt', t: 0, left: CFG.MILL_EV_TICKS};
  BS.melt = {x: t1000.x, y: t1000.y};
  BS.meltCv = millPuddleCanvas();
  t1000.st = 'puddle'; BS.ai = 'recover'; BS.aiT = CFG.MB_HIT_REC; t1000.evx = 0; t1000.evy = 0; t1000.lockT = 0;
  sfx('hiss');
}
// End an event: the fake goes, the real Sarah limps off, and the T-1000 comes back at its melt point (a lunge at John if the fake still stood).
function millEventEnd(lunge){
  if (!BS.ev || !BS.melt) return;
  BS.ev = null;
  for (const s of BS.sarahs){ if (s.fake) s.gone = true; else s.limp = true; }
  const p = millFloorPoint(BS.melt.x, BS.melt.y) || {x: BS.melt.x, y: BS.melt.y};
  BS.melt = null; BS.meltCv = null;
  t1000.x = p.x; t1000.y = p.y; t1000.st = 'boss';
  BS.evNext = CFG.MILL_EV_GAP;
  if (lunge){
    const dx = john.x - t1000.x, dy = (john.y - 10) - (t1000.y - 10), d = Math.hypot(dx, dy) || 1;
    BS.lx = dx / d; BS.ly = dy / d; BS.sx = BS.lx; BS.sy = BS.ly;
    BS.ai = 'lunge_tele'; BS.aiT = CFG.MB_TELE_LUNGE;
  } else { BS.ai = 'recover'; BS.aiT = CFG.MB_HIT_REC; }
}
// The John round's tick: John's input, the reboot or the finisher, the shell game, the T-1000's attacks, then the hazards.
function stepMillRoleJohn(){
  // The T-1000's extVel is applied in millStepBody (the AI tick), so only John's is applied here.
  millApplyExt(john);

  if (G.state !== 'play') return;
  millStepSarahs();

  if (!BS.ev){

// The T-1000 round's tick: the player, the pusher, the catwalk loop, then the belts and LN2.

const DR = {};

// Is this round the Storm Drain chase?
function drainActive(){ return !!STAGES[G.stage] && STAGES[G.stage].id === 'drain'; }
// True while the chase itself runs (BS.on is shared with the Steel Mill; BS.kind tells them apart).
function drainOn(){ return BS.on && BS.kind === 'drain'; }
// Progress along the canal, 0 to 1.
function drainFrac(){ return clamp(DR.wpx / (CFG.DRAIN_LEN * CFG.DRAIN_SCROLL), 0, 1); }
// Whole-number random in [a, b].
function drainInt(a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
// Do two boxes overlap? Each is given by its centre, width and height.
function drainBoxHit(ax, ay, aw, ah, bx, by, bw, bh){ return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2; }
// Ring radius now: it shrinks from R0 to R1 over RING_T ticks, then starts again.
function drainRingR(){
  const k = (DR.ringT % CFG.DRAIN_RING_T) / CFG.DRAIN_RING_T;
  return CFG.DRAIN_RING_R0 + (CFG.DRAIN_RING_R1 - CFG.DRAIN_RING_R0) * k;
}

// Count down the timers that run every tick: stuns, slows, i-frames, cooldowns, the shake and the flash.
function drainTimers(){
  for (const k of ['jStun', 'jSlow', 'hStun', 'hSlow', 'wheelieT', 'wheelieCD', 'rampCD', 'slideCD', 'sideCD', 'sideFx',
    'iJ', 'iH', 'shake', 'surgeBlock', 'truckStall', 'truckSlow', 'truckHurt', 'flash', 'grace', 'sparkT', 'clankT',
    'rampTag', 'leanCD', 'jSkid', 'hSkid', 'gStall', 'm79CD', 'crackT', 'tellLock', 'guardHitT']){
    if (DR[k] > 0) DR[k]--;
  }
  // The popped-tyre spark trail: a spark every few ticks while the truck is listing (see drainTruckFx).
  if (DR.pops > 0 && G.tick % 3 === 0){
    const pi = DR.tyreHP[0] <= 0 ? 0 : 1; // the first popped tyre trails sparks
    drainFx('spark', t1000.x + (pi ? CFG.DRAIN_TYRE_X : -CFG.DRAIN_TYRE_X), t1000.y + CFG.DRAIN_TYRE_Y + CFG.DRAIN_TYRE_H);
  }
  // Airborne count: when a ramp landing ends the jump, the landing burst starts (John role; see drainJohnRole).
  if (DR.air > 0 && --DR.air === 0 && G.role === 'john') DR.burstT = CFG.DRAIN_LAND_BURST_T;
  if (G.bannerT > 0) G.bannerT--; // the drain banner counts down too (it used to stick)
  DR.shots = DR.shots.filter(s => --s.t > 0);
  DR.fx = DR.fx.filter(f => --f.t > 0);
  if (DR.pelletFx && --DR.pelletFx.t <= 0) DR.pelletFx = null;
}

// DRAIN STEP: one tick of the chase. The cutscene plays alone; otherwise timers, scroll, the role's player, the truck and the AI, then the collisions and the end checks.
function stepDrain(){
  if (DR.cutT >= 0){ stepDrainCut(); return; }
  if (DR.ended) return;
  drainTimers();
  drainScroll();
  if (G.role === 'john') drainJohnRole();
  else if (G.role === 't800') drainT800Role();
  else drainT1000Role();
  if (DR.ended) return;
  drainTruckStep();
  drainJohnAI();
  drainHarleyStep();
  if (DR.ended) return;
  drainHits();
  if (!DR.ended) drainRoleChecks();
  drainHoldLane();
}
// The truck's pass knocks John (drainHits) after the Harley step, so the Harley re-holds his lane here, at the end of the tick.
function drainHoldLane(){
  if (!DR.ended && G.role === 'john' && DR.pull && !DR.enter && DR.harleyIn) t800.y = john.y;
}

// The canal scrolls: progress is the scrolled distance (the AI wheelie adds to it). It stops at 100 percent.
function drainScroll(){
  if (DR.stop) return;
  let sp = CFG.DRAIN_SCROLL;
  if (G.role === 'john' && DR.wheelieT > 0) sp += CFG.DRAIN_WHEELIE_SPD;
  const maxW = CFG.DRAIN_LEN * CFG.DRAIN_SCROLL;
  DR.wpx += sp;
  if (DR.wpx >= maxW){ DR.wpx = maxW; DR.stop = true; }
  if (G.tick % CFG.DRAIN_DIST_EVERY === 0) addScore('dist', 1);
  for (const o of DR.obst){
    o.y += sp;
    // Carts and barrels roll diagonally across the lanes; a falling debris shadow counts down until it lands.
    if (o.vx) o.x += o.vx;
    if (o.fall > 0){ o.fall--; if (o.fall === 0) drainDebrisLand(o); }
  }
  for (const b of DR.bands) b.y += sp;
  for (const g of DR.graf) g.y += sp;
  for (const c of DR.crates) if (c.fall <= 0) c.y += sp; // a landed crate rolls with the canal
  DR.obst = DR.obst.filter(o => !o.gone && o.y < CFG.HUD_Y && o.x > -CFG.DRAIN_BARREL_W && o.x < W);
  DR.bands = DR.bands.filter(b => b.y < CFG.HUD_Y);
  DR.graf = DR.graf.filter(g => g.y < CFG.HUD_Y + 8);
  while (DR.wpx >= DR.nextBand){
    DR.bands.push({y: -CFG.DRAIN_BAND_H, pillars: CFG.DRAIN_PILLAR_X.map(x => ({x, y0: 8, seen: {}}))});
    DR.nextBand += CFG.DRAIN_OVERPASS;
    drainSpawnDebris(); // every overpass drops debris
  }
  if (++DR.spawnT >= drainObstEvery()){ DR.spawnT = 0; drainWave(); }
  if (--DR.rampSpawnT <= 0){ DR.rampSpawnT = drainInt(CFG.DRAIN_RAMP_EVERY_MIN, CFG.DRAIN_RAMP_EVERY_MAX); drainSpawnRamp(); }
  if (++DR.debrisT >= 200){ DR.debrisT = 0; drainSpawnDebris(); } // and a debris drop every 200 ticks on its own
  if (DR.wpx >= DR.nextGraf){
    DR.nextGraf += CFG.DRAIN_GRAF_EVERY;
    // Only tags that fit inside a 24 px bank (4 px a letter, so 4n-1 px ink): alternate banks, 2 px margin from the screen edge.
    const tags = ['JC 95', 'BACK', 'RUN'];
    const i = drainInt(0, tags.length - 1), right = i % 2 === 1;
    const tw = tags[i].length * 4 - 1;
    DR.graf.push({y: -8, t: tags[i], x: right ? W - 2 - tw : 2, col: right ? 'f' : 'b'});
  }
}

// Ticks between obstacle waves: OBST_EVERY at the start, lerping to OBST_EVERY_END at the far end.
function drainObstEvery(){
  return Math.round(CFG.OBST_EVERY + (CFG.OBST_EVERY_END - CFG.OBST_EVERY) * drainFrac());
}
// One wave: one obstacle, or two from DRAIN_WAVE2_AT on. The second one is spawned far enough from the first to leave a gap.
function drainWave(){
  const first = drainSpawn(null);
  if (drainFrac() >= CFG.DRAIN_WAVE2_AT) drainSpawn(first);
}
// Spawn one obstacle of a weighted kind in a lane: never three in a row in the same lane, and clear of the partner lane.
function drainSpawn(partner){
  const n = CFG.DRAIN_LANES.length;
  let li = -1;
  for (let tries = 0; tries < 12 && li < 0; tries++){
    const c = drainInt(0, n - 1);
    if (c === DR.lastLane && DR.laneRun >= 2) continue;
    if (partner && Math.abs(CFG.DRAIN_LANES[c] - partner.cx) < CFG.DRAIN_WAVE_GAP) continue;
    li = c;
  }
  if (li < 0) return null;
  DR.laneRun = li === DR.lastLane ? DR.laneRun + 1 : 1;
  DR.lastLane = li;
  const cx = CFG.DRAIN_LANES[li];
  const kind = drainPickKind();
  const o = drainMake(kind, cx, -CFG.DRAIN_BLOCK_H);
  DR.obst.push(o);
  return o;
}
// The weighted kind for a spawn. Wrecked cars only appear past WRECK_AT, and the rest of their weight is shared out.
function drainPickKind(){
  const P = CFG.DRAIN_SPAWN_P, late = drainFrac() >= CFG.DRAIN_WRECK_AT;
  const keys = Object.keys(P).filter(k => k !== 'wreck' || late);
  const total = keys.reduce((a, k) => a + P[k], 0);
  let r = rnd() * total;
  for (const k of keys){ r -= P[k]; if (r < 0) return k; }
  return keys[0];
}
// Build one obstacle record. Carts and barrels roll sideways (vx); debris starts as a shadow (fall ticks) and is not solid until it lands.
function drainMake(k, cx, y){
  if (k === 'cart') return {k, x: cx - CFG.DRAIN_CART_W / 2, y, w: CFG.DRAIN_CART_W, h: CFG.DRAIN_CART_H, vx: (rnd() < 0.5 ? -1 : 1) * CFG.DRAIN_CART_VX, cx, seen: {}};
  if (k === 'block') return {k, x: cx - CFG.DRAIN_BLOCK_W / 2, y, w: CFG.DRAIN_BLOCK_W, h: CFG.DRAIN_BLOCK_H, cx, seen: {}};
  if (k === 'barrel'){
    const left = cx < 128, bx = left ? 26 : 230;
    return {k, x: bx - CFG.DRAIN_BARREL_W / 2, y, w: CFG.DRAIN_BARREL_W, h: CFG.DRAIN_BARREL_H, vx: (left ? 1 : -1) * CFG.DRAIN_BARREL_VX, cx: bx, seen: {}};
  }
  if (k === 'oil') return {k, x: cx - CFG.DRAIN_OIL_W / 2, y, w: CFG.DRAIN_OIL_W, h: CFG.DRAIN_OIL_H, cx, seen: {}};
  if (k === 'ramp') return {k, x: cx - CFG.DRAIN_RAMP_W / 2, y, w: CFG.DRAIN_RAMP_W, h: CFG.DRAIN_RAMP_H, cx, seen: {}};
  if (k === 'debris') return {k, x: cx - CFG.DRAIN_DEBRIS_W / 2, y, w: CFG.DRAIN_DEBRIS_W, h: CFG.DRAIN_DEBRIS_H, cx, fall: CFG.DRAIN_DEBRIS_FALL, seen: {}};
  if (k === 'wreck') return {k, x: cx - CFG.DRAIN_WRECK_W / 2, y, w: CFG.DRAIN_WRECK_W, h: CFG.DRAIN_WRECK_H, cx, seen: {}};
  return {k: 'puddle', x: cx - CFG.DRAIN_PUDDLE_W / 2, y, w: CFG.DRAIN_PUDDLE_W, h: CFG.DRAIN_PUDDLE_H, cx, seen: {}};
}
// A ramp in a random lane, on its own timer. A bike that rides over it jumps; it is not a block.
function drainSpawnRamp(){
  const cx = CFG.DRAIN_LANES[drainInt(0, CFG.DRAIN_LANES.length - 1)];
  DR.obst.push(drainMake('ramp', cx, -CFG.DRAIN_RAMP_H));
}
// A debris drop in a random lane: a growing shadow for DRAIN_DEBRIS_FALL ticks, then it lands as a block.
function drainSpawnDebris(){
  const cx = CFG.DRAIN_LANES[drainInt(0, CFG.DRAIN_LANES.length - 1)];
  DR.obst.push(drainMake('debris', cx, 8));
}
// Debris lands: a dust puff and the thud. From here it is a solid block-type obstacle.
function drainDebrisLand(o){
  drainFx('debris', o.x + o.w / 2, o.y + o.h / 2); sfx('thud');
}
// Is the obstacle solid to a bike or the truck? Debris is only solid after it lands; oil is handled as a skid, not a block.
function drainSolid(o){
  return o.k !== 'oil' && o.k !== 'puddle' && o.k !== 'ramp' && !(o.fall > 0);
}

// Steer a bike toward the mouse; no mouse means no steering. mult scales the speed (0 when stunned, half in a puddle). On an oil slick the steering is weak and the bike drifts on its last heading.
function drainSteer(a, dxMax, dyMax, mult){
  const skid = DR[a === john ? 'jSkid' : 'hSkid'] > 0;
  if (skid) mult *= CFG.DRAIN_OIL_STEER;
  let dx = 0, dy = 0;
  if (INPUT.mouse && mult > 0){
    dx = clamp(INPUT.mouse.x - a.x, -dxMax * mult, dxMax * mult);
    dy = clamp(INPUT.mouse.y - a.y, -dyMax * mult, dyMax * mult);
  }
  if (skid && mult > 0) dx += (a.lastDx >= 0 ? 1 : -1) * CFG.DRAIN_SKID_DRIFT;
  if (dx) a.lastDx = dx;
  a.x = clamp(a.x + dx, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R);
  a.y = clamp(a.y + dy, CFG.DRAIN_Y_MIN, CFG.DRAIN_Y_MAX);
}

// JOHN's bike: steer to the mouse. SPACE or RMB slide (A5). Past 90 percent the timing ring: click in the green band with the Harley close to jump on.
function drainJohnRole(){
  const j = john;
  // 10C: the lunge tell offers SLIDE as a contextual chip (at most HINT_MAX times per stage).
  hintWhen('lunge', DR.surgeMode === 'tele' && drainLunge(), [['SPACE', 'SLIDE']], () => [j.x, j.y - 36]);
  if (DR.jumpT >= 0){ stepDrainJump(); return; }
  if ((INPUT.secondary.length || INPUT.special.length) && DR.slideCD <= 0 && DR.slideT <= 0 && DR.air <= 0){
    drainSlideStart();
  }
  drainSlideStep();
  drainRampStep();
  // Landing burst: after a ramp landing John moves up the canal 20 px over 30 ticks (the truck falls back).
  if (DR.burstT > 0){ DR.burstT--; j.y = Math.max(CFG.DRAIN_Y_MIN, j.y - CFG.DRAIN_LAND_GAP / CFG.DRAIN_LAND_BURST_T); }
  const mult = DR.jStun > 0 ? 0 : (DR.jSlow > 0 ? CFG.DRAIN_PUDDLE_SLOW : 1);
  drainSteer(j, CFG.DRAIN_BIKE_DX, CFG.DRAIN_BIKE_DY, mult);
  if (DR.pull){
    DR.ringT++;
    // The first ring carries a one-time hint in the strip.
    if (DR.ringT === 1 && !DR.greenHint){ DR.greenHint = true; G.bannerTxt = 'CLICK IN THE GREEN!'; G.bannerT = CFG.DRAIN_COME_T; }
    if (DR.ringT % CFG.DRAIN_RING_T === 0) DR.ringMiss++; // a ring passed with no jump
    if (INPUT.clicks.length) drainRingClick();
  }
}

// SLIDE (A5): John slides DRAIN_SLIDE_PX sideways, away from the truck's lane, over DRAIN_SLIDE_T ticks. It gives i-frames against the truck for those ticks plus DRAIN_SLIDE_IF.
// A slide always cancels stun (it is the escape button); the cooldown still applies.
// A slide in the last DRAIN_CLOSE_WIN ticks of a lunge tell, or during the charge, is a CLOSE CALL.
function drainSlideStart(){
  const tr = t1000;
  DR.slideT = CFG.DRAIN_SLIDE_T; DR.slideCD = CFG.DRAIN_SLIDE_CD; DR.jStun = 0;
  DR.slideDir = john.x >= tr.x ? 1 : -1;
  DR.iJ = Math.max(DR.iJ, CFG.DRAIN_SLIDE_T + CFG.DRAIN_SLIDE_IF);
  sfx('rev');
  const late = DR.surgeMode === 'tele' && DR.surgeT >= CFG.DRAIN_LUNGE_TELL - CFG.DRAIN_CLOSE_WIN;
  if ((late || DR.surgeMode === 'rush') && !DR.closeDone) drainCloseCall();
}
// The CLOSE CALL: +200 points, the truck stalls for DRAIN_LUNGE_STALL ticks and then backs off (it drops back 30 px, clamped at its idle height). The truck can't start another tell for DRAIN_TELL_GAP_AFTER ticks.
function drainCloseCall(){
  const tr = t1000;
  DR.closeDone = true; DR.surgeMode = 'back'; DR.truckStall = CFG.DRAIN_LUNGE_STALL; DR.tellLock = CFG.DRAIN_TELL_GAP_AFTER;
  tr.y = Math.min(CFG.DRAIN_TRUCK_Y, tr.y + CFG.DRAIN_LUNGE_BACK);
  addScore('near', CFG.DRAIN_CLOSE_CALL_PTS); floatAt(john.x - 30, john.y - 38, 'CLOSE CALL!', 'c'); sfx('rev');
}
// Each tick of a slide: John moves 30 px over 18 ticks, and a spark trail blinks behind him.
function drainSlideStep(){
  if (DR.slideT <= 0) return;
  john.x = clamp(john.x + DR.slideDir * CFG.DRAIN_SLIDE_PX / CFG.DRAIN_SLIDE_T, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R);
  DR.slideT--;
  if (G.tick % 2 === 0) drainFx('spark', john.x - DR.slideDir * 8, john.y + 8);
}

// A click on the timing ring. Out of reach it does nothing. In reach, inside the band it jumps; outside it stuns John.
// After 3 rings pass without a jump the band widens for the next ring.
function drainRingClick(){
  const dist = Math.hypot(t800.x - john.x, t800.y - john.y);
  if (dist > CFG.DRAIN_JUMP_REACH) return;
  const wide = DR.ringMiss >= CFG.DRAIN_RING_MISS_WIDEN;
  const lo = wide ? CFG.DRAIN_BAND_WIDE_LO : CFG.DRAIN_BAND_LO;
  const hi = wide ? CFG.DRAIN_BAND_WIDE_HI : CFG.DRAIN_BAND_HI;
  const r = drainRingR();
  if (r >= lo && r <= hi){
    DR.jumpT = 0; DR.jumpFrom = {x: john.x, y: john.y}; drainComeBanner();
  } else {
    DR.jStun = CFG.DRAIN_RING_STUN; sfx('clang'); floatAt(john.x - 10, john.y - 26, 'MISS', 'b');
  }
}

// The jump tween: John's bike arcs from where it was onto the Harley. The chase is won when it lands.
function stepDrainJump(){
  DR.jumpT++;
  const k = Math.min(1, DR.jumpT / CFG.DRAIN_JUMP_TWEEN);
  john.x = DR.jumpFrom.x + (t800.x - DR.jumpFrom.x) * k;
  john.y = DR.jumpFrom.y + (t800.y - DR.jumpFrom.y) * k;
  if (DR.jumpT >= CFG.DRAIN_JUMP_TWEEN) drainEnd(true, 'GOT ON', 'GOT ON', false);
}

// The pickup line, shown on the Harley when John lands on it (both the John role's ring jump and the T-800 role's pickup).
function drainComeBanner(){
  G.bannerTxt = 'COME WITH ME|IF YOU WANT TO LIVE'; G.bannerT = CFG.DRAIN_COME_T; sfx('rev');
}

// The T-800 on the Harley: RMB, E or SPACE lobs an M79 grenade (no NITRO on the drain). Before the pickup he chases AI John; after it he aims and fires at the truck.
function drainT800Role(){
  const h = t800;
  const mult = DR.hStun > 0 ? 0 : (DR.hSlow > 0 ? CFG.DRAIN_PUDDLE_SLOW : 1);
  // Holding LMB brakes for precise grenade aim, even before John boards.
  const locked = INPUT.held;
  DR.lockOn = locked;
  if (!locked) drainSteer(h, CFG.DRAIN_BIKE_DX * CFG.DRAIN_STEER_T800, CFG.DRAIN_BIKE_DY * CFG.DRAIN_STEER_T800, mult);
  if (DR.m79CD <= 0 && (INPUT.keys.includes('e') || INPUT.secondary.length || INPUT.special.length)) drainLob();
  if (!DR.pickOn){ drainPickup(); return; }
  john.x = h.x; john.y = h.y;
  drainFire();
}

// Pickup: AI John rides ahead and drifts up the canal, weaving through the obstacles on his lane. Staying within 14 px of the Harley for 60 ticks picks him up.
function drainPickup(){
  const h = t800, j = john;
  j.y = Math.max(CFG.DRAIN_Y_MIN, j.y - CFG.DRAIN_PICK_DRIFT);
  drainObstacleRoll(j);
  if (DR.ended) return;
  const near = Math.hypot(h.x - j.x, h.y - j.y) <= CFG.DRAIN_PICK_R;
  DR.pickT = near ? DR.pickT + 1 : 0;
  if (DR.pickT >= CFG.DRAIN_PICK_TICKS){ DR.pickOn = true; j.x = h.x; j.y = h.y; drainComeBanner(); }
}

// One roll per obstacle that John meets on the pickup run: 80 percent he sidesteps it, 20 percent it is a hit (the third ends the round). Grace, i-frames and stuns pause the rolls.
function drainObstacleRoll(j){
  if (DR.jStun > 0 || DR.iJ > 0 || DR.grace > 0) return;
  for (const o of DR.obst){
    if (o.k === 'puddle' || o.k === 'oil' || o.k === 'ramp' || o.fall > 0 || o.pickSeen) continue;
    const bottom = o.y + o.h;
    if (bottom > j.y || bottom < j.y - CFG.DRAIN_PICK_OBST) continue;
    const cx = o.x + o.w / 2;
    if (Math.abs(cx - j.x) >= (o.w + CFG.DRAIN_BIKE_W) / 2 + 4) continue;
    o.pickSeen = true;
    if (rnd() < CFG.DRAIN_PICK_DODGE){
      const side = j.x >= cx ? 1 : -1;
      let to = j.x + side * CFG.DRAIN_PICK_SIDE;
      if (to < CFG.DRAIN_CANAL_L || to > CFG.DRAIN_CANAL_R) to = j.x - side * CFG.DRAIN_PICK_SIDE;
      j.x = clamp(to, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R);
    } else {
      DR.pickHits++; sfx('clang'); floatAt(j.x - 10, j.y - 26, 'HIT', 'a');
      if (DR.pickHits >= CFG.DRAIN_PICK_HITS){ drainEnd(false, 'JOHN WAS RUN DOWN', 'T-800 TERMINATED', false); return; }
    }
    return;
  }
}

// The shotgun: hold to aim (the line shows where it goes), release to fire. Five shells, then a flip-cock reload that spins the gun.
function drainFire(){
  if (DR.reloadT > 0){ DR.reloadT--; if (DR.reloadT === 0) DR.shells = CFG.DRAIN_SHELLS; return; }
  if (DR.shells <= 0){ DR.reloadT = CFG.DRAIN_RELOAD; sfx('clang'); return; }
  if (INPUT.held){ DR.aimOn = true; DR.holdT++; return; }
  if (DR.aimOn){ DR.aimOn = false; DR.holdT = 0; drainShoot(); return; }
  // A quick tap (press and release inside one tick) still fires.
  if (INPUT.clicks.length) drainShoot();
}

// The slug's ray from the Harley's gun toward the cursor. Returns where it stops (end), what it meets (what: debris, tyre, cab or null) and its direction.
function drainRay(){
  const h = t800, tr = t1000, m = INPUT.mouse || {x: h.x, y: 0};
  const sy = h.y - 8;
  let dx = m.x - h.x, dy = m.y - sy;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const top = tr.y - CFG.DRAIN_TRUCK_H / 2, bot = tr.y + CFG.DRAIN_TRUCK_H / 2;
  let what = null, end = CFG.DRAIN_SHOT_RANGE;
  for (let s = 4; s <= CFG.DRAIN_SHOT_RANGE; s += 2){
    const px = h.x + dx * s, py = sy + dy * s;
    const dbr = drainDebrisAt(px, py);
    if (dbr){ what = {k: 'debris', o: dbr}; end = s; break; }
    const ti = drainTyreAt(px, py, tr);
    if (ti >= 0){ what = {k: 'tyre', i: ti}; end = s; break; }
    if (Math.abs(px - tr.x) <= CFG.DRAIN_TRUCK_W / 2 && py >= top && py <= bot){ what = {k: 'cab'}; end = s; break; }
  }
  return {what, end, sy, dx, dy};
}
// Fire one slug from the Harley toward the aim point. The ray stops at the first thing it meets: a falling debris shadow (smashed for points), a front tyre, or the truck body.
function drainShoot(){
  const h = t800, tr = t1000;
  DR.shells--;
  const {what, end, sy, dx, dy} = drainRay();
  DR.shots.push({x0: h.x, y0: sy, x1: h.x + dx * end, y1: sy + dy * end, t: 6});
  const ex = h.x + dx * end, ey = sy + dy * end;
  if (what && what.k === 'debris'){
    what.o.gone = true; addScore('kill', CFG.DRAIN_DEBRIS_PTS); drainFx('debris', ex, ey);
    floatAt(ex - 10, ey - 8, 'SMASH', 'f'); sfx('crash');
  } else if (what && what.k === 'tyre') drainTyreHit(what.i, tr);
  else if (what) drainCabHit(tr);
  sfx('shotgun');
  if(DR.truckHP<=0)drainRoleChecks();
}

// A falling debris shadow under the point (px, py), or null.
function drainDebrisAt(px, py){
  return DR.obst.find(o => o.k === 'debris' && o.fall > 0 && !o.gone && drainBoxHit(o.x + o.w / 2, o.y + o.h / 2, o.w, o.h, px, py, 1, 1)) || null;
}
// The index (0 left, 1 right) of a live front tyre under the point, or -1. A popped tyre is not a target.
function drainTyreAt(px, py, tr){
  for (let i = 0; i < 2; i++){
    if (DR.tyreHP[i] <= 0) continue;
    const cx = tr.x + (i ? CFG.DRAIN_TYRE_X : -CFG.DRAIN_TYRE_X);
    if (drainBoxHit(cx, tr.y + CFG.DRAIN_TYRE_Y + CFG.DRAIN_TYRE_H / 2, CFG.DRAIN_TYRE_W, CFG.DRAIN_TYRE_H, px, py, 1, 1)) return i;
  }
  return -1;
}
// A tyre takes one hit. At 0 it pops: the truck loses 3 HP, slows, and swerves away from the popped side. Every pop turns on the cab damage.
function drainTyreHit(i, tr){
  DR.tyreHP[i]--;
  const tx = tr.x + (i ? CFG.DRAIN_TYRE_X : -CFG.DRAIN_TYRE_X), ty = tr.y + CFG.DRAIN_TYRE_Y + CFG.DRAIN_TYRE_H / 2;
  sfx('clang'); drainFx('spark', tx, ty);
  if (DR.tyreHP[i] > 0){ floatAt(tx - 8, ty - 10, 'TYRE', 'b'); return; }
  DR.pops++; DR.popSlow = CFG.DRAIN_POP_SLOW;
  drainTruckHurt(CFG.DRAIN_POP_DMG);
  tr.x = clamp(tr.x + (i ? -1 : 1) * CFG.DRAIN_POP_SWERVE, CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
  DR.shake = 8; sfx('crash'); floatAt(tr.x - 12, tr.y - 30, 'POP', 'b');
}
// A shot into the cab: before any tyre is popped it only clanks off; after that it does damage.
function drainCabHit(tr){
  if (DR.pops <= 0){
    DR.clankT = CFG.DRAIN_CLANK_T; sfx('clang'); floatAt(tr.x - 14, tr.y - 30, 'CLANK', 'a'); drainFx('spark', tr.x, tr.y - 20);
    return;
  }
  drainTruckHurt(CFG.DRAIN_CAB_DMG); floatAt(tr.x - 10, tr.y - 30, 'CAB', 'b');
}

// ===== DRAIN GRENADES, STALL AND CRACKS =====
// Windshield crack lines per level, as segments from the crack point (level 1 first, level 2 adds more).
const DRAIN_CRACKS = [[[0, 0, -5, -3], [0, 0, 4, -4], [0, 0, 1, 5]], [[0, 0, -7, 1], [0, 0, -3, 5], [0, 0, 6, 2], [0, 0, 3, -6]]];
// Speed factor for the truck: 40 percent while it is stalled by a grenade, else full speed.
function drainStallMul(){ return DR.gStall > 0 ? CFG.DRAIN_STALL_SPD : 1; }
// The ramp scrolls with the canal and launches John's bike when it reaches him. Shared by the John role and the AI John of the T-1000 role.
function drainRampStep(){
  if (!DR.ramp) return;
  const j = john;
  if (!DR.stop) DR.ramp.y += CFG.DRAIN_SCROLL;
  if (DR.ramp.y >= j.y - 2){ DR.air = CFG.DRAIN_JUMP_T; DR.ramp = null; sfx('ring'); floatAt(j.x - 8, j.y - 26, 'RAD!', 'd'); }
  else if (DR.ramp.y > CFG.HUD_Y) DR.ramp = null;
}
// A slug hit on the truck: 1 HP, a white flash and a screen shake.
function drainSlugHit(){
  drainTruckHurt(CFG.DRAIN_SLUG_HP); DR.flash = 2; DR.flashCol = '1'; DR.shake = CFG.DRAIN_TRUCK_SHAKE; sfx('clang');
}
// The attack opening is judged on impact, not on launch: aim ahead of a moving truck.
function drainCounterWindow(){
  return G.role === 't800' && ['tele','swipeTele','rush','swipe','hold'].includes(DR.surgeMode);
}
// Grenades bypass tyre armor. A timed hit does double damage and forces recovery.
function drainGrenadeHit(x, y){
  if (G.role === 't1000'){ drainGuardHit(true); return; }
  const counter=drainCounterWindow(), damage=counter?CFG.DRAIN_M79_COUNTER_DMG:CFG.DRAIN_M79_DMG;
  drainTruckHurt(damage); DR.gStall = CFG.DRAIN_STALL_T; DR.flash = 2; DR.flashCol = 'b'; DR.shake = CFG.DRAIN_TRUCK_SHAKE;
  if(counter){
    DR.surgeMode='back'; DR.surgeT=0; DR.swiping=false;
    DR.tellLock=Math.max(DR.tellLock,CFG.DRAIN_M79_COUNTER_GAP);
    DR.iJ=Math.max(DR.iJ,CFG.DRAIN_BUMP_IF); DR.iH=Math.max(DR.iH,CFG.DRAIN_BUMP_IF);
  }
  sfx('crash'); sfx('clang'); drainFx('wreck', x, y);
  G.bannerTxt = (counter?'COUNTER -':'TRUCK -')+damage+' HP'; G.bannerT = 60;
  if(DR.truckHP<=0)drainRoleChecks();
}
// Unlimited T-800 grenades: E, SPACE or RMB launches at the cursor; reload is the only limit.
function drainLob(){
  if(G.role!=='t800'||DR.m79CD>0||DR.ended)return;
  const h = t800, m = INPUT.mouse || {x: h.x, y: h.y - 40};
  DR.m79CD = CFG.DRAIN_M79_CD;
  DR.flights.push({x0: h.x, y0: h.y - 8, x1: m.x, y1: m.y, t: CFG.DRAIN_M79_FLIGHT});
  sfx('shotgun');
}
// Grenades in the air count down to their burst. A blast that reaches the truck is a grenade hit. The AI lobs burst on their red ring the same way.
function drainGrenadesStep(){
  const R = CFG.DRAIN_M79_SPLASH, tr = t1000;
  for (const g of DR.flights){
    if (DR.ended) break;
    if (--g.t > 0) continue;
    g.gone = true;
    if (drainBoxHit(g.x1, g.y1, 2 * R, 2 * R, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)) drainGrenadeHit(g.x1, g.y1);
    else drainFx('block', g.x1, g.y1);
  }
  DR.flights = DR.flights.filter(g => !g.gone);
  for (const w of DR.lobs){
    if (DR.ended) break;
    if (--w.t > 0) continue;
    w.gone = true;
    if (drainBoxHit(w.x, w.y, 2 * R, 2 * R, tr.x, tr.y, CFG.DRAIN_TRUCK_W, CFG.DRAIN_TRUCK_H)) drainGrenadeHit(w.x, w.y);
    else drainFx('block', w.x, w.y);
  }
  DR.lobs = DR.lobs.filter(w => !w.gone);
}
// T-1000 role, AI John's evasion. He changes lane once per approach when the truck is close behind him (ramp 60 percent of the time), wheelies on a surge telegraph, and weaves every 60 to 90 ticks.
function drainEvade(){
  const tr = t1000, gapY = tr.y - john.y;
  const tele = DR.surgeMode === 'tele' || DR.surgeMode === 'swipeTele';
  if (tele && DR.wheelieCD <= 0 && DR.wheelieT <= 0){ DR.wheelieT = CFG.DRAIN_WHEELIE_T; DR.wheelieCD = CFG.DRAIN_WHEELIE_CD; }
  if (DR.wheelieT > 0) john.y = Math.max(CFG.DRAIN_Y_MIN, john.y - CFG.DRAIN_WHEELIE_SPD);
  const close = gapY >= 0 && gapY <= CFG.DRAIN_EVADE_AHEAD && Math.abs(john.x - tr.x) < CFG.DRAIN_TRUCK_W;
  if (!close) DR.evadeRolled = false;
  else if (!DR.evadeRolled){
    DR.evadeRolled = true;
    const side = john.x >= tr.x ? 1 : -1;
    DR.jDodge = drainJohnEscape(side, CFG.DRAIN_PICK_SIDE);
    if (DR.ramp === null && DR.rampCD <= 0 && DR.air <= 0 && rnd() < CFG.DRAIN_EVADE_RAMP_P){ DR.ramp = {y: john.y - CFG.DRAIN_RAMP_AHEAD}; DR.rampCD = CFG.DRAIN_RAMP_CD; }
  }
  if (--DR.weaveT <= 0){
    DR.weaveT = drainInt(CFG.DRAIN_WEAVE_MIN, CFG.DRAIN_WEAVE_MAX);
    if (DR.jDodge === null) DR.jDodge = drainJohnEscape(rnd() < 0.5 ? -1 : 1, CFG.DRAIN_PICK_SIDE);
  }
  drainRampStep();
}
// A dashed line from a to b: `on` pixels drawn, `off` skipped, shifted by `phase` so it can crawl or pulse.
function drainDash(x0, y0, x1, y1, col, phase, on, off){
  const len = Math.hypot(x1 - x0, y1 - y0) || 1, n = Math.floor(len);
  for (let s = 0; s <= n; s++){
    if ((s + phase) % (on + off) >= on) continue;
    const k = s / len;
    fillBox(Math.round(x0 + (x1 - x0) * k), Math.round(y0 + (y1 - y0) * k), 1, 1, col);
  }
}
// The pull tether: a pulsing dashed line from the Harley to John, green while he is in reach and grey when he is not.
function drainTetherDraw(){
  const col = Math.hypot(t800.x - john.x, t800.y - john.y) <= CFG.DRAIN_JUMP_REACH ? 'f' : '3';
  drainDash(t800.x, t800.y - 4, john.x, john.y - 4, col, (G.tick >> 1) % 6, 3, 3);
}
// The T-800's aim line while the button is held: the same dotted line as the crowd rounds (drawAim), along drainRay.
// Red where the slug would stop on a tyre, debris or the cab; grey on nothing. A black dot under each dot keeps it readable.
function drainAimDraw(){
  if (!INPUT.mouse) return;
  const h = t800, r = drainRay();
  const col = r.what ? 'b' : '3';
  for (let s = 0; s < r.end; s += CFG.AIM_DOT) fillBox(Math.round(h.x + r.dx * s), Math.round(r.sy + r.dy * s) + 1, 1, 1, '0');
  for (let s = 0; s < r.end; s += CFG.AIM_DOT) fillBox(Math.round(h.x + r.dx * s), Math.round(r.sy + r.dy * s), 1, 1, col);
}
// Black smoke from the cab during a stall: three puffs rise and fade.
function drainSmokeDraw(){
  if (DR.gStall <= 0) return;
  for (let k = 0; k < 3; k++){
    const age = (G.tick + k * 9) % 30, s = 3 + (age >> 3);
    bctx.globalAlpha = 0.6; fillBox(Math.round(t1000.x + 6 + k * 3), Math.round(t1000.y - 16 - age * 0.6), s, s, '0'); bctx.globalAlpha = 1;
  }
}
// The windshield cracks: each level appears over 12 ticks in three frames, then stays.
function drainCrackDraw(){
  if (DR.crackLv <= 0) return;
  const ox = t1000.x, oy = t1000.y - 14;
  for (let lv = 0; lv < DR.crackLv; lv++){
    const frame = lv === DR.crackLv - 1 && DR.crackT > 0 ? 3 - Math.ceil(DR.crackT / 4) : 2;
    const k = Math.max(1, Math.min(3, frame + 1)) / 3;
    for (const s of DRAIN_CRACKS[lv]) drainSolidLine(ox, oy, ox + s[2] * k, oy + s[3] * k, '0');
  }
}
// The grenade crate: while it falls, a shadow marks the landing spot and a parachute hangs above it. Landed, it is a small crate.
function drainCrateDraw(c){
  const x = Math.round(c.x), y = Math.round(c.y);
  if (c.fall <= 0){ fillBox(x - 3, y - 2, 6, 5, '6'); fillBox(x - 3, y + 1, 6, 1, '7'); return; }
  bctx.globalAlpha = 0.5; fillBox(x - 5, y, 10, 4, '0'); bctx.globalAlpha = 1;
  const cy = y - 16 - Math.round(30 * c.fall / CFG.DRAIN_CRATE_FALL_T);
  fillBox(x - 6, cy, 12, 3, 'b'); fillBox(x - 6, cy + 3, 12, 1, '1');
  fillBox(x - 5, cy + 4, 1, 6, '2'); fillBox(x + 4, cy + 4, 1, 6, '2');
  fillBox(x - 3, cy + 10, 6, 5, '6'); fillBox(x - 3, cy + 13, 6, 1, '7');
}
// Grenades in flight (a dot on an arc with its shadow) and the AI lobs' red landing rings.
function drainFlightDraw(){
  for (const g of DR.flights){
    const k = 1 - g.t / CFG.DRAIN_M79_FLIGHT;
    const x = g.x0 + (g.x1 - g.x0) * k, y = g.y0 + (g.y1 - g.y0) * k - Math.sin(k * Math.PI) * 24;
    bctx.globalAlpha = 0.5; fillBox(Math.round(g.x1) - 3, Math.round(g.y1) - 1, 6, 2, '0'); bctx.globalAlpha = 1;
    millRing(Math.round(g.x1), Math.round(g.y1), CFG.DRAIN_M79_SPLASH, 'd');
    fillBox(Math.round(x) - 1, Math.round(y) - 1, 3, 3, '1');
  }
  for (const w of DR.lobs) millRing(Math.round(w.x), Math.round(w.y), CFG.DRAIN_M79_SPLASH, 'b');
}

// The T-1000 truck (player): steer toward the mouse x with acceleration. SPACE surges (the telegraph shows first). RMB side-swipes toward the cursor side, on a cooldown.
function drainT1000Role(){
  const tr = t1000;
  // 10C: RAM is offered when John is close. Space rams from anywhere (no range check on the ram itself), so this is a prompt, not a gate.
  const near = Math.hypot(john.x - tr.x, john.y - tr.y) <= CFG.HINT_RAM_R;
  hintWhen('ram', near && DR.surgeCD <= 0 && DR.surgeMode === 'idle', [['SPACE', 'RAM']], () => [tr.x, tr.y - 30]);
  if (DR.truckStall <= 0 && (DR.surgeMode === 'idle' || DR.surgeMode === 'back')){
    if (INPUT.mouse) DR.truckVX += clamp((INPUT.mouse.x - tr.x) / 8, -1, 1) * CFG.DRAIN_T1K_ACCEL;
    DR.truckVX = clamp(DR.truckVX * 0.92, -CFG.DRAIN_T1K_MAX, CFG.DRAIN_T1K_MAX);
    tr.x = clamp(tr.x + DR.truckVX * drainStallMul(), CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
    if (INPUT.special.length && DR.sideCD <= 0){
      DR.surgeMode = 'swipe'; DR.swipeT = 0; DR.swipeLurch = CFG.DRAIN_SIDE_LURCH; DR.sideCD = CFG.DRAIN_SIDE_CD; DR.sideFx = 12;
      DR.swipeSide = INPUT.mouse && INPUT.mouse.x < tr.x ? -1 : 1;
      DR.swipeTx = clamp(tr.x + DR.swipeSide * DR.swipeLurch, CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
      DR.swipeHit = false; DR.closeDone = false; DR.truckVX = 0; DR.ramHit = false;
      sfx('crash');
    }
  }
}

// The truck: AI steering (John and T-800 roles), then the surge state machine: idle, telegraph, rush, hold, back.
function drainTruckStep(){
  const tr = t1000, role = G.role;
  if (DR.surgeMode !== 'swipe') DR.swiping = false;
  if (DR.truckStall > 0) return;
  const free = DR.surgeMode === 'idle' || DR.surgeMode === 'back';
  if (role !== 't1000' && free){
    // The AI truck steers at whichever bike is nearer to it.
    const dJ = Math.hypot(john.x - tr.x, john.y - tr.y), dH = Math.hypot(t800.x - tr.x, t800.y - tr.y);
    const target = role === 't800' && dH < dJ ? t800.x : john.x;
    const lag = CFG.DRAIN_TRUCK_STEER * (DR.truckSlow > 0 ? 0.5 : 1) * DR.popSlow * drainStallMul();
    tr.x = clamp(tr.x + clamp(target - tr.x, -lag, lag), CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
  }
  if (role !== 't1000') drainLeanStep(tr);
  if (DR.surgeMode === 'idle'){
    if (DR.surgeCD > 0) DR.surgeCD--;
    if (role === 't1000'){ if (INPUT.secondary.length && DR.surgeCD <= 0) drainSurgeStart(); }
    else if (DR.surgeCD <= 0 && DR.surgeBlock <= 0 && DR.grace <= 0 && DR.tellLock <= 0) drainSurgeStart();
  } else if (DR.surgeMode === 'tele'){
    DR.surgeT++; tr.x = DR.surgeX;
    if (DR.surgeT >= (drainLunge() ? CFG.DRAIN_LUNGE_TELL : CFG.DRAIN_TELE)){ DR.surgeMode = 'rush'; DR.surgeT = 0; DR.rushes++; }
  } else if (DR.surgeMode === 'swipeTele'){
    // The truck pulls level with the bike it will slam (John) while the red bar shows on that side. Its lurch target (DR.swipeTx) is locked when the tell starts.
    DR.surgeT++;
    tr.y = clamp(tr.y + clamp(john.y - tr.y, -2, 2), CFG.DRAIN_TRUCK_TOP, CFG.DRAIN_TRUCK_Y);
    if (DR.surgeT >= CFG.DRAIN_SWIPE_T){ DR.surgeMode = 'swipe'; DR.swipeT = 0; DR.swipeLurch = CFG.DRAIN_SWIPE_LURCH; DR.swipeHit = false; }
  } else if (DR.surgeMode === 'swipe'){
    // The lurch: the truck moves toward the locked x for 6 ticks (at most DRAIN_SWIPE_LURCH px), and the bump check runs while DR.swiping is set.
    DR.swiping = true; DR.swipeT++;
    tr.x = clamp(tr.x + clamp(DR.swipeTx - tr.x, -DR.swipeLurch / 6, DR.swipeLurch / 6), CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
    if (DR.swipeT >= 6){
      DR.swiping = false;
      // A whiff (John slid out of the lurch) is a CLOSE CALL for John. A hit just backs off.
      if (!DR.swipeHit && role === 'john' && !DR.closeDone) drainCloseCall();
      else DR.surgeMode = 'back';
    }
  } else if (DR.surgeMode === 'rush' && !drainLunge()){
    // Pass-9 rush for the other roles: straight up the lane at DRAIN_RUSH_SPD, then the hold.
    tr.x = DR.surgeX; tr.y -= CFG.DRAIN_RUSH_SPD * drainStallMul();
    drainNearMiss(tr);
    if (tr.y <= CFG.DRAIN_TRUCK_TOP){ tr.y = CFG.DRAIN_TRUCK_TOP; DR.surgeMode = 'hold'; DR.surgeT = 0; }
  } else if (DR.surgeMode === 'rush'){
    // The LUNGE charge (John role): DRAIN_LUNGE_PX up the lane over DRAIN_LUNGE_T ticks (a grenade stall slows it).
    DR.surgeT++;
    tr.x = DR.surgeX; tr.y = Math.max(CFG.DRAIN_TRUCK_TOP, tr.y - CFG.DRAIN_LUNGE_PX / CFG.DRAIN_LUNGE_T * drainStallMul());
    drainNearMiss(tr);
    if (DR.surgeT >= CFG.DRAIN_LUNGE_T || tr.y <= CFG.DRAIN_TRUCK_TOP){ DR.surgeMode = 'hold'; DR.surgeT = 0; }
  } else if (DR.surgeMode === 'hold'){
    DR.surgeT++;
    if (DR.surgeT >= CFG.DRAIN_RUSH_HOLD) DR.surgeMode = 'back';
  } else if (DR.surgeMode === 'back'){
    tr.y = Math.min(CFG.DRAIN_TRUCK_Y, tr.y + CFG.DRAIN_BACK_SPD);
    if (tr.y >= CFG.DRAIN_TRUCK_Y){
      DR.surgeMode = 'idle';
      DR.surgeCD = role === 't1000' ? CFG.DRAIN_T1K_SURGE_CD : drainNextGap();
    }
  }
}

// The AI surge gap: 150-240 ticks, 100-160 past 60 percent, and 20 ticks after every odd rush past 75 percent (the double ram).
function drainNextGap(){
  if (drainFrac() >= CFG.DRAIN_DOUBLE_AT && DR.rushes % 2 === 1) return CFG.DRAIN_DOUBLE_GAP;
  if (drainFrac() >= CFG.DRAIN_LATE_AT) return drainInt(CFG.DRAIN_SURGE_LATE_MIN, CFG.DRAIN_SURGE_LATE_MAX);
  return drainInt(CFG.DRAIN_SURGE_MIN, CFG.DRAIN_SURGE_MAX);
}

// The T-1000's lean-out past 50 percent: a random start while the truck is idle, an 18-tick chrome flash, then the arm is out for 20 ticks.
function drainLeanStep(tr){
  if (DR.leanT < 0){
    if (DR.leanCD <= 0 && DR.surgeMode === 'idle' && drainFrac() >= CFG.DRAIN_LEAN_AT && rnd() < CFG.DRAIN_LEAN_P){
      DR.leanT = 0; DR.leanSide = john.x >= tr.x ? 1 : -1; DR.leanHit = {j: false, h: false};
    }
    return;
  }
  DR.leanT++;
  if (DR.leanT >= CFG.DRAIN_LEAN_TELE + CFG.DRAIN_LEAN_T){ DR.leanT = -1; DR.leanCD = CFG.DRAIN_LEAN_CD; }
}

// The lean arm (once out): a bike inside its reach is knocked once per lean. The reach runs DRAIN_LEAN_REACH px ahead of the cab on the lean side.
function drainLeanHits(tr, jLive, jOnH, hLive){
  if (DR.leanT < CFG.DRAIN_LEAN_TELE) return;
  const side = DR.leanSide, ax = tr.x + side * (CFG.DRAIN_TRUCK_W / 2 + 6), ay = tr.y - CFG.DRAIN_LEAN_REACH / 2;
  if (jLive && !jOnH && !DR.leanHit.j && drainBoxHit(ax, ay, 12, CFG.DRAIN_LEAN_REACH, john.x, john.y, CFG.DRAIN_BIKE_W, CFG.DRAIN_BIKE_H)){
    DR.leanHit.j = true; drainKnock(john, 'j', CFG.DRAIN_BLOCK_STUN, CFG.DRAIN_BLOCK_PUSH, 'clang'); drainFx('block', john.x, john.y);
  }
  if (hLive && !DR.leanHit.h && drainBoxHit(ax, ay, 12, CFG.DRAIN_LEAN_REACH, t800.x, t800.y, CFG.DRAIN_HARLEY_W, CFG.DRAIN_HARLEY_H)){
    DR.leanHit.h = true; drainKnock(t800, 'h', CFG.DRAIN_BLOCK_STUN, CFG.DRAIN_BLOCK_PUSH, 'clang'); drainFx('block', t800.x, t800.y);
  }
}

// The lunge (40-tick tell, chevrons, 16-tick charge) is John-role only. The other roles' trucks keep the pass-9 tell (DRAIN_TELE) and rush (DRAIN_RUSH_SPD).
function drainLunge(){
  return G.role === 'john';
}

// Start a surge: the telegraph locks the lane under the truck, the horn sounds, and AI John's reaction clock starts.
function drainSurgeStart(){
  DR.surgeT = 0; DR.surgeX = t1000.x; DR.nearDone = false; DR.closeDone = false; DR.ramHit = false;
  DR.jReact = G.role === 't800' ? CFG.DRAIN_JOHN_REACT_T800 : CFG.DRAIN_JOHN_REACT; DR.jDodge = null;
  // An AI surge is a side-swipe 1 time in 4 (the player's truck only rams). A side-swipe locks its target x (John's x now) for the lurch.
  if (G.role !== 't1000' && rnd() < CFG.DRAIN_SWIPE_P){
    DR.surgeMode = 'swipeTele'; DR.swipeSide = john.x >= t1000.x ? 1 : -1; DR.surgeX = t1000.x;
    DR.swipeTx = john.x; DR.swipeHit = false;
  } else DR.surgeMode = 'tele';
  sfx('horn');
}

// A rush that passes within 10 px of John without touching him scores the near-miss bonus, once per surge. Three near misses inside 5 s is a CLOSE CALL bonus.
function drainNearMiss(tr){
  if (DR.nearDone) return;
  const gap = Math.abs(john.x - tr.x) - (CFG.DRAIN_TRUCK_W + CFG.DRAIN_BIKE_W) / 2;
  if (gap >= 0 && gap <= CFG.DRAIN_NEAR_R && Math.abs(john.y - tr.y) < 30){
    DR.nearDone = true; addScore('near', CFG.DRAIN_NEAR_PTS); floatAt(john.x - 12, john.y - 26, 'NEAR', 'f');
    DR.nearTimes = DR.nearTimes.filter(t => G.tick - t < CFG.DRAIN_CLOSE_T); DR.nearTimes.push(G.tick);
    if (DR.nearTimes.length >= CFG.DRAIN_CLOSE_N){
      DR.nearTimes = []; addScore('near', CFG.DRAIN_CLOSE_PTS); floatAt(john.x - 30, john.y - 38, 'CLOSE CALL X3', 'c'); sfx('rev');
    }
  }
}

// AI John's telegraph dodge. T-1000 role: he reacts after 14 ticks and always leaves a locked lane (8 px of error). T-800 role (before pickup): he reacts after 6 ticks and leaves 85 percent of the time, so the dodge lands inside the 40-tick telegraph.
function drainJohnAI(){
  if (G.role === 'john' || DR.jStun > 0 || (G.role === 't800' && DR.pickOn)) return;
  if (G.role === 't1000') drainEvade();
  if ((DR.surgeMode === 'tele' || DR.surgeMode === 'swipeTele') && DR.jReact > 0){
    DR.jReact--;
    if (DR.jReact === 0 && Math.abs(john.x - DR.surgeX) < 40 && (G.role === 't1000' || rnd() < CFG.DRAIN_JOHN_DODGE_P)){
      const side = john.x >= DR.surgeX ? 1 : -1;
      let to = john.x + side * CFG.DRAIN_JOHN_DODGE;
      if (G.role === 't800' && (to < CFG.DRAIN_CANAL_L || to > CFG.DRAIN_CANAL_R)) to = john.x - side * CFG.DRAIN_JOHN_DODGE;
      const error = (rnd() * 2 - 1) * CFG.DRAIN_JOHN_ERR;
      DR.jDodge = G.role === 't1000' ? drainJohnEscape(side, CFG.DRAIN_JOHN_DODGE, error) : clamp(to + error, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R);
    }
  }
  if (DR.jDodge !== null){
    const d = DR.jDodge - john.x, sp = CFG.DRAIN_JOHN_DODGE_SPD;
    john.x += clamp(d, -sp, sp);
    if (Math.abs(d) <= sp) DR.jDodge = null;
  }
  john.y += (CFG.DRAIN_AI_Y - john.y) * 0.05;
}

// The AI Harley (John and T-1000 roles): it drives in behind the truck at the arrival mark, pellets the truck on a timer, and in the John role pulls alongside John at 90 percent.
function drainHarleyStep(){
  if (G.role === 't800') return;
  const h = t800, tr = t1000, role = G.role;
  if (!DR.harleyIn){
    const at = role === 't1000' ? CFG.DRAIN_HARLEY_AT_T1K : role === 'john' ? CFG.DRAIN_HARLEY_AT_JOHN : CFG.DRAIN_HARLEY_AT;
    if (drainFrac() < at) return;
    DR.harleyIn = true;
    DR.pelletT = role === 't1000' ? CFG.DRAIN_PELLET_T1K : CFG.DRAIN_PELLET_T;
    if (role === 'john'){
      // The roar-in: the Harley comes up from the bottom edge beside the truck, the banner shows, and it goes straight into the pull.
      h.x = clamp(tr.x + CFG.DRAIN_ENTER_DX, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R); h.y = H + CFG.DRAIN_ENTER_DY;
      DR.enter = true; drainComeBanner();
    }
  }
  // John's pull starts on arrival (DRAIN_HARLEY_AT_JOHN); other roles pull from DRAIN_PULL_AT.
  if (role === 'john' && (DR.harleyIn || drainFrac() >= CFG.DRAIN_PULL_AT)) DR.pull = true;
  let tx = clamp(tr.x - 40, CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R), ty = tr.y + 30;
  if (role === 't1000'){ tx = clamp(tr.x + (tr.x < 90 ? 52 : -52), CFG.DRAIN_CANAL_L, CFG.DRAIN_CANAL_R); ty = clamp(john.y + 8, 64, 120); }
  // At the pull the Harley rides alongside John (16 px to one side, level with him) and closes at 1.5 times its normal speed.
  let sp = CFG.DRAIN_HARLEY_SPD;
  if (DR.pull){
    const side = h.x <= john.x ? -1 : 1;
    tx = john.x + side * CFG.DRAIN_PULL_CHASE_X; ty = john.y; sp = CFG.DRAIN_HARLEY_SPD * CFG.DRAIN_PULL_CHASE_SPD;
    DR.tether = true;
    if (DR.enter){
      // The roar-in closes at 2x until it is beside John, then the pull takes over.
      sp = CFG.DRAIN_HARLEY_SPD * CFG.DRAIN_ENTER_MUL;
      if (Math.hypot(tx - h.x, ty - h.y) <= sp) DR.enter = false;
    }
  }
  // Hold the firing position through the tell so the locked trajectory stays readable.
  if (role === 't1000' && DR.guardWind > 0) sp = 0;
  h.x += clamp(tx - h.x, -sp, sp);
  // Once beside John the Harley holds his lane every tick, so it never drifts back.
  if (DR.pull && !DR.enter) h.y = john.y; else h.y += clamp(ty - h.y, -sp, sp);
  if (role === 't1000'){ drainGuardFire(); return; }
  DR.pelletT--;
  if (DR.pelletT > 0) return;
  DR.pelletT = role === 't1000' ? CFG.DRAIN_PELLET_T1K : CFG.DRAIN_PELLET_T;
  DR.pelletFx = {x0: h.x, y0: h.y - 8, x1: tr.x, y1: tr.y, t: 8};
  sfx('shotgun');
  if (role === 'john'){
    tr.x = clamp(tr.x + (Math.sign(tr.x - h.x) || 1) * CFG.DRAIN_PELLET_SHOVE, CFG.DRAIN_TRUCK_L, CFG.DRAIN_TRUCK_R);
    DR.surgeX = tr.x; DR.surgeBlock = CFG.DRAIN_PELLET_BLOCK;
  } else if (DR.pops > 0){
    drainSlugHit(); // the cab takes slugs only once a tyre is popped
  }
}

// T-1000 chase pressure: the protector is visible from the start. His aim tracks
// briefly, locks before firing, and launches a physical slug that can be dodged.
function drainGuardFire(){
  const h=t800,tr=t1000;
  for(const s of DR.guardSlugs){
    // Substeps keep corner hits consistent at the projectile's maximum speed.
    for(let i=0;i<2&&!s.gone;i++){
      s.x+=s.vx/2;s.y+=s.vy/2;
      if(drainBoxHit(s.x,s.y,2,2,tr.x,tr.y,CFG.DRAIN_TRUCK_W,CFG.DRAIN_TRUCK_H)){
        s.gone=true;drainGuardHit(false);
      }
    }
    if(--s.life<=0||s.x<0||s.x>W||s.y<16||s.y>HUD_Y) s.gone=true;
  }
  DR.guardSlugs=DR.guardSlugs.filter(s=>!s.gone);
  if(DR.ended)return;
  if(DR.guardWind>0){
    if(DR.guardWind>CFG.DRAIN_GUARD_LOCK) DR.guardAim={x:tr.x,y:tr.y};
    if(--DR.guardWind===0){
      const x=h.x,y=h.y-8,dx=DR.guardAim.x-x,dy=DR.guardAim.y-y,len=Math.hypot(dx,dy)||1;
      DR.guardSlugs.push({x,y,vx:dx/len*CFG.DRAIN_GUARD_SLUG_SPD,vy:dy/len*CFG.DRAIN_GUARD_SLUG_SPD,life:80});
      DR.guardCD=CFG.DRAIN_GUARD_CD;DR.pelletFx={x0:x,y0:y,x1:x+dx/len*7,y1:y+dy/len*7,t:5};sfx('shotgun');
    }
    return;
  }
  if(DR.guardCD>0)DR.guardCD--;
  if(DR.guardCD<=0&&!DR.lobs.length&&!drainBoxHit(h.x,h.y-8,12,12,tr.x,tr.y,CFG.DRAIN_TRUCK_W,CFG.DRAIN_TRUCK_H)){
    DR.guardWind=CFG.DRAIN_GUARD_TELL;DR.guardAim={x:tr.x,y:tr.y};
  }
  // Grenades are occasional area denial, never stacked with a shot warning.
  if(DR.aiLobT>0)DR.aiLobT--;
  if(DR.aiLobT<=0&&!DR.guardWind&&!DR.guardSlugs.length){
    DR.aiLobT=CFG.DRAIN_GUARD_LOB_EVERY;
    DR.lobs.push({x:tr.x,y:tr.y,t:CFG.DRAIN_GUARD_LOB_TELL});sfx('clang');
  }
}
// Both protector weapons cost just one of the truck's twelve HP. Brief armor
// immunity prevents overlapping impacts from taking multiple HP at once.
function drainGuardHit(grenade){
  if(DR.guardHitT>0||DR.ended)return;
  DR.guardHitT=CFG.DRAIN_GUARD_HIT_IF;
  drainTruckHurt(1);DR.flash=2;DR.flashCol=grenade?'b':'1';DR.shake=CFG.DRAIN_TRUCK_SHAKE;
  if(grenade)DR.gStall=CFG.DRAIN_GUARD_SLOW;
