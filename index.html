// JOHN mode: blend in, collect five quarters, reach the flashing exit.
MODES.john = {
  setup(round){
    G.speedMul = speedScale(round);
    spawnCast(round);
    placeCoins();
    G.exitDoor = -1; G.exitFlash = 0; G.quartersGot = 0; G.exited = false;
    G.lossWhy = ''; G.exposure = 0; G.pts = {hidden:0, quarter:0, exit:0, time:0};
    G.timerMax = roundSeconds(round) * 60; G.timer = G.timerMax;
    G.decoyLeft = lvl('decoy') * CFG.DECOY_USES;
    G.sarahDecoys = G.sarah ? sarahDecoyMax() : 0;
  },
  update(){
    refreshHidden();
    stepBox();
    stepDecoys();
    steerJohn();
    stepItemsJohn();
    for (const a of actors) stepDown(a);
    for (const a of actors){
      if (a.down > 0) continue;
      if (a.kind === 'shopper') stepShopper(a);
      else if (a.kind === 'cop') aiCop(a);
      else if (a.kind === 't800'){ stepReload(a); aiT800(a); }
      else if (a.kind === 't1000'){ stepSplash(a); aiT1000(a); stepGlint(a); }
      stepBurst(a);
    }
    updateCones();
    stepBullets();
    stepFlashes();
    t1000.shover = t1000.moving && t1000.st !== 'frozen';
    separate();
    for (const a of actors) clampActor(a);
    stepEvacuate();
    stepBoxShuffle();
    boxTouch();
    updateExposure();
    collectQuarters();
    checkExit();
    tickClock();
    scoreHidden();
    tickFloaters();
  },
  hud(){
    const hot = G.exposure > 0.66;
    if (john.hidden) text(bctx, 'HIDDEN', 4, HUD_Y+4, 'f');
    else text(bctx, 'EXPOSED', 4, HUD_Y+4, hot ? 'b' : 'd');
    bctx.fillStyle = PAL['3']; bctx.fillRect(40, HUD_Y+4, 62, 5);
    bctx.fillStyle = PAL['0']; bctx.fillRect(41, HUD_Y+5, 60, 3);
    bctx.fillStyle = PAL[hot ? 'b' : 'd']; bctx.fillRect(41, HUD_Y+5, Math.round(60 * G.exposure), 3);
    for (let i = 0; i < maxHearts(); i++) drawHeart(108 + i*7, HUD_Y+4, i < john.hearts ? 'b' : '3');
  },
  checkEnd(){
    if (G.lossWhy) return {win: false, title: G.lossWhy};
    if (G.exited) return {win: true, title: 'ROUND CLEAR'};
    return null;
  },
};
// Can the T-800 body-block, swing or fire at the T-1000 yet? JOHN and T-800 rounds: once it is revealed or stalking.
// T-1000 round: the T-800 hunts once suspicion reaches SUSP_T800, or as soon as John is REVEALED.
function revealedOrStalking(){
  return t1000 !== null && (t1000.st === 'reveal' || t1000.st === 'stalk');
}
MODES.john.t800CanEngage = revealedOrStalking;

// ----- Swarm rounds (T-1000 and T-800) shared helpers -----
// Suspicion meter: clamped to 0..100.
function addSuspicion(n){ G.suspicion = Math.min(100, G.suspicion + n); }
// Horizontal meter: dark track, fill of frac (0..1) in palette colour col.
function meterBar(x, y, w, frac, col){
  fillBox(x, y, w, 5, '3'); fillBox(x+1, y+1, w-2, 3, '0');
  fillBox(x+1, y+1, Math.round((w-2) * clamp(frac, 0, 1)), 3, col);
}
// The player's controlled actor walks to the mouse (no mouse = stand still). A frozen actor cannot move.
function steerPlayer(a, sp){
  if (a.frozen){ a.moving = false; a.vx = 0; a.vy = 0; return; }
  if (INPUT.mouse){ a.tx = INPUT.mouse.x; a.ty = INPUT.mouse.y; }
  else { a.tx = a.x; a.ty = a.y; }
  walkTo(a, sp);
}
// John: player steering when controlled, otherwise aiJohn.
function driveJohn(){
  if (stepCrowdShoveStun(john)) return;
  if (john.controlled){ steerJohn(); return; }
  if (john.invuln > 0) john.invuln--;
  if (G.role === 't800') aiKidJohn(john); else aiJohn(john);
}
// Every non-John actor in a swarm round: shoppers and cops as in JOHN mode, and the T-800 / T-1000 AI unless the player controls it.
function stepRoleActors(){
  for (const a of actors){
    if (a.down > 0 || a === john) continue;
    if (stepCrowdShoveStun(a)) continue;
    if (a.kind === 'shopper') stepShopper(a);
    else if (a.kind === 'cop') aiCop(a);
    else if (a.kind === 't800'){ stepReload(a); if (!a.controlled) aiT800(a); }
    else if (a.kind === 't1000'){
      // A punched T-1000 is stunned: it stays put while stunT counts down.
      stepSplash(a);
      if (a.stunT > 0) a.stunT--;
      else if (!a.controlled) aiHunterT1000(a);
      stepGlint(a);
    }
    stepBurst(a);
  }
}
// Round clock for swarm rounds. Returns true on the tick it reaches zero.
function tickRoundTimer(){
  if (G.timer > 0) G.timer--;
  return G.timer === 0;
}
// Shared result check: a recorded loss beats a recorded win; no result yet returns null.
function winLossResult(winTitle){
  if (G.lossWhy) return {win: false, title: G.lossWhy};
  if (G.winWhy) return {win: true, title: G.winWhy || winTitle};
  return null;
}
// Revealed John (T-1000 round): ID is full. He shows his own face for ID_REVEAL_TICKS, then re-disguises with a new palette.
function revealJohn(){
  G.run.ids++;
  john.revealT = CFG.ID_REVEAL_TICKS; john.revealHits = 0; john.idP = 1; // ID stays full while revealed; disguiseJohn resets it
  john.d = johnDef();
  addScore('reveal', CFG.T1000_REVEAL_PTS);
  floaters.push({text: '+50', x: clamp(john.x - 4, 2, W - 20), y: john.y - 34, t: 40, col: 'b'});
  // T-1000 round: the player's reveal of John raises the T-800's aggression.
  if (G.role === 't1000') addSuspicion(CFG.AGGRO_REVEAL);
  alertMallT800();
}
// Re-disguise John: a fresh shopper palette, ID reset.
function disguiseJohn(){
  john.d = curCast().shopper(rndInt(0, CFG.DISGUISE_N - 1));
  john.idP = 0; john.revealHits = 0;
}
// T-1000 round: ID fills while John is in the player's cone (slower while hidden) and drains otherwise.
// Full ID reveals him. No ID gain during the grace period.
function stepId(){
  john.seen = coneLive(t1000) && inCone(t1000, t1000.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF);
  if (john.revealT > 0){
    john.revealT--;
    if (john.revealT === 0) disguiseJohn();
    return;
  }
  if (inGrace()) return;
  // SCANNER: ID fills faster per level. POLICE RADIO: a real cop's cone on John fills ID at RADIO_RATE.
  // PANIC: while a kill's panic is on and John is out in the open, ID fills faster.
  const panicMul = john.panicT > 0 && !john.hidden ? CFG.PANIC_ID_MUL : 1;
  const rate = (john.hidden ? CFG.ID_UP_HIDDEN : CFG.ID_UP) * (1 + CFG.SCAN_STEP * lvl('scan')) * panicMul;
  let radioSeen = false;
  if (lvl('radio') > 0 && !john.seen){
    for (const c of copsList){
      if (c.down === 0 && coneLive(c) && inCone(c, c.coneAng, john.x, john.y - 6, coneR(), CFG.CONE_HALF)){ radioSeen = true; break; }
    }
  }
  if (john.seen){
    john.idP = Math.min(1, john.idP + rate);
    if (john.idP >= 1) revealJohn();
  } else if (radioSeen){
    john.idP = Math.min(1, john.idP + rate * CFG.RADIO_RATE);
    if (john.idP >= 1) revealJohn();
  } else {
    john.idP = Math.max(0, john.idP - CFG.ID_DOWN);
  }
}
// T-1000 round: movement sets crowd-shoving priority. Mall suspicion comes from actual contact in separate();
// other chapters keep the movement-based increase. Suspicion decays every tick.
function stepSuspicion(){
  const speed = Math.hypot(t1000.vx, t1000.vy);
  t1000.shover = t1000.moving && !t1000.frozen && speed > CFG.SUSP_SHOVE_SPD;
  // LIQUID SLIDE: a sliding T-1000 makes no suspicion from shoving.
  // Sprinting only raises suspicion while John is still disguised; SQUAD CAR KEYS (the siren) sprint is exempt.
  if (!mallT1000Balance() && t1000.shover && t1000.st !== 'slide' && john.revealT === 0 && G.keysT === 0) addSuspicion(CFG.SUSP_SHOVE);
  G.suspicion = Math.max(0, G.suspicion - suspDecay());
  // MIMIC: once suspicion climbs back to the engage level the T-800 may engage again.
  if (G.t800Hold && G.suspicion >= suspT800()) G.t800Hold = false;
  // T-1000 round: the meter is the T-800 AGGRESSION tier. Rising into HUNT or BERSERK announces it.
  if (G.role === 't1000'){
    const tier = aggroTier();
    if (tier > G.aggroTier){
      G.toastTxt = tier === 2 ? 'T-800 BERSERK' : 'T-800 HUNTING';
      G.toastT = CFG.TOAST_TICKS;
      sfx('alarm');
    }
    G.aggroTier = tier;
  }
}
// Suspicion decay for this heat stage: ALERT (stage 1) slows it to ALERT_DECAY, LOCKDOWN (stage 3) to LOCK_DECAY.
// COP SMILE: decay is CALM_STEP faster per level.
function suspDecay(){
  const calm = 1 + CFG.CALM_STEP * lvl('calm');
  if (G.heatStage === 1) return CFG.SUSP_DECAY * CFG.ALERT_DECAY * calm;
  if (G.heatStage >= 3) return CFG.SUSP_DECAY * CFG.LOCK_DECAY * calm;
  return CFG.SUSP_DECAY * calm;
}
// Suspicion needed for the T-800 to engage: lowered to SUSP_T800_LOCK in LOCKDOWN.
// SHARP EYES: the T-800 engages at SUSP_T800_SHARP at most.
function suspT800(){
  const base = G.heatStage >= 3 ? CFG.SUSP_T800_LOCK : CFG.SUSP_T800;
  return hasThreat('SHARP EYES') ? Math.min(base, CFG.SUSP_T800_SHARP) : base;
}
// T-1000 round: left click fires a pistol burst at the click, on a T1000_FIRE_CD cooldown. Each burst adds suspicion.
function t1000Fire(){
  if (t1000.fireCD > 0) t1000.fireCD--;
  if (t1000.stabCD > 0) t1000.stabCD--;
  if (!INPUT.clicks.length || t1000.frozen) return;
  if (!mallT1000Actionable()) return;
  const c = INPUT.clicks[INPUT.clicks.length - 1];
  // A click on a civilian stabs them (STAB_CD cooldown) and never fires a burst.
  const v = civilianAt(c.x, c.y);
  if (v){
    if (t1000.stabCD <= 0){ t1000.stabCD = CFG.STAB_CD; stabCivilian(v); alertMallT800(); }
    return;
  }
  if (t1000.fireCD > 0) return;
  t1000.fireCD = CFG.T1000_FIRE_CD;
  startBurst(t1000, c.x, c.y);
  addSuspicion(CFG.SUSP_BURST);
  alertMallT800();
}
// The standing shopper or cop within STAB_R of a click, or null. John, the T-800 and the T-1000 are never stabbed.
function civilianAt(x, y){
  for (const a of actors){
    if (a === john || a === t1000 || a === t800 || a.down > 0) continue;
    if (a.kind !== 'shopper' && a.kind !== 'cop') continue;
    if (dist(a.x, a.y - 10, x, y) <= CFG.STAB_R) return a;
  }
  return null;
}
// Stab: the civilian goes down (no blood), the kill adds to the run's KILLS and to T-800 aggression, and the crowd panics.
function stabCivilian(v){
  knockDown(v, true);
  G.run.kills++;
  addSuspicion(CFG.AGGRO_KILL);
  killPanic(v.x, v.y);
  sfx('blade');
  floatAt(v.x, v.y - 30, 'STAB', 'b');
}
// A kill's panic flush: shoppers and John within KILL_PANIC_R flee from the spot for PANIC_TICKS.
function killPanic(x, y){
  for (const a of actors){
    if (a.kind !== 'shopper' && a !== john) continue;
    if (a.down > 0 || dist(a.x, a.y, x, y) > CFG.KILL_PANIC_R) continue;
    a.panicT = CFG.PANIC_TICKS; a.panicX = x; a.panicY = y;
  }
}
// Closest exit door to (x, y) (BERSERK: John's hustle target).
function nearestDoor(x, y){
  let best = DOORS[0], bd = Infinity;
  for (const d of DOORS){
    const dd = dist(d.x, d.y, x, y);
    if (dd < bd){ bd = dd; best = d; }
  }
  return best;
}
// T-1000 round win: TARGET ACQUIRED, the win bonus and 10 points per second left.
function winT1000(){
  G.winWhy = 'TARGET ACQUIRED';
  addScore('win', CFG.T1000_WIN_PTS);
  addScore('time', CFG.T1000_TIME_PTS * secondsLeft());
}
// T-1000 round: touching a REVEALED John (within T1000_TOUCH_R) or two hits on him while revealed wins.
function checkT1000Win(){
  if (G.winWhy || G.lossWhy) return;
  // BLADE ARM: touch-win range grows BLADE_STEP px per level.
  const touch = mallT1000Actionable() && john.revealT > 0 && dist(t1000.x, t1000.y, john.x, john.y) <= CFG.T1000_TOUCH_R + lvl('blade') * CFG.BLADE_STEP;
  if (touch || john.revealHits >= CFG.ID_REVEAL_HITS) winT1000();
}
// T-800 round: the Harley fires on click. Everything else goes through the hold-to-aim step.
function t800Fire(){
  if (!BS.on && G.role === 't800' && (t800.shoveWind > 0 || t800.shoveRecover > 0 || t800.shoveAimBlocked)){
    t800.firing = false; t800.aimHeld = false; t800.aiming = false; t800.aimCancel = true;
    if (!INPUT.held) t800.shoveAimBlocked = false;
    return;
  }
  if (t800.bike > 0){ if (INPUT.clicks.length && t800.stunT <= 0) fireShotgun(t800, t800.heading); return; }
  stepAimHold();
}
// HOLD TO AIM (shotgun and M79): a press shorter than AIM_TAP ticks is a tap. A longer hold plants the T-800 and shows the aim
// until release. Release fires at the cursor. Right-click or losing focus while held cancels. The minigun is not a hold weapon.
function stepAimHold(){
  const a = t800;
  const wasHeld = a.aimHeld;
  a.aimHeld = INPUT.held;
  if (INPUT.mouse){ a.aimX = INPUT.mouse.x; a.aimY = INPUT.mouse.y; }
  if (INPUT.held && !wasHeld){ a.aimT = 0; a.aiming = false; a.aimCancel = false; }
  if (INPUT.held && wasHeld){
    a.aimT++;
    // A right-click during the hold cancels the aim (and does not spend the special, see stepSpecial).
    if (INPUT.special.length || INPUT.keys.includes('blur')) a.aimCancel = true;
    a.aiming = !a.aimCancel && a.aimT >= CFG.AIM_TAP && a.weapon !== 'minigun' && a.aimX !== undefined;
    return;
  }
  if (!INPUT.held && wasHeld){
    const fire = !a.aimCancel && a.stunT <= 0 && a.bike <= 0 && a.aimX !== undefined && a.weapon !== 'minigun';
    a.aiming = false; a.aimCancel = false;
    if (fire) fireAimed({x: a.aimX, y: a.aimY});
  }
}
// Fire the held weapon at c: the M79 lobs while it has ammo, otherwise the shotgun slug.
function fireAimed(c){
  if (BS.on){ bossFireAimed(c); return; }
  if (t800.weapon === 'm79' && t800.ammo > 0){ throwGrenade(c); return; }
  fireSlug(c.x, c.y);
}
// ===== T-800 SLUG =====
// The T-800 player's revealed T-1000 within AIM_SNAP of the cursor, or null. Only a revealed or stalking T-1000 snaps.
function snapTarget(tx, ty){
  if (!t1000 || !revealedOrStalking() || !t1000Hittable(t1000)) return null;
  return dist(tx, ty, t1000.x, t1000.y - 10) <= CFG.AIM_SNAP ? t1000 : null;
}
// Slug ray from the T-800's chest toward (tx, ty), snapped to a revealed T-1000 when one is close.
// Returns {a, ang, d, snapped}: a is the first hittable body whose centre lies within SLUG_W of the ray (John, down bodies,
// frozen, puddle and sliding T-1000 are skipped), d its distance, or SLUG_RANGE when nothing is hit.
function slugRay(tx, ty){
  const ox = t800.x, oy = t800.y - 10;
  const snap = snapTarget(tx, ty);
  const ang = snap ? Math.atan2(snap.y - 10 - oy, snap.x - ox) : Math.atan2(ty - oy, tx - ox);
  const ux = Math.cos(ang), uy = Math.sin(ang);
  let best = null, bestD = CFG.SLUG_RANGE;
  for (const a of actors){
    if (a === t800 || a === john || a.down > 0) continue;
    if (a === t1000 ? !t1000Hittable(a) : a.kind === 't800') continue;
    const px = a.x - ox, py = (a.y - 10) - oy;
    const along = px * ux + py * uy;
    if (along <= 0 || along >= bestD) continue;
    if (Math.abs(px * uy - py * ux) > CFG.SLUG_W) continue;
    best = a; bestD = along;
  }
  return {a: best, ang, d: bestD, snapped: !!snap};
}
// Player T-800 shot: one shell, one slug. A T-1000 hit splashes it; a shopper or cop hit is knocked down and is a strike.
function fireSlug(tx, ty){
  const a = t800;
  if (a.shells <= 0) return;
  a.shells--;
  if (a.shells === 0) a.reload = Math.max(1, Math.round(CFG.SHOT_RELOAD * reloadMul(a)));
  const r = slugRay(tx, ty);
  shotFlashes.push({x: a.x, y: a.y - 10, ang: r.ang, len: r.d, t: CFG.SHOT_FLASH});
  sfx('shotgun');
  gunshot(a.x, a.y);
  if (!r.a){ sfx('ricochet'); return; }
  if (r.a === t1000){ splashT1000(); return; }
  if ((r.a.kind === 'shopper' || r.a.kind === 'cop') && r.a.down === 0){ knockDown(r.a); civilianHit(); }
}
// Aim preview (only while a hold is planted, see stepAimHold): a dotted line from the T-800 to the first body the slug would hit,
// or full range. Chrome with a 7x7 bracket on a T-1000 (the bracket blinks on an assisted snap), red on a cop or shopper, grey on nothing.
function drawAim(){
  if (G.role !== 't800' || G.state !== 'play' || !t800.aiming || t800.bike > 0 || t800.weapon) return;
  const r = slugRay(t800.aimX, t800.aimY);
  const col = !r.a ? '3' : r.a === t1000 ? '1' : 'b';
  const ux = Math.cos(r.ang), uy = Math.sin(r.ang);
  // Black pixel under every dot first, so the coloured dots read over any floor or sign.
  for (let s = 0; s < r.d; s += CFG.AIM_DOT) fillBox(Math.round(t800.x + ux * s), Math.round(t800.y - 10 + uy * s) + 1, 1, 1, '0');
  for (let s = 0; s < r.d; s += CFG.AIM_DOT) fillBox(Math.round(t800.x + ux * s), Math.round(t800.y - 10 + uy * s), 1, 1, col);
  if (r.a === t1000){
    const blink = r.snapped && (((G.tick / CFG.ITEM_BLINK) | 0) % 2);
    if (!blink) frameBox(Math.round(t1000.x) - CFG.BRACKET_R, Math.round(t1000.y - 10) - CFG.BRACKET_R, 2 * CFG.BRACKET_R + 1, 2 * CFG.BRACKET_R + 1, '1');
  }
}
// M79 landing reticle: a circle of radius M79_R where the grenade lands (the cursor, within M79_RANGE), while the M79 is held with ammo.
function drawM79Reticle(){
  if (G.role !== 't800' || G.state !== 'play' || !INPUT.mouse || t800.weapon !== 'm79' || t800.ammo <= 0 || t800.bike > 0) return;
  const dx = INPUT.mouse.x - t800.x, dy = INPUT.mouse.y - t800.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, CFG.M79_RANGE / d);
  const cx = t800.x + dx * k, cy = clamp(t800.y + dy * k, CFG.FEET_MIN_Y, CFG.FEET_MAX_Y);
  for (let i = 0; i < 32; i++){ const a = i * Math.PI / 16; fillBox(Math.round(cx + Math.cos(a) * CFG.M79_R), Math.round(cy + Math.sin(a) * CFG.M79_R), 1, 1, '1'); }
}
// NO KILLING head: John's face (top of his sprite) in the top-right corner, shaking for NO_KILL_TICKS after a strike.
function drawJohnHead(){
  if (G.headT <= 0) return;
  const x = W - CFG.PORTRAIT_S - 4, y = 2, s = CFG.PORTRAIT_S;
  fillBox(x - 1, y - 1, s + 2, s + 2, '0');
  const shake = ((G.headT >> 2) & 1) ? 2 : -2;
  bctx.drawImage(sprite(johnDef(), 'down', 0, 0), 2, 0, s, s, x + shake, y, s, s);
}
// Q: a broad, non-damaging crowd shove. Its reach is independent of the AI's
// shorter defensive shove, and a disguised T-1000 is just another solid body.
function playerShoveTarget(b){
  return b !== t800 && !b.gone && b.down <= 0 && !b.riding &&
    (b !== t1000 || !['frozen','puddle','slide','reform'].includes(b.st));
}
function playerShoveClear(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, steps=Math.ceil(Math.hypot(dx,dy));
  for(let i=1;i<steps;i++) if(inSolid(a.x+dx*i/steps,a.y+dy*i/steps,0)) return false;
  return true;
}
function playerShoveHits(a,b){
  if(!playerShoveTarget(b)) return false;
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  return d<=CFG.PLAYER_SHOVE_R && playerShoveClear(a,b) &&
    (d<=CFG.PLAYER_SHOVE_CLOSE_R || (dx*a.shoveDX+dy*a.shoveDY)/d>=Math.cos(CFG.PLAYER_SHOVE_HALF));
}
// Briefly plant ordinary bodies after contact; this does not knock them down,
// hurt John, award combat points, or turn a shopper into a free splash target.
function stepCrowdShoveStun(a){
  if(!(a.shoveStunT>0)) return false;
  a.shoveStunT--; holdMallT800(a); return true;
}
function stepPunch(){
  const a=t800;
  if(a.shoveCD>0) a.shoveCD--;
  if(a.shoveRecover>0) a.shoveRecover--;
  if(a.shoveFxT>0) a.shoveFxT--;
  hintWhen('shove', a.bike<=0 && a.shoveCD<=0 && actors.some(b=>playerShoveTarget(b) && dist(a.x,a.y,b.x,b.y)<=CFG.PLAYER_SHOVE_R && playerShoveClear(a,b)), [['Q','SHOVE']], ()=>[a.x,a.y-34]);
  if(a.stunT>0 || a.bike>0){ a.shoveWind=0; return; }
  if(a.shoveWind>0){
    if(--a.shoveWind>0) return;
    // Collect first so moving a body cannot change which others get hit.
    const hits=actors.filter(b=>playerShoveHits(a,b));
    a.shoveCD=hits.length?CFG.PLAYER_SHOVE_CD:CFG.PLAYER_SHOVE_MISS_CD;
    a.shoveRecover=CFG.PLAYER_SHOVE_RECOVER;
    a.shoveFxT=CFG.PLAYER_SHOVE_FX; a.shoveHitN=hits.length;
    for(const b of hits){
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      crowdShoveBody(b,d>0?dx/d:a.shoveDX,d>0?dy/d:a.shoveDY,CFG.PLAYER_SHOVE_PX);
      if(b===t1000){
        b.stunT=Math.max(b.stunT,CFG.PLAYER_SHOVE_STUN);
        b.lungeWind=0; b.lungeDash=0; b.bladeWind=0; b.twinT=0;
        b.lungeCD=Math.max(b.lungeCD,CFG.T_LUNGE_CD/2);
        b.bladeCD=Math.max(b.bladeCD,CFG.PLAYER_SHOVE_CD);
      }else b.shoveStunT=Math.max(b.shoveStunT||0,CFG.PLAYER_SHOVE_CROWD_STUN);
      b.burstN=0; holdMallT800(b);
      floatAt(b.x-10,b.y-30,'SHOVED','d');
    }
    if(hits.length) sfx(hits.includes(t1000)?'clang':'bump');
    else floatAt(a.x-7,a.y-30,'MISS','3',24);
    return;
  }
  if(!hasKey('q')) return;
  if(a.shoveCD>0 || a.shoveRecover>0){ floatAt(a.x-7,a.y-30,'WAIT','3',18); return; }
  let dx=INPUT.mouse?INPUT.mouse.x-a.x:0,dy=INPUT.mouse?INPUT.mouse.y-(a.y-10):0;
  // A cursor over a nearby torso or feet aims at that body's ground position.
  // This avoids the old chest/feet mismatch when trying to shove someone above us.
  if(INPUT.mouse){
    let target=null,best=Infinity;
    for(const b of actors){
      if(!playerShoveTarget(b) || dist(a.x,a.y,b.x,b.y)>CFG.PLAYER_SHOVE_R || !playerShoveClear(a,b)) continue;
      const mx=INPUT.mouse.x-b.x,my=INPUT.mouse.y-b.y;
      if(Math.abs(mx)>9 || my < -24 || my>5) continue;
      const score=mx*mx+(my+10)*(my+10);
      if(score<best){ target=b;best=score; }
    }
    if(target){ dx=target.x-a.x;dy=target.y-a.y; }
  }
  const d=Math.hypot(dx,dy);
  a.shoveDX=d>1?dx/d:Math.cos(a.heading); a.shoveDY=d>1?dy/d:Math.sin(a.heading);
  a.shoveWind=CFG.PLAYER_SHOVE_WIND; a.shoveAimBlocked=true; a.shoveFxT=0; a.shoveHitN=0;
  a.aimHeld=false; a.aiming=false; a.aimCancel=true; a.firing=false;
  a.heading=Math.atan2(a.shoveDY,a.shoveDX); a.facing=a.shoveDY < -Math.abs(a.shoveDX)*0.5?'up':'down';
  holdMallT800(a); sfx('shove');
}
// Shared one-pixel sweep: knockback cannot tunnel through a planter or leave the floor.
function crowdShoveBody(a, ux, uy, pixels){
  for (let i = 0; i < pixels; i++){
    const nx = a.x + ux, ny = a.y + uy;
    if (nx < 8 || nx > W - 8 || ny < CFG.FEET_MIN_Y || ny > CFG.FEET_MAX_Y || inSolid(nx, ny, 2)) break;
    a.x = nx; a.y = ny;
  }
}
function drawCrowdShove(a){
  const ox=a.x,oy=a.y-10,player=G.role==='t800' && !BS.on;
  const reach=player?CFG.PLAYER_SHOVE_R:CFG.MALL_SHOVE_R;
  const col=player?(a.shoveWind>0?'d':a.shoveHitN>0?'1':'3'):'b';
  const extension=player && a.shoveWind<=0?14:8;
  for(const side of [-1,1]) fillBox(Math.round(ox+a.shoveDX*extension-a.shoveDY*side*4)-2,Math.round(oy+a.shoveDY*extension+a.shoveDX*side*4)-2,5,4,'d');
  if(player){
    const angle=Math.atan2(a.shoveDY,a.shoveDX);
    // A visible sweep shows both the generous reach and the active direction.
    for(let i=0;i<=24;i++){
      const theta=angle-CFG.PLAYER_SHOVE_HALF+2*CFG.PLAYER_SHOVE_HALF*i/24;
      fillBox(Math.round(ox+Math.cos(theta)*reach),Math.round(oy+Math.sin(theta)*reach),2,2,col);
    }
    if(a.shoveWind>0) for(let r=7;r<reach;r+=5) fillBox(Math.round(ox+a.shoveDX*r),Math.round(oy+a.shoveDY*r),2,2,col);
  }else for(let r=4;r<=reach;r+=3) fillBox(Math.round(ox+a.shoveDX*r),Math.round(oy+a.shoveDY*r),2,2,'b');
}
// T-800 round: the T-800's body keeps the T-1000 at least T800_BLOCK_R px away.
function pushT1000Out(){
  const ux = t1000.x - t800.x, uy = t1000.y - t800.y, d = Math.hypot(ux, uy);
  if (d >= CFG.T800_BLOCK_R) return;
  if (d < 0.01){ t1000.x = t800.x + CFG.T800_BLOCK_R; return; }
  const k = CFG.T800_BLOCK_R / d;
  t1000.x = t800.x + ux * k; t1000.y = t800.y + uy * k;
}
// T-800 round: while John is within T800_NEAR_R of the player he earns T800_NEAR_PTS per second.
function scoreNearJohn(){
  if (dist(john.x, john.y, t800.x, t800.y) <= CFG.T800_NEAR_R) addScore('near', CFG.T800_NEAR_PTS / 60);
}

// ===== T-1000 TOUGHNESS, SPEED, AND DROPS (4A-2) =====
// Chrome hole timer counts down (the hole is drawn on the sprite while it lasts).
function stepHoles(){ if (t1000.holeT > 0) t1000.holeT--; }
// The player's T-1000 walks at the mouse: a stagger stops it, a puddle is steered at PUDDLE_SPD with a trail,
// SQUAD CAR KEYS sprint at KEYS_SPD, a revealed John gets the T1000_SPRINT run, and otherwise T1000_PLAYER_SPD applies.
function steerT1000Player(){
  if (t1000.staggerT > 0){ t1000.staggerT--; t1000.moving = false; t1000.vx = 0; t1000.vy = 0; return; }
  if (t1000.st === 'puddle'){
    if (G.tick % CFG.PUDDLE_TRAIL_EVERY === 0){ (t1000.trail = t1000.trail || []).unshift({x: t1000.x, y: t1000.y}); if (t1000.trail.length > 3) t1000.trail.length = 3; }
    steerPlayer(t1000, CFG.PUDDLE_SPD * G.speedMul);
    return;
  }
  const base = G.keysT > 0 ? CFG.KEYS_SPD : (john.revealT > 0 ? CFG.T1000_SPRINT : CFG.T1000_PLAYER_SPD);
  steerPlayer(t1000, base * G.speedMul * (t1000.st === 'slide' ? CFG.SLIDE_SPD : 1));
}
// SQUAD CAR KEYS: the siren runs for KEYS_TICKS. Shoppers within KEYS_SHOVE_R of the T-1000 are shoved aside (no knockdowns).
function stepKeys(){
  if (G.keysT <= 0) return;
  G.keysT--;
  for (const a of actors){
    if (a.kind !== 'shopper' || a.down > 0) continue;
    const dx = a.x - t1000.x, dy = a.y - t1000.y, d = Math.hypot(dx, dy);
    if (d > CFG.KEYS_SHOVE_R || d < 0.01) continue;
    a.x += dx / d * CFG.KEYS_SPD; a.y += dy / d * CFG.KEYS_SPD;
  }
}
// Door drops: one timer, one drop on the floor at a time (T1K_DROP_MAX). The T-1000 takes a drop by walking over it, but only with no item held.
const T1K_KINDS = ['mega', 'keys', 'badge'];
const T1K_NAMES = {mega: 'MEGAPHONE', keys: 'SQUAD CAR KEYS', badge: 'BADGE'};
// Put a random drop at a random store door (no more than T1K_DROP_MAX on the floor).
function spawnT1kDrop(){
  if (t1kDrops.length >= CFG.T1K_DROP_MAX) return;
  const d = DOORS[rndInt(0, DOORS.length - 1)];
  t1kDrops.push({kind: T1K_KINDS[rndInt(0, T1K_KINDS.length - 1)], x: d.x, y: d.y + CFG.T1K_DROP_DY, age: 0, arm: true});
}
// Drop timer, blink, and walk-over pickup. Walking over a drop while holding one swaps them.
// A swapped-out item lands unarmed, so it is only taken again after the T-1000 steps off it.
function stepT1kDrops(){
  if (++G.t1kDropT >= CFG.T1K_DROP_TICK){ G.t1kDropT = 0; spawnT1kDrop(); }
  for (let i = t1kDrops.length - 1; i >= 0; i--){
    const p = t1kDrops[i];

    if (p.age >= CFG.DROP_LIFE_TICKS){ t1kDrops.splice(i, 1); continue; }
    if (dist(t1000.x, t1000.y, p.x, p.y) > CFG.PICK_R){ p.arm = true; continue; }
    if (!p.arm) continue;
    t1kDrops.splice(i, 1);
    const old = G.t1kItem;
    G.t1kItem = p.kind;
    if (old){ t1kDrops.push({kind: old, x: p.x, y: p.y, age: 0, arm: false}); }
    floatAt(t1000.x - 10, t1000.y - 34, T1K_NAMES[p.kind], 'd');

    onPickup(p.kind, p.x, p.y, G.t1kBig ? 'medium' : 'big');

  }
}
// E uses the held drop once. Each drop is single use.
function stepT1kUse(){
  if (!G.t1kItem || !hasKey('e')) return;

// MEGAPHONE: shoppers within MEGA_R run outward from the T-1000 for MEGA_TICKS. No suspicion. John is exposed if he is in that crowd.
function useMegaphone(){
  sfx('megaphone');

// SQUAD CAR KEYS: the siren starts a KEYS_TICKS sprint.
function useKeys(){

// BADGE: suspicion drops by BADGE_CUT at once, floored at zero.
function useBadge(){

// T-1000 round: you are the T-1000 disguised as a cop. Shoot to reveal John (ID), keep suspicion below SUSP_T800, and do not run out of forms.
MODES.t1000 = {
  setup(round){

    t1000.controlled = true; john.controlled = false;

    john.revealT = 0; john.revealHits = 0; john.idP = 0; john.seen = false;

    G.maxForms = CFG.T1000_FORMS;
    G.forms = G.maxForms; G.suspicion = 0; G.strikes = 0; G.exposure = 0; G.guardT = 0;
    G.slideCD = 0; G.t800Hold = false; t1000.slideT = 0;
    t1000.holeT = 0; t1000.staggerT = 0; t1000.disgKey = 'start'; t1000.hpLeft = t1000HpMax();

  },
  update(){

    stepKeys();

  },
  hud(){

    // T-800 AGGRESSION: green GUARD, yellow HUNT, red BERSERK; ticks mark the HUNT and BERSERK thresholds.
    text(bctx, 'T-800', 58, HUD_Y+4, 'b');

    meterBar(84, HUD_Y+4, 32, aggression / 100, ['f','d','b'][aggroTier()]);
    fillBox(84 + Math.round(32 * CFG.AGGRO_HUNT / 100), HUD_Y+2, 1, 9, '1');
    fillBox(84 + Math.round(32 * CFG.AGGRO_BERSERK / 100), HUD_Y+2, 1, 9, '1');
    text(bctx, 'LIVES', 120, HUD_Y+4, '1');
    for (let i = 0; i < G.maxForms; i++) fillBox(148 + i*5, HUD_Y+4, 4, 5, i < G.forms ? 'd' : '3');
  },
  checkEnd(){ return winLossResult('TARGET ACQUIRED'); },

// T-1000 round: a PORTRAIT_S square portrait of the current disguise in a black box at the top-right, YOU inside it on the left.
function drawT1kPortrait(){
  const s = CFG.PORTRAIT_S, bw = s + 16, bx = W - bw - 2, by = CFG.ITEM_Y, x = bx + 14, y = by + ((CFG.SLOT_H - s) >> 1);
  fillBox(bx, by, bw, CFG.SLOT_H, '0');
  frameBox(bx, by, bw, CFG.SLOT_H, '1');
  text(bctx, 'YOU', bx + 2, by + 9, '1');
  bctx.drawImage(sprite(t1000.d, 'down', 0, 0), 2, 0, s, s, x, y, s, s);
}
// The Harley lies on its side where it fell, for BIKE_FALL_TICKS.
function drawBikeProp(){
  if (!bikeProp) return;
  bctx.save();
  bctx.translate(Math.round(bikeProp.x), Math.round(bikeProp.y));
  bctx.rotate(bikeProp.ang + Math.PI / 2);
  bctx.drawImage(ICON('bikeSide'), -11, -11);
  bctx.restore();
}
// Harley heading: mostly vertical draws the narrow front/back view, otherwise the side view.
function bikeVertical(h){ return Math.abs(Math.sin(h)) > 0.7; }
// 12A MALL HARLEY: one baked composite per heading and rider set, so the riders are never two cropped sprites stacked.

// double (the T-800 with John or Sarah): right, up and down are the supervisor's grids, left is right flipped.
// solo (the T-800 alone): all procedural.

// Sarah's recolour of the DOUBLE grids: her hair '7' for John's gold '6' everywhere; inside these per-face boxes [x0, y0, x1, y1] (the passenger)
// her black tank ('2' becomes '0') and bare arms ('a' becomes '5'). Side row 15 is left out: it is the bike's chrome exhaust. Outside the boxes the bike's own pixels stay as drawn.
const SARAH_RIDE_BOXES = {right: [[0, 3, 9, 14], [0, 16, 9, 16]], up: [[0, 10, 17, 17]], down: []};
// A copy of a grid for the rider: unchanged for John, recoloured for Sarah.
function rideGrid(rows, face, sarah){
  if (!sarah) return rows;
  const boxes = SARAH_RIDE_BOXES[face];
  return rows.map((r, y) => [...r].map((ch, x) => {
    if (ch === '6') return '7';
    const inBox = boxes.some(([x0, y0, x1, y1]) => x >= x0 && x <= x1 && y >= y0 && y <= y1);
    if (inBox && ch === '2') return '0';
    if (inBox && ch === 'a') return '5';
    return ch;
  }).join(''));
}
// A canvas from grid rows of PAL keys, painted by the game's paint() helper with an identity role map.
const PAL_KEY_MAP = Object.fromEntries(Object.keys(PAL).map(k => [k, k]));
function gridCanvas(rows){
  const c = drainCanvas(rows[0].length, rows.length), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  paint(g, rows, PAL_KEY_MAP, 0, 0, false);
  return c;
}
function mallRideSet(){

function mallRide(heading, withJohn){

// A horizontal mirror of a canvas, for the left-facing side view.
function flipCanvas(src){

}
// One procedural 24x20 solo composite: side and up, and the down view. Draw order is back to front.

// Up (solo): the bike, then the T-800.
// Down (toward the camera): the T-800 alone.
function mallRiderCanvas(face){
  const c = drainCanvas(24, 20), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const t = sprite(CAST.t800, face, 0, false);
  if (face === 'right'){
    g.drawImage(ICON('bikeSide'), 1, 9);
    // The T-800 leans forward: the head band (rows 0 to 10) sits 2 px ahead of the body (rows 11 to 13).
    g.drawImage(t, 0, 0, 16, 11, 11, 0, 16, 11);
    g.drawImage(t, 0, 11, 16, 3, 9, 11, 16, 3);
    // The T-800's arm reaches from the shoulder to the bars.
    g.fillStyle = PAL['0'];
    g.fillRect(19, 12, 1, 1); g.fillRect(20, 11, 2, 1); g.fillRect(22, 10, 1, 1);

}

    const gx = Math.round(g.x0 + (g.x1 - g.x0) * f), gy = Math.round(g.y0 + (g.y1 - g.y0) * f);

    for (const i of [-3, 3]) fillBox(Math.round(b.x + ux * i), Math.round(b.y + uy * i), 1, 1, '0');

// ===== KEY CHIPS (10C) =====
Object.assign(CFG, {
  HINT_MAX: 3,                // contextual key-chip pulses per hint per stage; then the HUD carries it
  HINT_TICKS: 120,            // a pulse lasts two seconds (60 ticks a second)
  HINT_RAM_R: 56,             // the drain T-1000's RAM hint shows when John is this close
});
// A key chip: a 1-px outlined box around the key name, its text on row y. Returns the chip width so a label can follow it.
function keyChip(key, x, y, col){
  const c = col || 'd', w = textWidth(key) + 6;
  frameBox(x, y - 2, w, 9, c);
  text(bctx, key, x + 3, y, c);
  return w;
}
// A chip then its label on the same row (the label starts 3 px after the chip). Returns the x after the label.
function hudKey(key, label, x, y, col){
  const w = keyChip(key, x, y, col);
  if (!label) return x + w;
  text(bctx, label, x + w + 3, y, col || 'd');
  return x + w + 3 + textWidth(label);
}
// Width of a chip row: each part is a chip, then its label, with 6 px between parts.
function chipRowWidth(parts){
  return parts.reduce((s, p, i) => s + (i ? 6 : 0) + textWidth(p[0]) + 6 + (p[1] ? 3 + textWidth(p[1]) : 0), 0);
}
// A centred chip row: parts are [key, label] pairs, drawn at row y.
function chipRow(parts, cx, y, labelCol){
  let x = Math.round(cx - chipRowWidth(parts) / 2);
  parts.forEach((p, i) => {
    if (i) x += 6;
    const w = keyChip(p[0], x, y, 'd');
    if (p[1]) text(bctx, p[1], x + w + 3, y, labelCol || '1');
    x += w + (p[1] ? 3 + textWidth(p[1]) : 0);
  });
}
// Contextual prompt: a hint pulses near its actor up to CFG.HINT_MAX times per stage (G.hintN counts them), then the HUD carries it.
// hintWhen fires on the rising edge of a condition; hintFire is for one-off events. Both read and write G only in steps, never in render.
function hintFire(id, parts, fn){
  if ((G.hintN[id] || 0) >= CFG.HINT_MAX) return;
  G.hintN[id] = (G.hintN[id] || 0) + 1;
  G.hintPulse = {id, parts, fn, t: CFG.HINT_TICKS};
}
function hintWhen(id, on, parts, fn){
  if (on && !G.hintOn[id]) hintFire(id, parts, fn);
  G.hintOn[id] = on;
}
// Draws the live pulse (blinking every 4 ticks) above its actor. Render only: it reads G.hintPulse and never changes it.
function drawKeyHints(){
  const p = G.hintPulse;
  if (!p || p.t <= 0 || !((G.tick >> 2) & 1)) return;
  const at = p.fn(), half = chipRowWidth(p.parts) / 2;
  chipRow(p.parts, clamp(Math.round(at[0]), half + 2, W - half - 2), clamp(Math.round(at[1]), 12, H - 20), 'd');
}

// SELECT: three role panels with a walking sprite, goals, and each role's best score.
// SELECT GOALS: splits each goal line into words of at most 11 characters. Returns [text, isSecondGoal] pairs.
function selectGoalLines(info){
  const out = [];
  info.goal.forEach((g, gi) => {
    let cur = '';
    g.split(' ').forEach(w => {
      const next = cur ? cur + ' ' + w : w;
      if (cur && next.length > 11){ out.push([cur, gi]); cur = w; }
      else cur = next;
    });
    if (cur) out.push([cur, gi]);
  });
  return out;
}

// Draw the current screen. Rendering only reads state; it never changes it.
// RENDER GUARD: a throw in one screen's draw must not freeze the frame loop or leave a half-drawn canvas unexplained.
// The first error of each message logs its stack once; the bottom line shows the message in red.
let renderErr = null;
const renderErrSeen = new Set();
function guardDraw(fn){
  try { fn(); }
  catch (e){
    const msg = String((e && e.message) || e);
    renderErr = msg;
    if (!renderErrSeen.has(msg)){ renderErrSeen.add(msg); console.error(e && e.stack || msg); }
  }
}
function drawRenderErr(){
  if (!renderErr) return;
  fillBox(0, CFG.ERR_Y, W, 8, '0');
  text(bctx, ('ERR: ' + renderErr).slice(0, CFG.ERR_CHARS), 2, CFG.ERR_Y + 1, 'b');
}

  canvas.style.display = cinematic ? 'none' : 'block';

function renderScreen(){
  bctx.imageSmoothingEnabled = false;
  if (G.state === 'title') renderTitle();
  else if (G.state === 'select') renderSelect();
  else if (G.state === 'intro') renderIntro();
  else if (G.state === 'play') drawWorld();
  else if (G.state === 'result') renderResult();
  else if (G.state === 'death') renderDeath();
  else if (G.state === 'shop') renderShop();
  else if (G.state === 'map') renderMap();
  else if (G.state === 'bosscard') renderBossCard();
  else if (G.state === 'ending') renderEnding();
  else if (G.state === 'loopsel') renderLoopSel();
  else if (G.state === 'cutscene') renderCut();
  if (G.paused) renderPause();
  if (G.debug) drawDebug();
}
// Integer-scale the 256x176 canvas to the largest size that fits the window, centred by CSS.
function fitCanvas(){
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / W, window.innerHeight / H)));
  canvas.style.width = (W*s) + 'px';
  canvas.style.height = (H*s) + 'px';
  cinemaCanvas.style.width = (W*s) + 'px';
  cinemaCanvas.style.height = (H*s) + 'px';
}
// ===================== MAP, BOSS CARD AND ENDING (7A-1) =====================
// Map nodes in buffer pixels (the centre of each 8x8 icon). Chapter nodes carry their three round pips (stage indexes).
const MAP_NODES = [
  {name: 'THE GALLERIA', x: 44, y: 112, icon: 'map_bag', kind: 'chapter', ch: 0, pips: [0, 1, 2]},
  {name: 'THE STORM DRAIN', x: 96, y: 96, icon: 'map_truck', kind: 'boss', id: 'drain'},
  {name: 'PESCADERO', x: 148, y: 112, icon: 'map_cross', kind: 'chapter', ch: 1, pips: [4, 5, 6]},
  {name: 'THE STEEL MILL', x: 196, y: 84, icon: 'map_ladle', kind: 'boss', id: 'mill'},
  {name: 'NO FATE', x: 228, y: 40, icon: 'map_star', kind: 'end'},
];
// Map node index for a stage index: GALLERIA 0, STORM DRAIN 1, PESCADERO 2, STEEL MILL 3, NO FATE 4.
function mapNodeOfStage(s){ return s <= 2 ? 0 : s === 3 ? 1 : s <= 6 ? 2 : s === 7 ? 3 : 4; }
// Number of crowd rounds before stage index s.
function roundsBefore(s){ return STAGES.slice(0, s).filter(st => st.kind === 'round').length; }
// Progress count for the best store: stages passed across all loops (1-based, 8 per loop).
function progressOf(stage, loop){ return (loop - 1) * 8 + Math.min(stage + 1, 8); }
// Readable best: STAGE n in loop 1, LOOP l STAGE s after that.
function bestText(p){
  if (p < 1) return 'NONE';
  const loop = Math.floor((p - 1) / 8) + 1, s = ((p - 1) % 8) + 1;
  return loop > 1 ? 'LOOP ' + loop + ' STAGE ' + s : 'STAGE ' + s;
}
// Share of the run done, 0..100: whole stages passed, plus the crowd round's elapsed fraction (capped below the next stage).
function progressPct(){
  const crowd = STAGES[clamp(G.stage, 0, STAGES.length - 1)].kind === 'round';
  const partial = drainOn() ? drainFrac() : (crowd && G.timerMax > 0 ? clamp(1 - G.timer / G.timerMax, 0, 0.99) : 0);
  return Math.floor((clamp(G.stage, 0, 8) + partial) / 8 * 100);
}
// Best progress per role, kept in localStorage; returns the best including this run.
function bestProgressFor(role, p){
  const key = CFG.BEST_STAGE_PREFIX + role;
  let prev = 0;
  try { prev = parseInt(localStorage.getItem(key), 10) || 0; } catch (e) { /* storage blocked: best stays in memory */ }
  const best = Math.max(prev, p);
  try { localStorage.setItem(key, String(best)); } catch (e) { /* storage blocked */ }
  return best;
}
// Highest loop cleared per role, kept in localStorage.
function saveClear(role, loop){
  let prev = 0;
  try { prev = parseInt(localStorage.getItem(CFG.CLEAR_PREFIX + role), 10) || 0; } catch (e) { /* storage blocked */ }
  try { localStorage.setItem(CFG.CLEAR_PREFIX + role, String(Math.max(prev, loop))); } catch (e) { /* storage blocked */ }
}
// Pure hash for the map's dither and blocks (not rnd(), so the map looks the same on every visit).
function mapHash(x, y){ return ((Math.imul(x, 73856093) ^ Math.imul(y, 19349663)) >>> 0); }
// The map background, built once: ocean and coast on the left, tan land blocks with a dither, two freeways, the title band.
let MAP_BG = null;
function mapBg(){ if (!MAP_BG) MAP_BG = buildMapBg(); return MAP_BG; }
Object.assign(CFG, { MAP_CELL: 8, MAP_FWY_W: 4 });
// One freeway: a MAP_FWY_W px dark grey road ('4') with a dashed yellow centre line ('d'); x runs from x0 to x1 on the line to (x1, y1).
function freeway(g, x0, y0, x1, y1){
  for (let x = x0; x <= Math.min(x1, W - 1); x++){
    const y = Math.round(y0 + (x - x0) * (y1 - y0) / (x1 - x0));
    g.fillStyle = PAL['4']; g.fillRect(x, y - 1, 1, CFG.MAP_FWY_W);
    if ((x - x0) % 10 < 6) { g.fillStyle = PAL['d']; g.fillRect(x, y, 1, 1); }
  }
}
// Pixel box behind a node's name: the same rectangle textBacked() paints, plus a 1 px margin so dots stay clear of it.
function mapLabelBox(nd){
  const w = textWidth(nd.name), p = CFG.FLOAT_PAD + 1;
  return {x0: Math.round(nd.x - w/2) - p, x1: Math.round(nd.x - w/2) + w + p, y0: nd.y + 7 - p, y1: nd.y + 12 + p};
}
// One chapter pip: a 3x3 diamond in colour col (round at this size).
function mapPip(x, y, col){
  fillBox(x + 1, y, 1, 1, col); fillBox(x, y + 1, 3, 1, col); fillBox(x + 1, y + 2, 1, 1, col);
}
function buildMapBg(){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const put = (x, y, col) => { g.fillStyle = PAL[col]; g.fillRect(x, y, 1, 1); };
  for (let y = 0; y < H; y++){
    const coast = CFG.MAP_COAST_X + Math.round(CFG.MAP_COAST_SWAY * Math.sin(y / 11));
    for (let x = 0; x < W; x++){
      if (x < coast){
        if (x === coast - 1) put(x, y, '1');
        else put(x, y, x < CFG.MAP_WAVE_X && (x * 3 + y * 5) % 17 === 0 ? '8' : '9');
        continue;
      }
      put(x, y, '5');
    }
  }
  // Calm ground: at most one 3 px '6' dash per MAP_CELL cell, placed by hash, so the land reads as flat ground rather than static.
  for (let cy = 0; cy * CFG.MAP_CELL < H; cy++) for (let cx = 0; cx * CFG.MAP_CELL < W; cx++){
    const h = mapHash(cx, cy);
    if (h % CFG.MAP_SPECK_N !== 0) continue;
    const x = cx * CFG.MAP_CELL + ((h >> 8) % (CFG.MAP_CELL - 3)), y = cy * CFG.MAP_CELL + ((h >> 14) % CFG.MAP_CELL);
    if (x < CFG.MAP_COAST_X + CFG.MAP_COAST_SWAY + 2 || y >= H) continue;
    g.fillStyle = PAL['6']; g.fillRect(x, y, 3, 1);
  }
  // Two freeways, dark grey roads with a dashed yellow centre line; each runs between node areas.
  freeway(g, 64, 156, W, 148);
  freeway(g, 104, 20, W, 66);
  g.fillStyle = PAL['0']; g.fillRect(0, 0, W, 9);
  text(g, 'LOS ANGELES 1995', Math.round(W/2 - textWidth('LOS ANGELES 1995')/2), 2, '2');
  return c;
}
// Path between nodes: dots every MAP_DOT_STEP px. Cleared segments are '1', the one being walked blinks, the rest are '3'.
// Dots start and stop at the icon edge (MAP_NODE_R) and skip any name label they would run through.
function drawMapPath(){
  const blink = ((G.tick / CFG.MAP_BLINK) | 0) % 2 === 0;
  const boxes = MAP_NODES.map(mapLabelBox);
  for (let i = 0; i < MAP_NODES.length - 1; i++){
    const a = MAP_NODES[i], b = MAP_NODES[i + 1];
    const L = dist(a.x, a.y, b.x, b.y), ux = (b.x - a.x) / L, uy = (b.y - a.y) / L;
    const walking = G.mapPhase === 'walk' && G.mapFrom === i;
    const col = walking ? (blink ? 'd' : '3') : i < G.reach ? '1' : '3';
    for (let d = CFG.MAP_NODE_R; d <= L - CFG.MAP_NODE_R; d += CFG.MAP_DOT_STEP){
      const x = Math.round(a.x + ux * d), y = Math.round(a.y + uy * d);
      if (boxes.some(bx => x + 2 > bx.x0 && x < bx.x1 && y + 2 > bx.y0 && y < bx.y1)) continue;
      fillBox(x, y, 2, 2, col);
    }
  }
}
// Nodes: the icon, a red ring on reached nodes in loops, chapter pips, and the name under each (reached '1', red 'b' in loops).
function drawMapNodes(){
  MAP_NODES.forEach((nd, i) => {
    const reached = i <= G.reach;
    if (G.loop > 1 && reached) frameBox(nd.x - 6, nd.y - 6, 12, 12, 'b');
    bctx.drawImage(ICON(nd.icon), nd.x - 4, nd.y - 4);
    if (nd.pips){
      // One horizontal row of pips centred under the name (5 px pitch), on a black backing so they read on the tan land.
      // Round grey '3' until the stage is cleared, then round 'f'.
      const n = nd.pips.length, x0 = nd.x - Math.floor((5 * n - 2) / 2), y0 = nd.y + 14;
      fillBox(x0 - 1, y0 - 1, 5 * n, 5, '0');
      nd.pips.forEach((s, p) => mapPip(x0 + p * 5, y0, G.done[s] ? 'f' : '3'));
    }
    const col = reached ? (G.loop > 1 ? 'b' : '1') : '3';
    textBacked(nd.name, Math.round(nd.x - textWidth(nd.name)/2), nd.y + 7, col, false);
  });
}
// The walker: the role sprite walking the path, or standing on the node it last reached.
function drawMapWalker(){
  const info = roleInfo();
  if (!info) return;
  let x, y, walk = [0, 0];
  if (G.mapPhase === 'walk'){
    const a = MAP_NODES[G.mapFrom], b = MAP_NODES[G.mapTo];
    const t = clamp(G.mapT / CFG.MAP_WALK_TICKS, 0, 1);
    x = a.x + (b.x - a.x) * t; y = a.y + (b.y - a.y) * t;
    walk = CYCLE[(G.tick >> 3) & 3];
  } else {
    const nd = MAP_NODES[G.mapAt];
    x = nd.x; y = nd.y;
  }
  bctx.drawImage(gearedSprite(info.d, 'down', walk[0], walk[1], info.role, !!info.sarah), Math.round(x) - 8, Math.round(y) - 20);
}
// LOOP badge, top right, from loop 2 on.
function drawLoopBadge(){
  fillBox(W - 30, 2, 26, 10, 'a');
  textCentered('LOOP ' + G.loop, W - 17, 4, '1');
}
// Card text for the node the walker stands on. Loop starts add the loop number to the small line.
function mapCardText(){
  const nd = MAP_NODES[G.mapAt], pre = G.loop > 1 ? 'LOOP ' + G.loop + ' - ' : '';
  if (nd.kind === 'chapter') return {small: pre + 'CHAPTER ' + (nd.ch + 1), big: CHAPTERS[nd.ch].name};
  if (nd.kind === 'boss') return {small: pre + 'BOSS ' + (nd.id === 'drain' ? 1 : 2), big: nd.name};
  return {small: pre + 'THE END', big: nd.name};
}
// Card band after a walk: a top rule, the small and big names, then a blinking CLICK TO CONTINUE.
function drawMapCard(){
  const c = mapCardText(), y0 = CFG.MAP_CARD_Y;
  fillBox(0, y0, W, H - y0, '0');
  fillBox(0, y0, W, 1, '2');
  textCentered(c.small, W/2, y0 + 3, '2');
  bigCentered(c.big, W/2, y0 + 11, '1', '2');
  // On for MAP_PROMPT_ON of every MAP_PROMPT_CYCLE blink steps (70% on-time), so it is readable most of the time.
  if ((((G.tick / CFG.MAP_BLINK) | 0) % CFG.MAP_PROMPT_CYCLE) < CFG.MAP_PROMPT_ON) textCentered('CLICK TO CONTINUE', W/2, H - 8, '1');
}
// MAP: background, path, nodes, walker, then the card once the walk is over.
function renderMap(){
  bctx.drawImage(mapBg(), 0, 0);
  drawMapPath();
  drawMapNodes();
  drawMapWalker();
  if (G.loop > 1) drawLoopBadge();
  if (G.mapPhase === 'card') drawMapCard();
}
// Enter the MAP: walk from node `from` to node `to`, then show the card and go on to `next` ('intro', 'boss' or 'ending').
// from -1 means no walk: the walker starts on `to`, which is the run start or a loop start.
function enterMap(from, to, next){
  G.state = 'map'; G.mapFrom = from; G.mapTo = to; G.mapNext = next; G.mapT = 0;
  // Every stage starts with its hint pulses fresh.
  G.hintN = {}; G.hintOn = {}; G.hintPulse = null;
  G.mapPhase = from < 0 ? 'card' : 'walk';
  G.mapAt = from < 0 ? to : from;
  if (from < 0) G.reach = Math.max(G.reach, to);
  G.paused = false;
}
// The walk is over: the walker stands on the node it reached, and that node counts as reached.
function finishWalk(){
  G.mapPhase = 'card'; G.mapAt = G.mapTo; G.reach = Math.max(G.reach, G.mapTo); G.mapT = 0;
}
// Leave the map for the screen it leads to.
function continueFromMap(){
  if (G.mapNext === 'boss') enterBossCard();
  else if (G.mapNext === 'ending') enterEnding();
  else startIntro();
}
// MAP step: the walk runs on its own; Enter or a click skips it, and a second press continues.
function stepMap(){
  const press = INPUT.clicks.length > 0 || hasKey('enter');
  if (G.mapPhase === 'walk'){
    G.mapT++;
    if (G.mapT >= CFG.MAP_WALK_TICKS || press) finishWalk();
    return;
  }
  if (press) continueFromMap();
}
// After a win and its shop: move to the next stage. Round stages set the round number. A new node walks the map first.
function advanceStage(){
  const from = mapNodeOfStage(G.stage);
  G.stage++;
  if (G.stage >= STAGES.length){ enterMap(from, mapNodeOfStage(G.stage), 'ending'); return; }
  const st = STAGES[G.stage];
  G.round = roundsBefore(G.stage) + (st.kind === 'round' ? 1 : 0) + 6 * loopN();
  const to = mapNodeOfStage(G.stage);
  if (to !== from) enterMap(from, to, st.kind === 'boss' ? 'boss' : 'intro');
  else if (st.kind === 'boss') enterBossCard();
  else startIntro();
}
// BOSS CARD: placeholder until the boss ships (7B, 7C). Counts as a win and goes to the shop after BOSS_CARD_TICKS.
function enterBossCard(){
  // The Steel Mill fight (T-800 role) skips the placeholder card and goes straight to its intro.
  if (millActive() || drainActive()){ G.cashGot = 0; G.paused = false; startCut(millActive() ? 'millIn' : 'drainIn', startIntro); return; }
  G.state = 'bosscard'; G.bossT = 0; G.mode = 'boss'; G.bossId = STAGES[G.stage].id; G.cashGot = 0; G.paused = false;
}
// BOSS CARD step: the timer runs out and the stage is done.
function stepBossCard(){
  G.bossT++;
  if (G.bossT < CFG.BOSS_CARD_TICKS) return;
  G.done[G.stage] = true;
  openShop();
}
// BOSS CARD render: the boss name on black.
function renderBossCard(){
  fillBox(0, 0, W, H, '0');
  textCentered('BOSS ' + (G.bossId === 'drain' ? 1 : 2), W/2, 60, '2');
  bigCentered(G.bossId === 'drain' ? 'THE STORM DRAIN' : 'THE STEEL MILL', W/2, 74, '1', '2');
  textCentered('COMING SOON', W/2, 104, 'd');
}
// ENDING: the run after the BOSS 2 shop and the walk to NO FATE. The death-card record is built here so S and X work.
function enterEnding(){ startCut('farewell', finishEnding); }
function finishEnding(){
  G.state = 'ending'; G.endT = 0; G.paused = false; G.cashGot = 0;
  G.cardMsg = ''; G.cardMsgT = 0;
  G.best[bestKey()] = Math.max(G.best[bestKey()] || 0, Math.floor(G.score));
  saveBest();
  saveClear(G.role, G.loop);
  // The NO FATE ending unlocks Sarah; the first unlock shows NEW FIGHTER on this ending.
  const wasSarah = sarahUnlocked();
  G.sarahNew = !wasSarah;
  // The reveal card shows once: only when this ending is the first unlock.
  G.sarahRevealed = wasSarah;
  if (!wasSarah) saveSarahUnlock();
  // The ?ending=1 debug route enters the ending before any map (so no actor yet); guard that case.
  const ownA = ownActor(), own = ownA ? ownA.d : null;
  G.death = {
    why: 'CLEARED', role: G.role, round: G.round, score: Math.floor(G.score), x: 0, y: 0,
    ownD: own, killer: null, killerD: own, secs: 0, strikes: G.strikes, maxForms: G.maxForms,
    forms: G.run.forms, kills: G.run.kills, seed: G.runSeed, runNo: nextRunNo(),
    bestP: bestProgressFor(G.role, progressOf(8, G.loop)), stage: 8, loop: G.loop, pct: 100, theme: stageTheme(), cleared: true,
  };
}
// ENDING step: keys act once the prompts are up. ENTER and M open LOOP SELECT, S and X share the card.
function stepEnding(){
  G.endT++;
  if (G.cardMsgT > 0) G.cardMsgT--;
  if (G.endT < CFG.END_PROMPT_TICKS) return;
  if (hasKey('m')){ enterLoopSel(); return; }
  if (hasKey('s')){ savePng(); return; }
  if (hasKey('x')){ copyCardText(); return; }
  if (INPUT.clicks.length || hasKey('enter')) enterLoopSel();
}
// ENTER on the ending: the next loop starts at R1 with the LOOP badge. Cash, upgrades and score carry over; SPECIAL refills.
function startNextLoop(){
  G.loop++; G.stage = 0; G.round = 1 + 6 * loopN(); G.mode = 'crowd';
  G.death = null; G.endT = 0; G.nextThreat = '';
  for (let i = 0; i < CFG.LOOP_THREATS; i++){ const t = pickThreat(); G.threats.push(t); G.newThreat = t; }
  G.special = CFG.SPECIAL_MAX;
  enterMap(-1, 0, 'intro');
}
// LOOP SELECT (10C): opened from the ending by ENTER or M. The Sarah reveal card comes first, and only on the save where she unlocks.
function enterLoopSel(){
  G.state = 'loopsel'; G.hover = loopRoleIndex(); G.revealSarah = !!G.sarahNew && !G.sarahRevealed;
}
// Index of the card for the current role in ROLE_INFO (Sarah's card is the John role with sarah set).
function loopRoleIndex(){ return ROLE_INFO.findIndex(r => r.role === G.role && !!r.sarah === !!G.sarah); }
// True when card i can be picked: Sarah's card needs her unlock.
function loopCardOk(i){ const info = ROLE_INFO[i]; return !!info && !(info.sarah && !sarahUnlocked()); }
// Cash a role switch refunds: every upgrade paid for this run, role upgrade tiers included, at 100%.
function switchRefund(){ return G.upPaid || 0; }
// Pick a card. The same role carries on exactly as before. A different role refunds the upgrades as cash and clears them; score, cash, loop and threats stay, and SPECIAL refills in startNextLoop.
function chooseLoopRole(i){
  if (!loopCardOk(i)) return;
  const info = ROLE_INFO[i];
  if (i !== loopRoleIndex()){
    sfx({john: 'selJohn', t800: 'selT800', t1000: 'selT1000'}[info.role]);
    if (info.role === G.role){ G.sarah = !!info.sarah; }
    else {
      const refund = switchRefund();
      G.cash += refund; G.upPaid = 0; G.up = {};
      G.role = info.role; G.sarah = !!info.sarah;
      if (refund > 0){ G.toastTxt = 'REFUND +$' + refund; G.toastT = CFG.TOAST_TICKS; }
    }
  }
  startNextLoop();
}
// LOOP SELECT step: the reveal card closes on ENTER or a click. Then hover highlights a card; a click or keys 1 to 4 pick it, and ENTER picks the highlighted one.
function stepLoopSel(){
  if (G.revealSarah){
    if (INPUT.clicks.length || hasKey('enter')){ G.revealSarah = false; G.sarahRevealed = true; }
    return;
  }
  const prev = G.hover;
  if (INPUT.mouse){ const h = panelAt(INPUT.mouse.x, INPUT.mouse.y); if (h >= 0) G.hover = h; }
  if (G.hover >= 0 && G.hover !== prev) sfx('hover');
  for (const c of INPUT.clicks){ const i = panelAt(c.x, c.y); if (i >= 0){ chooseLoopRole(i); return; } }
  for (const k of ['1','2','3','4']){ if (hasKey(k)){ chooseLoopRole(+k - 1); return; } }
  if (hasKey('enter')) chooseLoopRole(G.hover >= 0 ? G.hover : loopRoleIndex());
}
// LOOP SELECT render: title, one card per unlocked character (NEW! on Sarah on the first unlock), and the hover line with the REFUND.

// The completion card continues the cinematic night road at full resolution.
function renderEnding(){

// ===================== STATE MACHINE =====================
// Screens: select -> intro -> play -> result. Every role runs the same path.
// True if the key was pressed this step.
function hasKey(k){ return INPUT.keys.indexOf(k) >= 0; }
// Index of the role panel under buffer point (x,y), or -1.
function panelAt(x, y){
  for (let i=0;i<ROLE_INFO.length;i++){
    const px = 8 + i*62;
    if (x >= px && x < px+58 && y >= 40 && y < 140) return i;
  }
  return -1;
}
// Back to SELECT with a fresh John-first state.
function goSelect(){
  BS.on = false;

}
// Run seed: ?seed=N if given, else a fresh 16-bit value. This is the only platform-random draw; the rest goes through rnd().
function pickRunSeed(){
  G.runSeed = CFG.SEED !== null ? CFG.SEED : Math.floor(Math.random() * 65536);
  reseed(G.runSeed);
}
// Start a fresh run in the chosen role, reseeded so every run is reproducible.
function pickRole(i){
  const info = ROLE_INFO[i];
  if (!info || (info.sarah && !sarahUnlocked())) return;

  G.role = info.role; G.sarah = !!info.sarah; G.round = 1; G.score = 0; G.run = newRun(); G.death = null;
  // A new run starts with no cash, upgrades or threats, and at the start of the campaign.
  G.cash = 0; G.up = {}; G.upPaid = 0; G.threats = []; G.newThreat = ''; G.nextThreat = '';
  G.special = CFG.SPECIAL_MAX; G.doubleTake = false;
  resetCampaign();
  pickRunSeed();
  applyDebugRun();

  if (!G.run.galleriaSeen && !debugRoute()){ G.run.galleriaSeen = true; startCut('galleriaIn', routeStart); }

// True for the debug starts that jump past the opening (ending, map, stage or round). ?galleria=0 also skips the prologue, for the test harnesses.
function debugRoute(){ return !!(CFG.DEBUG_ENDING || CFG.DEBUG_MAP || CFG.DEBUG_STAGE > 0 || CFG.DEBUG_ROUND > 1 || new URLSearchParams(location.search).get('galleria') === '0'); }
// Campaign state back to the first stage of loop 1. Kept: the best and cleared records in storage.
function resetCampaign(){
  G.stage = 0; G.loop = 1; G.mode = 'crowd'; G.done = {}; G.reach = 0; G.round = 1;
  G.mapAt = -1; G.mapT = 0; G.mapPhase = 'walk'; G.mapNext = 'intro';

// Debug params: ?stage=N, ?boss=mill|drain, ?loop=N, ?round=N (old R-number, mapped to its stage), ?cash=N, ?ending=1, ?map=1.
function applyDebugRun(){
  if (CFG.DEBUG_CASH > 0) G.cash = CFG.DEBUG_CASH;
  if (CFG.DEBUG_LOOP > 1) G.loop = CFG.DEBUG_LOOP;
  G.round = 1 + 6 * loopN();
  if (CFG.DEBUG_ROUND > 1){
    G.loop = Math.floor((CFG.DEBUG_ROUND - 1) / 6) + 1;
    G.stage = [0, 1, 2, 4, 5, 6][(CFG.DEBUG_ROUND - 1) % 6];
    G.round = CFG.DEBUG_ROUND;
  } else if (CFG.DEBUG_STAGE > 0){
    G.stage = CFG.DEBUG_STAGE - 1;
  } else if (CFG.DEBUG_MAP){
    G.stage = 4; G.round = 4;
  } else if (CFG.DEBUG_ENDING){
    G.stage = 8; G.round = 6 + 6 * loopN();
  }
  if (CFG.DEBUG_ROUND <= 1 && G.stage > 0 && G.stage < 8){
    G.round = roundsBefore(G.stage) + (STAGES[G.stage].kind === 'round' ? 1 : 0) + 6 * loopN();
  }
  for (let s = 0; s < Math.min(G.stage, 8); s++) G.done[s] = true;
  if (CFG.DEBUG_ENDING) for (let s = 0; s < 8; s++) G.done[s] = true;
  G.reach = G.stage >= 8 ? 4 : mapNodeOfStage(G.stage);
  if (CFG.DEBUG_MAP) G.reach = 1;
  for (let i = 0; i < G.round - 1; i++) G.threats.push(pickThreat());
}
// Where the run starts: the ending, the walk to PESCADERO, a debug stage, or the map from the first node.
function routeStart(){
  if (CFG.DEBUG_ENDING){ enterEnding(); return; }
  if (CFG.DEBUG_MAP){ enterMap(1, 2, 'intro'); return; }
  if (CFG.DEBUG_STAGE > 0 || CFG.DEBUG_ROUND > 1){
    if (STAGES[G.stage].kind === 'boss') enterBossCard(); else startIntro();
    return;
  }
  enterMap(-1, 0, 'intro');
}
// Set up the current round and enter INTRO.
function startIntro(){
  G.state = 'intro'; G.introT = 0; G.lossWhy = ''; G.winWhy = ''; G.outcome = null; G.mode = 'crowd';
  G.lossAt = null; G.lossKiller = null; G.runPrev = null;
  G.grace = CFG.GRACE_TICKS;
  G.heatStage = 0; G.heatFrac = 0; G.bannerT = 0; G.bannerTxt = ''; G.evacT = 0; G.roundT = 0; G.pickupN = 0;
  // Per-round upgrade state: FIRE ALARM and GAME BOY reset, LIQUID SLIDE cooldown clears, MIMIC hold lifts.
  G.alarmUsed = false; G.alarmT = 0; G.decoy = null; G.slideCD = 0; G.t800Hold = false;
  // Pass 6 specials: box, lure and flash end with the round.
  G.boxT = 0; G.boxGrace = 0; G.lureT = 0; G.specialFlashT = 0; G.toastT = 0;
  // John's item selection starts on GAME BOY when owned, else FIRE ALARM.
  G.itemSel = lvl('decoy') > 0 ? 'decoy' : 'alarm';
  G.roundStartScore = G.score;
  BS.on = millActive() || drainActive();
  BS.kind = drainActive() ? 'drain' : millActive() ? 'mill' : '';
  // Pass 9: every crowd round refills the charge to SPECIAL_MAX. DOUBLE TAKE adds one to the next round only.
  if (!BS.on) G.special = CFG.SPECIAL_MAX;
  if (G.doubleTake){ G.special++; G.doubleTake = false; }
  if (drainActive()){ drainSetup(); return; }
  if (BS.on){ millSetup(); return; }

// INTRO holds for INTRO_TICKS, then PLAY.
function stepIntro(){
  G.introT++;
  if (G.introT < (BS.on ? CFG.BOSS_INTRO_TICKS : CFG.INTRO_TICKS)) return;
  G.newThreat = '';
  G.state = 'play';
  sfx('ready');
}
// PLAY: one mode step (after the grace countdown), then check whether the round has ended.
function stepPlay(){
  const m = MODES[G.role];
  if (G.grace > 0) G.grace--;
  G.roundT++;
  if (drainOn()){ stepDrain(); return; }
  if (BS.on){ stepMill(); return; }
  // Run stats: metres John walked this run (his own movement, counted each step).
  if (G.runPrev) G.run.ran += Math.hypot(john.x - G.runPrev.x, john.y - G.runPrev.y) * CFG.RUN_M_PER_PX;
  G.runPrev = {x: john.x, y: john.y};
  // ?die=1 debug: end the round at DIE_AT with this role's natural cause, to check the death card.
  if (CFG.DIE_DEBUG && G.roundT === CFG.DIE_AT){
    // Fake a consistent cause first, so the stats and the epitaph agree: all forms gone, or the last strike.
    if (G.role === 't1000'){ G.forms = 0; G.run.forms = G.maxForms; loseRound('FROZEN', t1000, t800); }
    else if (G.role === 't800'){ G.strikes = strikeCap(); G.run.strikes = G.strikes; loseRound("JOHN'S RULE", john, john); }
    else loseRound(terminatedWhy(), john);
  }
  stepSpecial();
  stepHeat();
  m.update();
  const out = m.checkEnd();
  if (out) enterResult(out);
}
// Record the outcome, update this role's best score, and show RESULT.
function enterResult(out){
  if (!out.win){ enterDeath(out); return; }
  G.state = 'result'; G.outcome = out; G.paused = false;
  // CASH: points earned this round divided by CASH_DIV. Losses earn nothing.
  G.cashGot = out.win ? Math.max(0, Math.floor((G.score - G.roundStartScore) / CFG.CASH_DIV)) : 0;
  G.cash += G.cashGot;
  G.best[bestKey()] = Math.max(G.best[bestKey()] || 0, Math.floor(G.score));
  saveBest();
}
// RESULT (wins only; losses go to the death card): M goes to SELECT; click or Enter goes to the SHOP.
function stepResult(){
  if (hasKey('m')){ resultNext(goSelect); return; }
  if (!INPUT.clicks.length && !hasKey('enter')) return;
  resultNext(openShop);
}
// Leave the result card. An owed DRAIN OUT cutscene plays first, then the next screen runs.
function resultNext(next){
  if (!G.outPending){ next(); return; }
  G.outPending = false;
  startCut('drainOut', next);
}
// ===== SHOP =====
// Upgrade records for this role that are not yet at max level and not in the excluded keys.
function openUpgrades(exclude){
  return upList(G.role).filter(u => lvl(u.key) < u.max && !exclude.includes(u.key));
}
// Deal SHOP_OFFERS distinct upgrades, avoiding the cards on screen; the pool falls back to all open upgrades when short.
function dealOffers(){
  let pool = openUpgrades(G.shopOffers).map(u => u.key);
  if (pool.length < CFG.SHOP_OFFERS) pool = openUpgrades([]).map(u => u.key);
  const out = [];
  while (out.length < CFG.SHOP_OFFERS && pool.length) out.push(pool.splice((rnd() * pool.length) | 0, 1)[0]);
  return out;
}
// REROLL cost: REROLL_BASE, plus REROLL_STEP for each reroll already made in this shop.
function rerollCost(){ return CFG.REROLL_BASE + CFG.REROLL_STEP * G.shopRerolls; }
// Enter the SHOP after a win: fresh offers, and the threat that the next round will bring.
function openShop(){
  BS.on = false;
  G.state = 'shop'; G.shopT = 0; G.shopRerolls = 0; G.shopSold = {}; G.shopMsg = ''; G.shopHover = -1; G.shopBought = '';
  G.shopSpSold = false; G.shopDouble = false; G.buyFx = null;
  G.shopOffers = [];
  sfx('shop');
  G.shopOffers = dealOffers();
  // Threats only come with crowd rounds: no threat is rolled before a boss or NO FATE.
  const nx = STAGES[G.stage + 1];
  G.nextThreat = nx && nx.kind === 'round' ? pickThreat() : '';
}
// Buy the card in slot i. Each card is bought once per deal; SOLD and unaffordable cards do nothing.
function buyOffer(i){
  const key = G.shopOffers[i];
  const u = key ? upByKey(key) : null;
  if (!u || G.shopSold[key]) return;
  const price = upPrice(u);
  if (G.cash < price){ G.shopMsg = 'NOT ENOUGH CASH'; return; }
  const tierBefore = powerTier(G.role);
  G.cash -= price; G.upPaid += price; G.up[key] = lvl(key) + 1; G.shopSold[key] = true;
  G.shopMsg = u.name + ' LV ' + lvl(key);
  startBuyFx(u.name, tierBefore);
  if (u.use) G.shopBought = key;
}
// REROLL: three new offers for rerollCost(). A reroll clears SOLD marks and opens every card again.
function rerollOffers(){
  const cost = rerollCost();
  if (G.cash < cost){ G.shopMsg = 'NOT ENOUGH CASH'; return; }
  G.cash -= cost; G.shopRerolls++; G.shopSold = {};
  sfx('reroll');
  G.shopOffers = dealOffers();
  G.shopMsg = 'NEW OFFERS';
}
// Pass 9 special upgrades: each role's tier lives in G.up under its key. Three tiers, then the row hides.
const SPECIAL_UP = {john: {key: 'spBox', name: 'BIGGER BOX'}, t800: {key: 'spBike', name: 'NITRO HARLEY'}, t1000: {key: 'spLure', name: 'MIMIC MASTERY'}};
// The current role's upgrade key, its tier (0 to 3), and the price of its next tier.
// Sarah's shop row is her decoy upgrade, SURVIVALIST. It shares the shop card's key, so both feed one progression.
const SARAH_SPECIAL_UP = {key: 'survivalist', name: 'SURVIVALIST'};
function specialUp(){ return G.sarah && G.role === 'john' ? SARAH_SPECIAL_UP : SPECIAL_UP[G.role]; }
function roleUpKey(){ return specialUp().key; }
function roleUpTier(){ return lvl(roleUpKey()); }
function roleUpPrice(){ return CFG.SPECIAL_UP_PRICE[roleUpTier()]; }
// The role upgrade can be bought when a tier is left, this shop has not sold one, and cash covers the price.
function roleUpOk(){ return roleUpTier() < CFG.SPECIAL_UP_PRICE.length && !G.shopSpSold && G.cash >= roleUpPrice(); }
// Buy the next tier of the role's special upgrade. One per shop visit.
function buyRoleUp(){
  const tier = roleUpTier(), key = roleUpKey();
  if (tier >= CFG.SPECIAL_UP_PRICE.length) return;
  if (G.shopSpSold){ G.shopMsg = 'ONE PER SHOP'; return; }
  if (G.cash < roleUpPrice()){ G.shopMsg = 'NOT ENOUGH CASH'; return; }
  const paid = roleUpPrice();
  const tierBefore = powerTier(G.role);
  G.cash -= paid; G.upPaid += paid; G.up[key] = tier + 1; G.shopSpSold = true;
  G.shopMsg = specialUp().name + ' TIER ' + (tier + 1);
  startBuyFx(specialUp().name, tierBefore);
}
// DOUBLE TAKE: affordable, and not yet bought this shop or still pending for the next round.
function doubleOk(){ return !G.doubleTake && !G.shopDouble && G.cash >= CFG.DOUBLE_TAKE_PRICE; }
// DOUBLE TAKE buy: one per shop. The extra charge is added when the next round starts.
function buyDouble(){
  if (G.doubleTake || G.shopDouble){ G.shopMsg = 'ALREADY BOUGHT'; return; }
  if (G.cash < CFG.DOUBLE_TAKE_PRICE){ G.shopMsg = 'NOT ENOUGH CASH'; return; }
  G.cash -= CFG.DOUBLE_TAKE_PRICE; G.doubleTake = true; G.shopDouble = true;
  G.shopMsg = 'DOUBLE TAKE: 2 CHARGES NEXT ROUND';

// CONTINUE: the rolled threat joins the run (it shows on the next INTRO), then the next round starts.
function continueFromShop(){
  if (G.nextThreat){ G.threats.push(G.nextThreat); G.newThreat = G.nextThreat; }
  G.nextThreat = '';

    G.toastTxt = u.name + ' READY - ' + u.use; G.toastT = CFG.TOAST_TICKS;

  advanceStage();

// Card slot under buffer point (x,y), or -1.
function shopCardAt(x, y){
  for (let i = 0; i < CFG.SHOP_CARD_X.length; i++){
    const cx = CFG.SHOP_CARD_X[i], cy = cardY(i);
    if (x >= cx && x < cx + CFG.SHOP_CARD_W && y >= cy && y < cy + CFG.SHOP_CARD_H) return i;
  }
  return -1;
}
// Button under buffer point (x,y): 'double' or 'upgrade' (the buy row), 'reroll' (left), 'continue' (right), or ''.
function shopButtonAt(x, y){
  if (y >= CFG.BUY_ROW_Y && y < CFG.BUY_ROW_Y + CFG.BUY_ROW_H){
    if (x >= CFG.DOUBLE_X && x < CFG.DOUBLE_X + CFG.DOUBLE_W) return 'double';
    if (x >= CFG.UPGRADE_X && x < CFG.UPGRADE_X + CFG.UPGRADE_W) return 'upgrade';
  }
  if (y < CFG.SHOP_BTN_Y || y >= CFG.SHOP_BTN_Y + CFG.SHOP_BTN_H) return '';
  if (x >= CFG.SHOP_BTN_X && x < CFG.SHOP_BTN_X + CFG.SHOP_BTN_W) return 'reroll';
  if (x >= W - 6 - CFG.SHOP_BTN_W && x < W - 6) return 'continue';

// SHOP: clicks and keys 1/2/3 buy, R rerolls, Enter/C/Space continue.
function stepShop(){
  G.shopT++;
  stepBuyFx();
  if (INPUT.mouse) G.shopHover = shopCardAt(INPUT.mouse.x, INPUT.mouse.y);
  for (const c of INPUT.clicks){
    const i = shopCardAt(c.x, c.y);
    if (i >= 0){ buyOffer(i); continue; }
    const b = shopButtonAt(c.x, c.y);
    if (b === 'reroll') rerollOffers();
    else if (b === 'double') buyDouble();
    else if (b === 'upgrade') buyRoleUp();
    else if (b === 'continue'){ continueFromShop(); return; }
  }
  for (const k of ['1','2','3']) if (hasKey(k)) buyOffer(+k - 1);
  if (hasKey('r')) rerollOffers();
  if (hasKey('s')) buyRoleUp();

// SELECT: hover highlights a panel, a click or key 1/2/3 starts that role.
// True if a click landed on the speaker glyph in the SELECT corner.
function inSpeaker(c){ return c.x >= W - 18 && c.x < W - 2 && c.y >= 0 && c.y < 14; }
// SELECT: hover blips when the pointer enters a role card, a click or key picks the role, the speaker toggles sound.

function cr(g, x, y, w, h, col){ g.fillStyle = PAL[col]; g.fillRect(Math.round(x), Math.round(y), w, h); }
// A filled disc of radius r on context g.
function cutDisc(g, cx, cy, r, col){
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx*dx + dy*dy <= r*r) cr(g, cx + dx, cy + dy, 1, 1, col);
}
// Make an offscreen canvas of w by h, drawn by fn(g).
function cutCanvas(w, h, fn){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d')); return c;
}
// Sprite canvas, baked once under key.
function cutSpr(key, w, h, fn){ if (!CUT_SPR[key]) CUT_SPR[key] = cutCanvas(w, h, fn); return CUT_SPR[key]; }
// Full-screen background canvas, baked once under key.
function cutBg(key){ if (!CUT_BG[key]) CUT_BG[key] = cutCanvas(W, H, g => CUT_BGS[key](g)); return CUT_BG[key]; }
// Draw a baked in-game canvas at (x, y), scaled by s with hard pixels.
function cutImg(g, img, x, y, s){ g.drawImage(img, 0, 0, img.width, img.height, Math.round(x), Math.round(y), img.width * s, img.height * s); }
// Backgrounds: static art drawn once per scene panel.
// Channel wall edge: the sloped walls of the dry channel get wider toward the viewer.
function channelWall(y){ return Math.round(2 + (y - 84) * 0.42); }

// A ring (a steering-wheel rim) centred on (cx, cy), between radii r0 and r1, in colour col.
function cutRing(g, cx, cy, r0, r1, col){
  for (let dy = -r1; dy <= r1; dy++) for (let dx = -r1; dx <= r1; dx++){
    const d = dx * dx + dy * dy;
    if (d >= r0 * r0 && d <= r1 * r1) cr(g, cx + dx, cy + dy, 1, 1, col);
  }
}
// Copy src onto c, mirrored left to right.
function cutFlipInto(c, src){ c.save(); c.translate(src.width, 0); c.scale(-1, 1); c.drawImage(src, 0, 0); c.restore(); }
// The wide mill for the establishing pan: 360 px, furnace bands, roof girders and four vent stacks.
const MILL_W = 360;
function millWide(g){
  cr(g, 0, 0, MILL_W, H, '0');
  cr(g, 0, CUT_TOP, MILL_W, 40, 'a'); cr(g, 0, 60, MILL_W, 30, 'b'); cr(g, 0, 90, MILL_W, 30, 'c');
  cr(g, 0, 120, MILL_W, CUT_BOT - 120, '4'); cr(g, 0, 120, MILL_W, 2, '1');
  for (let x = 0; x < MILL_W; x += 24) cr(g, x, 40, 3, 18, '0');
  cr(g, 0, 40, MILL_W, 4, '4'); cr(g, 0, 100, MILL_W, 3, '4');
  for (const sx of [40, 150, 260, 330]){ cr(g, sx - 6, 36, 12, 88, '4'); cr(g, sx - 6, 36, 2, 88, '3'); cr(g, sx - 6, 36, 12, 3, '3'); }
}
// The wreck: the truck's rear and middle stay as they are, and its cab (the last 30 columns, the front) folds up against the pillar. Each cab column is squeezed and jolted up or down, and dark crush lines run through it.
function cutWreckInto(c, src){
  const w = src.width, h = src.height, k = w - 30;
  c.imageSmoothingEnabled = false;
  c.drawImage(src, 0, 0, k, h, 0, 0, k, h);
  for (let x = k; x < w; x++){
    const dx = k + Math.round((x - k) * 0.55), dy = (millHash(x, 1, 7) % 5) - 2;
    c.drawImage(src, x, 0, 1, h, dx, dy, 1, h);
  }
  c.fillStyle = PAL['0'];
  for (let y = 4; y < h - 4; y += 4) c.fillRect(k + 6 + (y % 3) * 3, y, 2, 1);
  c.fillStyle = PAL['3'];
  for (let y = 2; y < h - 2; y += 3) c.fillRect(k + 14 + (y % 4), y, 1, 2);
}
// One flame sprite, 12 by 18, on a red and orange base. The tongues differ by frame f (0 to 2), so the flame flickers.
function cutFlameInto(c, f){
  const hs = [[6, 10, 7, 9], [9, 5, 10, 6], [7, 8, 5, 10]][f];
  const cr2 = (x, y, w, h, col) => { c.fillStyle = PAL[col]; c.fillRect(x, y, w, h); };
  cr2(0, 14, 12, 4, 'b');
  for (let i = 0; i < 4; i++){
    cr2(i * 3, 18 - hs[i], 3, hs[i], 'c');
    cr2(i * 3 + 1, 18 - hs[i] + 2, 1, Math.max(0, hs[i] - 3), 'd');
  }
}
// Speaker portrait, 16 by 16.
function cutPortrait(g, who){
  if (who === 't1000'){
    // The in-game cop: navy cap with a black band and peak, dark hair under it, a pale face, a navy uniform and a gold badge.
    cr(g, 4, 1, 8, 3, '9'); cr(g, 4, 3, 8, 1, '0'); cr(g, 11, 3, 3, 1, '0');
    cr(g, 4, 4, 8, 7, '5'); cr(g, 4, 4, 8, 1, '7');
    cr(g, 2, 11, 12, 5, '9'); cr(g, 9, 11, 2, 2, 'd');
    cr(g, 6, 6, 1, 1, '0'); cr(g, 9, 6, 1, 1, '0');
    return;
  }
  cr(g, 4, 3, 8, 8, '5'); cr(g, 4, 1, 8, 3, who === 'john' ? '7' : '0');
  cr(g, 2, 11, 12, 5, '4');
  if (who === 'john'){ cr(g, 6, 6, 1, 1, '0'); cr(g, 9, 6, 1, 1, '0'); }
  else { cr(g, 6, 6, 2, 1, who === 't800' ? 'b' : '8'); cr(g, 9, 6, 1, 1, who === 't800' ? 'b' : '8'); }
}
// Animations: each draws one panel on g from its tick pt of n. Riders, trucks and the T-1000 and T-800 are the in-game sprites, scaled 2x (or 8x for the face close-ups). Visual noise uses millHash.
// Two scrolling layers: far posts move at a quarter of the speed of the near ground dashes (1 px a tick).
function cutPar(g, pt, farY, nearY){
  const fo = Math.floor(pt / 4) % 24;
  for (let x = -fo; x < W; x += 24) cr(g, x, farY, 2, 8, '3');
  const no = pt % 16;
  for (let x = -no; x < W; x += 16) cr(g, x, nearY, 6, 1, '2');
}
// Dust puffs trailing behind a moving vehicle at (x, y): three puffs that drift back and grow.
function cutDust(g, x, y, pt){
  for (let k = 0; k < 3; k++){
    const age = (pt + k * 5) % 15;
    cutDisc(g, Math.round(x - 4 - k * 7 - age * 0.3), Math.round(y - (k & 1) * 2 - age * 0.2), 1 + (age >> 3), k === 1 ? '3' : '2');
  }
}
// Windscreen lane dashes streaming under the glass (the drain-in cab panels).
function windscreenDashes(g, pt){
  const o = (pt * 2) % 16;
  for (let x = -o; x < W; x += 16) cr(g, x, 86, 8, 1, '2');
  for (let x = 8 - o; x < W; x += 16) cr(g, x, 102, 8, 1, '2');
}
// The cab front for the drain-in windscreen panels: black pillars down both edges, and a dark dashboard band across the bottom third (y 118 down) with a lit top edge and two gauge dials. Drawn over the bust, so the dash sits in front of the chest.
function cabFront(g){
  cr(g, 0, CUT_TOP, 14, CUT_BOT - CUT_TOP, '0'); cr(g, 242, CUT_TOP, 14, CUT_BOT - CUT_TOP, '0');
  cr(g, 14, CUT_TOP, 1, CUT_BOT - CUT_TOP, '3'); cr(g, 241, CUT_TOP, 1, CUT_BOT - CUT_TOP, '3');
  cr(g, 14, 118, 228, CUT_BOT - 118, '0'); cr(g, 14, 118, 228, 1, '3');
  cutDisc(g, 60, 136, 5, '4'); cutDisc(g, 60, 136, 2, '3'); cutDisc(g, 196, 136, 5, '4'); cutDisc(g, 196, 136, 2, '3');
}
// Molten metal across the bottom of the frame: wavy horizontal bands of d, c and b, drifting at CFG.CUT_MOLTEN_SPEED px a tick, with bright 1 pops.
function moltenInto(g, pt){
  for (let y = 120; y < CUT_BOT; y++){
    for (let x = 0; x < W; x += 4){
      const band = Math.floor((y + 2.5 * Math.sin((x - pt * CFG.CUT_MOLTEN_SPEED) * 0.08)) / 7);
      cr(g, x, y, 4, 1, ['d', 'c', 'b'][((band % 3) + 3) % 3]);
    }
  }
  for (let k = 0; k < 10; k++){
    if ((pt + k * 7) % 40 < 6) cr(g, millHash(k, 1, 2) % W, 124 + millHash(k, 3, 4) % 30, 2, 1, '1');
  }
}
// A bust drawn straight onto the frame, with no backdrop, at scale s.

  const holding = !!(INPUT.down.enter || INPUT.down.escape);
  c.hold = holding ? c.hold + 1 : 0;
  const press = INPUT.clicks.length > 0 || hasKey('enter') || hasKey('escape');
  if (c.hold >= CFG.CUT_HOLD_SKIP || (press && c.seen)){ endCut(); return; }
  c.pt++;
  for (const [tick, sound] of panel.events || []) if (c.pt === tick) sfx(sound);

// Embedded portraits: no network fetches or external asset dependencies. Decode once
// before starting the loop so a scene never caches a partially loaded image.
const CINE_PORTRAITS = {}, CINE_PORTRAIT_ERRORS = [];
const CINE_PORTRAIT_READY = Promise.all(Object.entries(CINE_PORTRAIT_DATA).map(([key,src]) => new Promise(resolve => {
  const img = new Image();
  img.onload = () => { CINE_PORTRAITS[key] = img; resolve(); };
  img.onerror = () => { CINE_PORTRAIT_ERRORS.push(key); resolve(); };
  img.src = src;
})));
function ciPortrait(who){
  return CINE_PORTRAITS[who] || ciPortraitLegacy(({t800Bare:'t800',t1000Frozen:'t1000',johnRelieved:'john'})[who] || who);
}

// Portraits have their own anatomy; only compositing and scene lighting are shared.
function ciFace(g,who,x,y,scale=2,flip=false,light=null){
  let art=ciPortrait(who);
  if(light && CINE_PORTRAITS[who]){
    art=ciAsset('portrait-light-'+who+'-'+light,224,256,c=>{
      c.drawImage(art,0,0,224,256);
      c.globalCompositeOperation='source-atop';
      const glow=c.createLinearGradient(0,0,224,0);
      if(light==='warm'){glow.addColorStop(0,'rgba(10,35,65,0.12)');glow.addColorStop(.55,'rgba(235,118,40,0)');glow.addColorStop(1,'rgba(255,157,65,0.28)');}
      else {glow.addColorStop(0,'rgba(108,185,225,0.18)');glow.addColorStop(1,'rgba(20,48,72,0.08)');}
      c.fillStyle=glow;c.fillRect(0,0,224,256);c.globalCompositeOperation='source-over';
    });
  }
  g.save();g.imageSmoothingEnabled=false;g.translate(Math.round(x),Math.round(y));
  if(flip){g.translate(112*scale,0);g.scale(-1,1);}

// Self-contained Web Audio score: layered synths, resonant metal and stereo room.
// Gameplay effects retain their pulse/triangle/LFSR palette on a separate bus.
// Nothing here may throw: with no AudioContext the game runs silent, and every sound call is guarded.
const AUDIO = {ctx: null, ok: false, failed: false, muted: false, notesScheduled: 0, sfxCount: 0, trackName: null, cur: null, timer: null, wave: {}, noise: {}, master: null, music: null, sfxBus: null};

function readMuted(){ try { return localStorage.getItem(CFG.AUDIO_MUTE_KEY) === '1'; } catch (e) { return false; } }
AUDIO.muted = readMuted();
// Set mute: the master gain goes to zero, but scheduling carries on so the note count stays testable.
function setMuted(on){
  AUDIO.muted = on;

// Build the pulse wave for duty d from the real Fourier coefficients of a pulse: a_n = 2 sin(n pi d) / (n pi).
function pulseWave(ctx, d){
  const N = 32, re = new Float32Array(N), im = new Float32Array(N);

// One second of LFSR noise. Long mode feeds bit0^bit1 into bit 14 (15-bit); short mode feeds bit0^bit6 into bit 6 (7-bit). Output is +/-0.5.
function lfsrBuffer(ctx, short){
  const len = ctx.sampleRate, buf = ctx.createBuffer(1, len, ctx.sampleRate), out = buf.getChannelData(0);
  let reg = 1;

    else { const fb = (reg ^ (reg >> 1)) & 1; reg = ((reg >> 1) | (fb << 14)) & 0x7fff; }
    out[i] = (reg & 1) ? 0.5 : -0.5;

// Create the context on the first input (browsers need a gesture). Any failure leaves the game silent.
function audioInit(){

    if (!Ctx){ AUDIO.failed = true; return; }
    const ctx = new Ctx();
    setupAudioGraph(ctx);

    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    AUDIO.ok = true;
  } catch (e) { AUDIO.failed = true; }

// Shared graph construction also supports offline score rendering.
function setupAudioGraph(ctx){
    AUDIO.ctx = ctx;
    AUDIO.master = ctx.createGain(); AUDIO.master.gain.value = AUDIO.muted ? 0 : CFG.AUDIO_MASTER; AUDIO.master.connect(ctx.destination);
    AUDIO.music = ctx.createGain(); AUDIO.music.connect(AUDIO.master);
    AUDIO.sfxBus = ctx.createGain(); AUDIO.sfxBus.connect(AUDIO.master);
    AUDIO.room=scoreRoom(ctx);

function noteFreq(name, oct){

// Cinematic score: authored phrases in quarter-note beats, independent of the
// gameplay clock. Supports fractional beats, variable meters and long sustains.
// T2-inspired arrangement: D-minor motif, five-stroke pulse, metallic percussion.
// All instruments and the room impulse are synthesized locally; no media fetches.
function scoreRoom(ctx){
  const seconds=1.8, b=ctx.createBuffer(2,Math.ceil(ctx.sampleRate*seconds),ctx.sampleRate);

  for(let c=0;c<2;c++){
    const a=b.getChannelData(c);let low=0;
    for(let i=0;i<a.length;i++){
      seed=(Math.imul(seed,1664525)+1013904223)>>>0;
      low=low*0.65+((seed/4294967296)*2-1)*0.35;
      const time=i/ctx.sampleRate;
      a[i]=time<0.024?0:low*Math.exp(-time*3.9)*0.6;
    }
    for(const [sec,level] of [[0.039,0.32],[0.071,0.22],[0.113,0.14]]) a[Math.floor((sec+c*0.009)*ctx.sampleRate)]+=level;
  }

function newScoreBus(t){

  verb.buffer=AUDIO.room;wet.gain.value=0.38;

  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(0.9,t+0.12);
  return {input,send,verb,wet,out,voices:new Set(),retired:false};
}
function retireScoreBus(bus,t){
  if(!bus || bus.retired)return;
  bus.retired=true;
  const g=bus.out.gain;
  if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(t);
  else{g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);}
  g.linearRampToValueAtTime(0,t+0.16);
  // Stop even notes scheduled ahead of a quick screen change. SFX use another bus.
  for(const voice of bus.voices)for(const source of voice.sources){try{source.stop(t+0.17);}catch(e){/* already ended */}}
